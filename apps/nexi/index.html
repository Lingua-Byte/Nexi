<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#87964b"><title>NEXI</title><link rel="manifest" href="manifest.webmanifest"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:16px system-ui,sans-serif}body{display:flex;justify-content:center;background:#66783a;color:#26351f}.game{width:min(100%,520px);min-height:100vh;padding:12px 12px 108px;background:linear-gradient(#bdcb80,#95a957 43%,#6d843c);position:relative;overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;letter-spacing:.16em;font-size:1.55rem}.gen{background:#fffce5dd;border-radius:99px;padding:6px 10px;font-size:.72rem;font-weight:900}.needs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}.need{background:#fffde84d;border:1px solid #fff9;border-radius:11px;padding:5px 7px;font-size:.64rem}.bar{height:9px;background:#56683a55;border-radius:99px;overflow:hidden;margin-top:4px}.fill{height:100%;background:#fff4b0;border-radius:99px;transition:width .35s}.habitat{height:410px;position:relative;border-radius:30px;border:2px solid #fff8;overflow:hidden;background:linear-gradient(#dce9a555,#ffffff08);box-shadow:inset 0 -90px 0 #526b2c55;touch-action:none}.habitat:before{content:"";position:absolute;bottom:-45px;left:-10%;width:120%;height:125px;background:#4f682b99;border-radius:50% 50% 0 0}.sun{position:absolute;top:25px;left:28px;width:48px;height:48px;border-radius:50%;background:#f8df7caa;animation:sun 5s ease-in-out infinite}.cloud{position:absolute;top:55px;right:35px;font-size:46px;opacity:.42;animation:cloud 12s linear infinite}.object{position:absolute;z-index:4;user-select:none;transition:transform .25s}.plant{font-size:58px;left:7%;bottom:34px}.ball{font-size:45px;right:10%;bottom:34px}.bowl{font-size:42px;left:45%;bottom:26px}.pet{position:absolute;left:50%;top:48%;width: und:linear-gradient(#dce99f,#9db361);border-radius:18px;position:relative;overflow:hidden;touch-action:none;margin:10px 0}.arena:after{content:"";position:absolute;left:0;right:0;bottom:22px;border-top:3px dashed #61753d88}.runner{position:absolute;left:42px;bottom:25px;font-size:48px;z-index:3;line-height:1}.ob{position:absolute;bottom:25px;font-size:39px;z-index:2}.gamebox button{border:0;border-radius:12px;padding:12px 17px;font-weight:850;background:#26351f;color:#fff;margin:3px}.gamebox button.secondary{background:#dcd7b9;color:#26351f}.hint{font-size:.72rem;opacity:.65}.hide{position:absolute;z-index:4;font-size:40px;pointer-events:none}.bush{position:absolute;z-index:3;font-size:70px;line-height:1}.huntnexi{position:absolute;z-index:5;font-size:56px;line-height:1;cursor:pointer;filter:drop-shadow(0 6px 3px #26351455);animation:peek .28s ease}.heart{font-size:70px;position:absolute;cursor:pointer;user-select:none;filter:drop-shadow(0 5px 4px #26351455);animation:float 1s ease-in-out infinite}.tiny{font-size:.7rem;opacity:.7}@keyframes breathe{50%{transform:translate(-50%,-54%) scale(1.03)}}@keyframes happy{25%{transform:translate(-50%,-70%) rotate(-5deg)}50%{transform:translate(-50%,-50%) rotate(5deg)}75%{transform:translate(-50%,-65%) rotate(-3deg)}}@keyframes sleep{50%{transform:translate(-50%,-45%) scale(.96)}}@keyframes sun{50%{transform:scale(1.08);opacity:.8}}@keyframes cloud{50%{transform:translateX(-25px)}}@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}@keyframes peek{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}@keyframes float{50%{transform:translateY(-8px)}}@media(max-height:700px){.habitat{height:330px}.arena{height:240px}}@media(max-width:360px){.habitat{height:300px}.actions button{min-height:58px}}</style></head><body><main class="game"><div class="top"><div class="brand">NEXI</div><div class="gen" id="gen"></div></div><div class="needs" id="needs"></div><section class="habitat" id="habitat"><div class="sun"></div><div class="cloud">☁️</div><div class="bubble" id="bubble">Arraste-me!</div><div class="object plant" id="plant">🌿</div><div class="object ball" id="ball">🎾</div><div class="object bowl" id="bowl">🥣</div><div class="pet" id="pet"><img id="petImg" alt="NEXI"><div id="fallback" class="fallback" hidden>🐰</div></div><div class="event" id="event">Arraste NEXI pelo jardim!</div></section><div class="memory" id="memory"></div><nav class="actions" id="actions"></nav><div class="gameover" id="gameover"><div class="gamebox"><h2 id="gameTitle">Brincadeira!</h2><div id="gameText"></div><div id="score" class="score"></div><div id="record" class="record"></div><div class="arena" id="arena"></div><div class="hint" id="hint">Toque para interagir</div><div><button id="restartBtn">Jogar novamente</button><button class="secondary" id="closeBtn">Voltar para NEXI</button></div></div></div></main><script>const KEY='nexi-v11-state',REC='nexi-records';const GEN='nexi-generation';const pets=['rabbit','pig','panda','monkey','penguin','parrot'];const urls=pets.map(x=>`https://raw.githubusercontent.com/ETdoFresh/kenney.nl/master/kenney-animalpack/PNG/Round%20(outline)/${x}.png`);let generation=+(localStorage.getItem(GEN)||1);let records=JSON.parse(localStorage.getItem(REC)||'{"run":0,"catch":0,"tap":0}');let g={age:0,hunger:62,energy:70,joy:55,hygiene:68,bond:10,health:100,history:[],discoveries:[]};const A=[['feed','🍎','Comer'],['play','🎾','Brincar'],['wash','🫧','Banho'],['sleep','🌙','Dormir']];const $=id=>document.getElementById(id),clamp=x=>Math.max(0,Math.min(100,x));function load(){try{g=Object.assign(g,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}}function save(){localStorage.setItem(KEY,JSON.stringify(g))}function audio(kind='8bit'){try{if(!window.ac)window.ac=new AudioContext();const c=window.ac,o=c.createOscillator(),gain=c.createGain();o.type=kind==='tribal'?'triangle':'square';o.frequency.value=kind==='tribal'?110:523;gain.gain.setValueAtTime(.0001,c.currentTime);gain.gain.exponentialRampToValueAtTime(.045,c.currentTime+.015);gain.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.16);o.connect(gain).connect(c.destination);o.start();o.stop(c.currentTime+.18)}catch(e){}}function music(kind){try{if(window.musicTimer)clearInterval(window.musicTimer);audio(kind);window.musicTimer=setInterval(()=>audio(kind),kind==='tribal'?420:620)}catch(e){}}function stopMusic(){if(window.musicTimer)clearInterval(window.musicTimer)}function animate(k){pet.classList.remove('happy','sleepy');void pet.offsetWidth;pet.classList.add(k)}function render(){gen.textContent='Geração '+String(generation).padStart(3,'0');needs.innerHTML=[['Fome',100-g.hunger],['Energia',g.energy],['Alegria',g.joy],['Saúde',g.health],['Higiene',g.hygiene],['Vínculo',g.bond]].map(([n,v])=>`<div class="need">${n}<div class="bar"><div class="fill" style="width:${clamp(v)}%"></div></div></div>`).join('');actions.innerHTML=A.map(a=>`<button onclick="act('${a[0]}')"><span>${a[1]}</span>${a[2]}</button>`).join('');bubble.textContent=g.hunger<25?'Estou com fome!':g.energy<20?'Quero dormir!':g.joy<25?'Vamos brincar!':g.bond>60?'Gosto muito de você!':'Arraste-me pelo jardim!';memory.innerHTML='<b>Memória:</b> '+(g.history[0]||'NEXI ainda está conhecendo você.');const img=$('petImg');img.onerror=()=>{img.hidden=true;fallback.hidden=false};img.src=urls[(generation-1)%urls.length]}function act(id){audio();if(id==='play'){startGame();return}g.age++;if(id==='feed'){g.hunger=clamp(g.hunger+22);animate('happy');g.history.unshift('NEXI percebeu que você cuida dele.')}if(id==='wash'){g.hygiene=clamp(g.hygiene+28);animate('happy');g.history.unshift('NEXI ficou limpinho.')}if(id==='sleep'){g.energy=clamp(g.energy+30);animate('sleepy');g.history.unshift('NEXI descansou.')}g.joy=clamp(g.joy+2);g.bond=clamp(g.bond+1);g.history=g.history.slice(0,12);save();render()}function openGame(title,text){gameover.style.display='flex';gameTitle.textContent=title;gameText.textContent=text;score.textContent='';record.textContent='';arena.innerHTML='';hint.textContent='';audio()}function startGame(){const t=['run','catch','tap'][Math.floor(Math.random()*3)];if(t==='run')run();if(t==='catch')hunt();if(t==='tap')tap()}function finish(type,points,msg){records[type]=Math.max(records[type],points);localStorage.setItem(REC,JSON.stringify(records));g.joy=clamp(g.joy+Math.min(20,Math.ceil(points/4)));g.bond=clamp(g.bond+Math.min(6,Math.ceil(points/8)));g.history.unshift(msg);g.history=g.history.slice(0,12);save();render();animate('happy');score.textContent=String(points);record.textContent='Recorde: '+records[type];stopMusic()}function run(){openGame('🦖 NEXI RUN','Toque para pular. Começa fácil e acelera aos poucos.');hint.textContent='Um toque: pular';const r=document.createElement('div');r.className='runner';r.textContent='🐰';arena.appendChild(r);let alive=true,scoreN=0,speed=3.2,last=performance.now(),next=900,obs=[];function jump(){if(!alive)return;audio();r.classList.remove('jump');void r.offsetWidth;r.animate([{transform:'translateY(0)'},{transform:'translateY(-86px)'},{transform:'translateY(0)'}],{duration:560,easing:'ease-out'})}arena.onpointerdown=jump;function add(){if(!alive)return;const o=document.createElement('div');o.className='ob';o.textContent=Math.random()>.55?'🌵':'🌿';o.style.left=arena.clientWidth+20+'px';arena.appendChild(o);obs.push(o)}function loop(now){if(!alive)return;const dt=Math.min(40,now-last);last=now;speed=Math.min(7.5,3.2+scoreN*.035);next-=dt;if(next<=0){add();next=Math.max(520,1000-scoreN*9)}const rr=r.getBoundingClientRect();for(let i=obs.length-1;i>=0;i--){const o=obs[i],x=parseFloat(o.style.left)-speed*dt/16;o.style.left=x+'px';const or=o.getBoundingClientRect();if(or.right<0){o.remove();obs.splice(i,1);scoreN++;continue}if(or.left<rr.right-8&&or.right>rr.left+8&&or.top<rr.bottom-8&&or.bottom>rr.top+8){alive=false;obs.forEach(x=>x.remove());score.textContent=String(scoreN);record.textContent='Fim de jogo • Recorde: '+Math.max(records.run,scoreN);hint.textContent='O mundo congelou. Tudo parou.';records.run=Math.max(records.run,scoreN);localStorage.setItem(REC,JSON.stringify(records));g.joy=clamp(g.joy+Math.min(18,scoreN/2));g.history.unshift('NEXI correu '+scoreN+' metros com você.');save();render();stopMusic();return}}score.textContent=String(scoreN);requestAnimationFrame(loop)}requestAnimationFrame(loop)}function hunt(){openGame('🌿 NEXI CAÇA','Ele está escondido! Encontre NEXI atrás da vegetação.');hint.textContent='Toque quando encontrar NEXI • 8 acertos';music('tribal');let n=0;function place(){arena.innerHTML='';for(let i=0;i<5;i++){const b=document.createElement('div');b.className='bush';b.textContent=i%2?'🌿':'🌳';b.style.left=(5+Math.random()*82)+'%';b.style.top=(35+Math.random()*48)+'%';arena.appendChild(b)}const x=18+Math.random()*65,y=30+Math.random()*50;const p=document.createElement('div');p.className='huntnexi';p.textContent='🐰';p.style.left=x+'%';p.style.top=y+'%';p.style.opacity='.88';p.onclick=()=>{audio('tribal');n++;if(n>=8){finish('catch',8,'NEXI adorou brincar de esconde-esconde!');gameText.textContent='Você encontrou NEXI 8 vezes!';return}score.textContent=n+'/8';place()};arena.appendChild(p)}place()}function tap(){openGame('💚 NEXI POP','Clique no coração o máximo que conseguir em 10 segundos.');hint.textContent='Toque rápido!';music('8bit');let n=0,done=false,h=document.createElement('div');h.className='heart';h.textContent='💚';arena.appendChild(h);function move(){h.style.left=(10+Math.random()*78)+'%';h.style.top=(12+Math.random()*68)+'%'}move();h.onclick=()=>{if(done)return;n++;audio();score.textContent=n;move()};setTimeout(()=>{done=true;finish('tap',n,'NEXI adorou sua brincadeira de reflexos!');gameText.textContent='Tempo! Você fez '+n+' cliques.'},10000)}function closeGame(){stopMusic();gameover.style.display='none';arena.innerHTML=''}restartBtn.onclick=()=>{stopMusic();const t=gameTitle.textContent;if(t.includes('RUN'))run();else if(t.includes('CAÇA'))hunt();else tap()};closeBtn.onclick=closeGame;let drag=false,dx=0,dy=0;pet.addEventListener('pointerdown',e=>{drag=true;pet.classList.add('dragging');pet.setPointerCapture(e.pointerId);const r=pet.getBoundingClientRect();dx=e.clientX-(r.left+r.width/2);dy=e.clientY-(r.top+r.height/2);e.preventDefault()});pet.addEventListener('pointermove',e=>{if(!drag)return;const r=habitat.getBoundingClientRect(),half=pet.offsetWidth/2;let x=e.clientX-r.left-dx,y=e.clientY-r.top-dy;x=Math.max(half,Math.min(r.width-half,x));y=Math.max(half,Math.min(r.height-half,y));pet.style.left=x+'px';pet.style.top=y+'px';pet.style.transform='translate(-50%,-50%)'});pet.addEventListener('pointerup',e=>{drag=false;pet.classList.remove('dragging');try{pet.releasePointerCapture(e.pointerId)}catch(_){}checkObjects()});pet.addEventListener('pointercancel',()=>{drag=false;pet.classList.remove('dragging')});function checkObjects(){const p=pet.getBoundingClientRect();[['plant','NEXI encontrou uma planta!'],['ball','NEXI encontrou a bola!'],['bowl','NEXI encontrou o potinho!']].forEach(([id,msg])=>{const o=$(id),r=o.getBoundingClientRect();if(p.left<r.right&&p.right>r.left&&p.top<r.bottom&&p.bottom>r.top){if(id==='bowl')g.hunger=clamp(g.hunger+14);if(id==='ball')g.joy=clamp(g.joy+10);if(id==='plant')g.bond=clamp(g.bond+3);g.history.unshift(msg);event.textContent=msg;animate('happy');audio();save();render()}})}load();render();</script></body></html>
