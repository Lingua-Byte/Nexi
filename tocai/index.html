<!doctype html><!--wrap-->
<html lang="pt-BR"><!--wrap-->
<head><!--wrap-->
<meta charset="utf-8"><!--wrap-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><!--wrap-->
<title>Tocaí</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app de duas pontas (contratante / músico). Topo fixo com marca, conteúdo em coluna de até 1080px, barra de abas no rodapé no celular. */
:root{
  --bg:#F4F5FA; --surface:#FFFFFF; --ink:#141629; --muted:#5B6077; --line:#E0E3EE; --soft:#ECEEFE;
  --accent:#2B37F5; --accent-ink:#FFFFFF; --spot:#FFC83D; --spot-ink:#2B2100;
  --ok:#11805B; --ok-soft:#E1F5EC; --warn:#A85800; --warn-soft:#FFF1DD; --bad:#C2253D; --bad-soft:#FDE6EA;
  --shadow:0 1px 2px rgba(20,22,41,.06),0 8px 24px rgba(20,22,41,.06);
  --f-display:"Bricolage Grotesque","Inter",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F1E; --surface:#161931; --ink:#ECEEF8; --muted:#A2A6C0; --line:#2A2E4A; --soft:#1E2246;
  --accent:#8189FF; --accent-ink:#0D0F1E; --spot:#FFC83D; --spot-ink:#2B2100;
  --ok:#43D29C; --ok-soft:#12342A; --warn:#FFB257; --warn-soft:#3A2A12; --bad:#FF7088; --bad-soft:#3D1822;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0F1E; --surface:#161931; --ink:#ECEEF8; --muted:#A2A6C0; --line:#2A2E4A; --soft:#1E2246;
  --accent:#8189FF; --accent-ink:#0D0F1E; --spot:#FFC83D; --spot-ink:#2B2100;
  --ok:#43D29C; --ok-soft:#12342A; --warn:#FFB257; --warn-soft:#3A2A12; --bad:#FF7088; --bad-soft:#3D1822;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px}
.brand{display:flex;align-items:center;gap:8px;font:800 1.45rem/1 var(--f-display);letter-spacing:-.03em;background:none;border:0;padding:0}
.brand svg{flex:none}
.brand i{font-style:normal;color:var(--accent)}
.topnav{display:flex;gap:4px;margin-left:auto}
.topnav button{background:none;border:0;padding:8px 12px;border-radius:10px;font-weight:600;color:var(--muted)}
.topnav button[aria-current="true"]{color:var(--ink);background:var(--soft)}
.modepill{font:600 .72rem/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;padding:6px 10px;border-radius:99px;background:var(--spot);color:var(--spot-ink)}

main{padding-block:20px 120px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs button{background:none;border:0;display:grid;justify-items:center;gap:2px;padding:6px 2px;font-size:.7rem;font-weight:600;color:var(--muted);border-radius:10px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="true"]{color:var(--accent)}
@media (max-width:760px){.topnav{display:none}.tabs{display:grid}.modepill{margin-left:auto}}

/* elementos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:8px 12px;font-size:.85rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:.76rem;font-weight:600;background:var(--soft);color:var(--ink);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.spot{background:var(--spot);color:var(--spot-ink)}
.label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.field{display:grid;gap:6px;min-width:0}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;min-width:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.stack{display:grid;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.back{background:none;border:0;padding:6px 0;font-weight:600;color:var(--muted);display:inline-flex;gap:6px;align-items:center;margin-bottom:12px}

/* explorar */
.hero{display:grid;gap:16px;padding-block:8px 20px}
.hero h1{font-size:clamp(1.9rem,5vw,3.1rem);font-weight:800;max-width:18ch}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--spot) 62%);padding:0 .08em}
.search{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
@media (max-width:760px){.search{grid-template-columns:1fr 1fr}.search .field:first-child{grid-column:1/-1}}
.eventrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.eventrow::-webkit-scrollbar{display:none}
.eventrow button{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:600;font-size:.88rem}
.eventrow button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:16px 0}
.filters .field{min-width:150px}
.check{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem;padding:10px 0}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid;text-align:left;padding:0;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card .body{padding:14px 16px 16px;display:grid;gap:8px}
.card h3{font-size:1.15rem}
.meta{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:.84rem;color:var(--muted);align-items:center}
.meta b{color:var(--ink)}
.price{font-weight:700}
.cover{position:relative;height:120px;display:flex;align-items:flex-end;padding:12px;color:#fff;overflow:hidden}
.cover svg.wave{position:absolute;inset:0;width:100%;height:100%}
.cover .chip{position:relative;background:rgba(0,0,0,.35);color:#fff;backdrop-filter:blur(4px)}
.cover.big{height:200px;border-radius:var(--r);padding:20px;align-items:flex-end}
.cover.big h1{position:relative;font-size:clamp(1.8rem,5vw,2.8rem);color:#fff}
.empty{padding:40px 20px;text-align:center;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--muted)}

/* perfil */
.profile{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start;margin-top:16px}
@media (max-width:900px){.profile{grid-template-columns:minmax(0,1fr)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font:700 1.3rem/1.2 var(--f-display)}
.stat span{font-size:.78rem;color:var(--muted)}
.pkg{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.pkg input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent)}
.pkg:has(input:checked){border-color:var(--accent);background:var(--soft)}
.pkg h3{font-size:1rem;font-family:var(--f-body);font-weight:700}
.setlist{list-style:none;margin:0;padding:0;font-family:var(--f-mono);font-size:.84rem;border-top:1px solid var(--line)}
.setlist li{display:grid;grid-template-columns:2.2em 1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.setlist li span:first-child,.setlist li span:last-child{color:var(--muted)}
.rider{margin:0;padding-left:18px;display:grid;gap:4px}
.review{display:grid;gap:4px;padding:14px 0;border-bottom:1px solid var(--line)}
.review:last-child{border-bottom:0}
.stars{color:var(--warn);letter-spacing:1px}
.aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.player{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--soft)}
.player .eq{display:flex;gap:3px;align-items:flex-end;height:22px}
.player .eq i{width:4px;background:var(--accent);border-radius:2px;height:30%}
.player.on .eq i{animation:eq .8s ease-in-out infinite}
.player.on .eq i:nth-child(2){animation-delay:-.2s}.player.on .eq i:nth-child(3){animation-delay:-.45s}.player.on .eq i:nth-child(4){animation-delay:-.6s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}

/* checkout */
.checkout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
@media (max-width:900px){.checkout{grid-template-columns:minmax(0,1fr)}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.opt{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface)}
.opt input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.opt:has(input:checked){border-color:var(--accent);background:var(--soft)}
.opt .grow{flex:1;min-width:0}
.sum{display:grid;gap:8px}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum .total{border-top:1px solid var(--line);padding-top:10px;margin-top:4px;font-weight:700;font-size:1.1rem}
.safe{display:flex;gap:10px;padding:12px;border-radius:12px;background:var(--ok-soft);color:var(--ok);font-size:.86rem;font-weight:500}
.safe svg{flex:none}
.err{color:var(--bad);font-size:.82rem;font-weight:600}

/* pedido */
.steps{list-style:none;margin:0;padding:0;display:grid}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:12px;position:relative;padding-bottom:18px}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps li.done::before{background:var(--accent)}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:.75rem;font-weight:700;color:var(--muted);position:relative;z-index:1}
.steps li.done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps li.now .dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 5px var(--soft)}
.steps li.now b{color:var(--accent)}
.statusbar{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:18px 20px;border-radius:var(--r);background:var(--ink);color:var(--bg)}
.statusbar h2{font-size:1.4rem}
.statusbar .muted{color:inherit;opacity:.7}
.chat{display:grid;gap:8px;max-height:280px;overflow-y:auto;padding:4px}
.msg{max-width:80%;padding:8px 12px;border-radius:14px;font-size:.9rem;background:var(--soft);justify-self:start}
.msg.me{justify-self:end;background:var(--accent);color:var(--accent-ink)}
.msg small{display:block;opacity:.65;font-size:.7rem}
.chatform{display:flex;gap:8px;margin-top:10px}
.chatform input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.olist{display:grid;gap:12px}
.oitem{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-align:left;width:100%}
.thumb{width:56px;height:56px;border-radius:12px;overflow:hidden;position:relative;display:grid;place-items:center;color:#fff;font:800 1.1rem var(--f-display)}
.thumb svg{position:absolute;inset:0;width:100%;height:100%}
.thumb span{position:relative}
.rate{display:flex;gap:4px}
.rate button{background:none;border:0;font-size:1.8rem;color:var(--line);padding:0 2px;line-height:1}
.rate button.on{color:var(--warn)}
.confirm{padding:14px;border-radius:12px;background:var(--bad-soft);display:grid;gap:10px}

/* músico */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.kpi b{display:block;font:800 1.7rem/1.1 var(--f-display);margin-top:4px}
.kpi.hl{background:var(--spot);color:var(--spot-ink);border-color:transparent}
.kpi.hl .label{color:inherit;opacity:.75}
.dash{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
@media (max-width:900px){.dash{grid-template-columns:minmax(0,1fr)}}
.req{display:grid;gap:10px;padding:16px 0;border-bottom:1px solid var(--line)}
.req:last-child{border-bottom:0}
.req .top2{display:flex;justify-content:space-between;gap:12px;align-items:start;flex-wrap:wrap}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:.82rem}
.cal .h{font-size:.68rem;font-weight:700;color:var(--muted);padding:4px 0}
.cal .d{aspect-ratio:1;max-width:100%;display:grid;place-items:center;border-radius:10px;font-family:var(--f-mono)}
.cal .d.busy{background:var(--accent);color:var(--accent-ink);font-weight:600}
.cal .d.pend{box-shadow:inset 0 0 0 2px var(--warn);color:var(--warn);font-weight:600}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* como funciona */
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:900px){.how{grid-template-columns:1fr}}
.how ol{margin:0;padding-left:20px;display:grid;gap:8px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
td.n{font-family:var(--f-mono);white-space:nowrap}

.sectionhead{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sectionhead h2{font-size:1.35rem}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:40;transition:.25s;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.stickybuy{display:none}
@media (max-width:900px){
  .aside{position:static}
  .stickybuy{display:flex;position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:19;background:var(--surface);border-top:1px solid var(--line);
    padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));justify-content:space-between;align-items:center;gap:12px}
}
@media (min-width:761px) and (max-width:900px){.stickybuy{bottom:0}}
@media (max-width:900px){.toast{bottom:calc(140px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head><!--wrap-->
<body><!--wrap-->
<header class="top">
  <div class="wrap">
    <button class="brand" data-go="explorar" aria-label="Tocaí, início">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="9" fill="var(--accent)"/><g fill="var(--accent-ink)"><rect x="7" y="12" width="3" height="8" rx="1.5"/><rect x="12" y="8" width="3" height="14" rx="1.5"/><rect x="17" y="10" width="3" height="10" rx="1.5"/><rect x="22" y="13" width="2.5" height="5" rx="1.25"/></g></svg>
      <span>Toca<i>í</i></span>
    </button>
    <nav class="topnav" id="topnav"></nav>
    <span class="modepill" id="modepill">Protótipo</span>
  </div>
</header>
<main class="wrap" id="app"></main>
<nav class="tabs" id="tabs"></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- dados de exemplo ---------- */
const TODAY = '2026-11-14';
const EVENTS = ['Todos','Casamento','Aniversário','Corporativo','Bar & restaurante','Formatura','Cerimônia religiosa'];
const FORMATIONS = ['Todas','Solo','Duo','Trio','Quarteto','Grupo','Banda','DJ','Coral'];
const ARTISTS = [
 {id:'mare',name:'Duo Maré Alta',formation:'Duo',genres:['MPB','Bossa nova','Pop acústico'],events:['Casamento','Aniversário','Bar & restaurante','Corporativo'],rating:4.9,reviews:128,km:6,hue:200,response:'15 min',shows:312,repertoire:186,
  bio:'Voz, violão e percussão leve. Especialistas em cerimônias ao ar livre, jantares e fins de tarde.',
  setlist:[['Garota de Ipanema','Tom Jobim','2:44'],['Velha Infância','Tribalistas','4:08'],['Ainda Bem','Marisa Monte','3:28'],['Trem-Bala','Ana Vilela','3:42'],['Perfect','Ed Sheeran','4:23'],['Sozinho','Peninha','3:51']],
  rider:['2 tomadas 220 V a até 5 m do palco','Área coberta de 3 × 2 m','Sala para troca de roupa'],

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = n => n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const MONTHS = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const WEEK = ['dom','seg','ter','qua','qui','sex','sáb'];
const dParts = s => s.split('-').map(Number);
const dObj = s => { const [y,m,d] = dParts(s); return new Date(y, m-1, d); };
const dShort = s => { const [,m,d] = dParts(s); return d + '/' + MONTHS[m-1]; };
const dLong = s => { const o = dObj(s); return WEEK[o.getDay()] + ', ' + o.getDate() + ' de ' + MONTHS[o.getMonth()]; };
const daysUntil = s => Math.round((dObj(s) - dObj(TODAY)) / 864e5);
const artist = id => ARTISTS.find(a => a.id === id);
const initials = n => n.split(' ').filter(w => w.length > 2 || /^[A-Z]/.test(w)).slice(0,2).map(w => w[0]).join('').toUpperCase();
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2600); }
function store(k, v){ try { if (v === undefined) return JSON.parse(localStorage.getItem('tocai:' + k)); localStorage.setItem('tocai:' + k, JSON.stringify(v)); } catch(e) { return null; } }

function seeded(seed){ let x = 0; for (const c of seed) x = (x * 31 + c.charCodeAt(0)) >>> 0; return () => (x = (x * 1664525 + 1013904223) >>> 0) / 4294967296; }
function waveSVG(a, bars = 48){
  const r = seeded(a.id); let s = '';
  for (let i = 0; i < bars; i++){ const h = 15 + r() * 70 * (0.55 + 0.45 * Math.sin(i / bars * Math.PI)); s += `<rect x="${i * (100/bars) + .4}" y="${50 - h/2}" width="${100/bars - .8}" height="${h}" rx=".6" fill="rgba(255,255,255,${.18 + r() * .22})"/>`; }
  return `<svg class="wave" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="g${a.id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${a.hue} 72% 46%)"/><stop offset="1" stop-color="hsl(${(a.hue + 40) % 360} 70% 28%)"/></linearGradient></defs><rect width="100" height="100" fill="url(#g${a.id})"/>${s}</svg>`;
}

/* ---------- preço ---------- */
function quote(a, p, extras, guests){
  let ex = 0; const lines = [];
  for (const id of extras){ const e = EXTRAS.find(x => x.id === id); const v = e.price ?? Math.round(p.price / p.hours * 0.8); ex += v; lines.push([e.name, v]); }
  const travel = Math.max(0, a.km - KM_FREE) * KM_PRICE * 2;
  const base = p.price + ex + travel;
  const fee = Math.round(base * FEE_CLIENT);
  return { lines, travel, base, fee, total: base + fee };
}

function vExplorar(){
  const f = state.f, q = f.q.trim().toLowerCase();
  let list = ARTISTS.filter(a =>
    (f.event === 'Todos' || a.events.includes(f.event)) &&
    (f.formation === 'Todas' || a.formation === f.formation) &&
    (!q || (a.name + ' ' + a.genres.join(' ')).toLowerCase().includes(q)) &&
    (!f.onlyFree || !a.busy.includes(f.date)));
  const minP = a => Math.min(...a.packages.map(p => p.price));
  const sorts = { relevancia:(x,y) => (y.rating * Math.log(y.reviews)) - (x.rating * Math.log(x.reviews)), preco:(x,y) => minP(x) - minP(y), distancia:(x,y) => x.km - y.km, nota:(x,y) => y.rating - x.rating };
  list.sort(sorts[f.sort]);
  const opt = (arr, v) => arr.map(o => `<option ${o === v ? 'selected' : ''}>${o}</option>`).join('');
  return `
  <section class="hero">
    <span class="label">São Paulo e região · ${ARTISTS.length} artistas verificados</span>
    <h1>Música ao vivo para o seu evento, <em>contratada em minutos</em>.</h1>
    <div class="search" role="search">
      <div class="field"><label class="label" for="q">Artista ou estilo</label><input id="q" data-f="q" value="${esc(f.q)}" placeholder="Samba, jazz, DJ, cordas…" autocomplete="off"></div>
      <div class="field"><label class="label" for="date">Data do evento</label><input id="date" type="date" data-f="date" value="${f.date}" min="${TODAY}"></div>
      <div class="field"><label class="label" for="form">Formação</label><select id="form" data-f="formation">${opt(FORMATIONS, f.formation)}</select></div>
    </div>
  </section>
  <div class="eventrow" role="group" aria-label="Tipo de evento">
    ${EVENTS.map(e => `<button data-event="${e}" aria-pressed="${f.event === e}">${e}</button>`).join('')}
  </div>
  <div class="filters">
    <div class="field"><label class="label" for="sort">Ordenar por</label><select id="sort" data-f="sort">
      ${[['relevancia','Mais relevantes'],['nota','Melhor avaliados'],['preco','Menor preço'],['distancia','Mais perto']].map(([k,l]) => `<option value="${k}" ${f.sort === k ? 'selected' : ''}>${l}</option>`).join('')}
    </select></div>
    <label class="check"><input type="checkbox" id="free" data-f="onlyFree" ${f.onlyFree ? 'checked' : ''}> Só quem está livre em ${dShort(f.date)}</label>
  </div>
  <div class="sectionhead"><h2>${list.length} ${list.length === 1 ? 'artista' : 'artistas'}${f.event !== 'Todos' ? ' para ' + f.event.toLowerCase() : ''}</h2></div>
  ${list.length ? `<div class="grid">${list.map(card).join('')}</div>` : `<div class="empty">Nenhum artista com esses filtros. Tente outra data ou formação.</div>`}`;
}
function card(a){
  const free = !a.busy.includes(state.f.date);
  return `<button class="card" data-artist="${a.id}">
    <div class="cover">${waveSVG(a)}<span class="chip">${a.formation}</span></div>
    <div class="body">
      <h3>${esc(a.name)}</h3>
      <div class="meta">${a.genres.join(' · ')}</div>

        <tr><td>Deslocamento</td><td>Grátis até ${KM_FREE} km; depois R$ ${KM_PRICE}/km ida e volta, repassado 100% ao músico</td><td class="n">variável</td></tr>
      </tbody></table></div></section>
  <section class="panel" style="margin-top:20px"><h2 style="margin-bottom:8px">Política de cancelamento</h2>
    <div class="tbl"><table><thead><tr><th>Quem cancela</th><th>Quando</th><th>O que acontece</th></tr></thead><tbody>
      <tr><td>Cliente</td><td class="n">≥ 30 dias</td><td>Reembolso integral</td></tr>
      <tr><td>Cliente</td><td class="n">7 a 29 dias</td><td>Reembolso de 50%; músico recebe 50% do cachê</td></tr>
      <tr><td>Cliente</td><td class="n">&lt; 7 dias</td><td>Sem reembolso; músico recebe o cachê integral</td></tr>
      <tr><td>Músico</td><td>Qualquer momento</td><td>Cliente recebe tudo de volta ou substituto; músico perde posição no ranking e, na 2ª vez, é suspenso</td></tr>
    </tbody></table></div></section>`;
}

/* ---------- render ---------- */
function render(){
  renderNav();
  const v = { explorar:vExplorar, artista:vArtista, checkout:vCheckout, pedidos:vPedidos, pedido:vPedido, musico:vMusico, 'como-funciona':vComo }[state.view] || vExplorar;
  $('#app').innerHTML = v();
  const chat = $('#chat'); if (chat) chat.scrollTop = chat.scrollHeight;
}
function keepFocus(id, fn){ const el = document.activeElement, pos = el && el.selectionStart; fn(); const n = document.getElementById(id); if (n){ n.focus(); try { if (pos != null) n.setSelectionRange(pos, pos); } catch(e){} } }

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-go]'); if (!t) return;
  const d = t.dataset;
  if (d.go){ if (d.go === 'explorar' || d.go === 'pedidos') ck.err = ''; go(d.go); return; }
  if (d.event){ state.f.event = d.event; render(); return; }
  if (d.artist){ state.pkg = null; go('artista', { artistId:d.artist }); return; }
  if ('checkout' in d){ Object.assign(ck, { extras:[], err:'', event:'' }); go('checkout'); return; }
  if (d.order){ go('pedido', { orderId:d.order }); return; }
  if (d.sample){ toggleSample(artist(d.sample)); return; }
  if (d.advance){ advance(d.advance); return; }
  if (d.rate){ const o = state.orders.find(x => x.id === state.orderId); o.rating = +d.rate; save(); render(); toast('Avaliação enviada'); return; }
  if ('cancelAsk' in d){ const o = state.orders.find(x => x.id === state.orderId), dd = daysUntil(o.date), r = dd >= 30 ? 1 : dd >= 7 ? .5 : 0;
    $('#cancelbox').innerHTML = `<div class="confirm"><b>Cancelar e receber ${brl(Math.round(o.total * r))} de volta?</b><div class="row"><button class="btn danger sm" data-cancel-yes>Sim, cancelar</button><button class="btn line sm" data-cancel-no>Manter pedido</button></div></div>`; return; }
  if ('cancelNo' in d){ render(); return; }
  if ('cancelYes' in d){ const o = state.orders.find(x => x.id === state.orderId), dd = daysUntil(o.date), r = dd >= 30 ? 1 : dd >= 7 ? .5 : 0;
    o.status = 'cancelado'; o.refund = Math.round(o.total * r); save(); render(); toast('Pedido cancelado'); return; }
  if (d.accept || d.decline){
    const id = d.accept || d.decline, ord = state.orders.find(o => o.id === id);
    if (ord){ ord.status = d.accept ? 'aceito' : 'cancelado'; if (d.decline) ord.refund = ord.total; if (d.accept) ord.chat.push({me:false,t:'Pedido aceito! Já reservei a data. Me conte quais músicas não podem faltar.',h:'agora'}); }
    else { const r = state.reqs.find(x => x.id === id); r.status = d.accept ? 'aceito' : 'recusado'; }
    save(); render(); toast(d.accept ? 'Show confirmado na agenda' : 'Pedido recusado'); return;
  }
});
document.addEventListener('input', e => {
  const el = e.target, d = el.dataset;
  if (d.f){
    const v = el.type === 'checkbox' ? el.checked : el.value;
    if (d.f === 'date' && !v) return;
    state.f[d.f] = v;
    if (el.tagName === 'INPUT' && el.type !== 'checkbox' && el.type !== 'date') keepFocus(el.id, render); else render();
    return;
  }
  if (d.ck){ ck[d.ck] = d.ck === 'guests' ? Math.max(1, +el.value || 1) : el.value; if (d.ck === 'place' && ck.err && el.value.trim()) { ck.err = ''; keepFocus(el.id, render); } return; }
});
document.addEventListener('change', e => {
  const el = e.target, d = el.dataset;
  if ('pkg' in d){ state.pkg = el.value; render(); return; }
  if (d.extra){ ck.extras = el.checked ? [...ck.extras, d.extra] : ck.extras.filter(x => x !== d.extra); render(); return; }
  if (d.pay){ ck.pay = d.pay; return; }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'ckform'){
    if (!ck.place.trim()){ ck.err = 'Informe o endereço do evento para o músico calcular o deslocamento.'; render(); $('#ck-place').focus(); return; }
    if (ck.pay === 'boleto' && daysUntil(state.f.date) < 15){ ck.err = 'Boleto só está disponível para eventos a mais de 15 dias. Escolha Pix ou cartão.'; render(); return; }
    const a = artist(state.artistId), p = a.packages.find(x => x.id === state.pkg), qq = quote(a, p, ck.extras, ck.guests);
    const id = 'T-' + (2100 + state.orders.length + Math.floor(Math.random() * 90));
    state.orders.push({ id, artistId:a.id, pkg:p.name, hours:p.hours + (ck.extras.includes('hora') ? 1 : 0), date:state.f.date, time:ck.time, place:ck.place.trim(), event:ck.event, guests:ck.guests, note:ck.note.trim(), extras:[...ck.extras], pay:ck.pay, status:'solicitado', total:qq.total, created:TODAY, chat:[], rating:0 });
    save(); toast('Pedido enviado para ' + a.name); go('pedido', { orderId:id });
  }
  if (e.target.id === 'chatform'){
    const inp = $('#chatin'), txt = inp.value.trim(); if (!txt) return;
    const o = state.orders.find(x => x.id === state.orderId); o.chat.push({ me:true, t:txt, h:'agora' }); save(); render();
    setTimeout(() => { const replies = ['Combinado! Anotei aqui.','Perfeito, consigo incluir essa no repertório.','Chegamos 1 h antes para montar. Tem estacionamento no local?','Ótimo. Te mando o setlist final uma semana antes.'];
      o.chat.push({ me:false, t:replies[o.chat.length % replies.length], h:'agora' }); save(); if (state.view === 'pedido' && state.orderId === o.id) render(); }, 1400);
  }
});
function advance(id){
  const o = state.orders.find(x => x.id === id), i = stepIndex(o.status);
  if (i < STEPS.length - 1){ o.status = STEPS[i + 1].k;
    if (o.status === 'aceito') o.chat.push({ me:false, t:'Pedido aceito! Já reservei a data. Me conte quais músicas não podem faltar.', h:'agora' });
    save(); render(); toast(STEPS[i + 1].t); }
}
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TABS.some(t => t[0] === h) && h !== tabOf(state.view)) go(h); });

/* ---------- amostra sintetizada ---------- */
let AC = null, playing = null;
const SCALES = { major:[0,2,4,5,7,9,11], minor:[0,2,3,5,7,8,10], dorian:[0,2,3,5,7,9,10], mixolydian:[0,2,4,5,7,9,10] };
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function tone(ctx, out, f, t, dur, type, g){ const o = ctx.createOscillator(), v = ctx.createGain(); o.type = type; o.frequency.value = f; v.gain.setValueAtTime(0.0001, t); v.gain.exponentialRampToValueAtTime(g, t + 0.02); v.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(v).connect(out); o.start(t); o.stop(t + dur + 0.05); }
function noise(ctx, out, t, dur, g, hp){ const b = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate), ch = b.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1; const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), v = ctx.createGain(); f.type = 'highpass'; f.frequency.value = hp; s.buffer = b; v.gain.setValueAtTime(g, t); v.gain.exponentialRampToValueAtTime(0.0001, t + dur); s.connect(f).connect(v).connect(out); s.start(t); }
function kick(ctx, out, t, g = .8){ const o = ctx.createOscillator(), v = ctx.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(45, t + .15); v.gain.setValueAtTime(g, t); v.gain.exponentialRampToValueAtTime(0.0001, t + .3); o.connect(v).connect(out); o.start(t); o.stop(t + .35); }
function toggleSample(a){
  if (playing === a.id){ stopSample(); return; }
  stopSample();
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ toast('Seu navegador não toca áudio aqui.'); return; }
  const ctx = AC, out = ctx.createGain(); out.gain.value = .5; out.connect(ctx.destination);
  const s = a.sample, sc = SCALES[s.scale], beat = 60 / s.bpm, t0 = ctx.currentTime + .05;
  const prog = s.scale === 'major' ? [0,5,3,4] : [0,6,5,4];
  const note = (deg, oct = 0) => s.root + sc[((deg % 7) + 7) % 7] + 12 * (Math.floor(deg / 7) + oct);
  for (let bar = 0; bar < 4; bar++){
    const deg = prog[bar], bt = t0 + bar * 4 * beat;
    tone(ctx, out, mtof(note(deg, -1)), bt, beat * 1.8, 'sine', .32);
    tone(ctx, out, mtof(note(deg + 4, -1)), bt + beat * 2, beat * 1.8, 'sine', .25);
    for (let k = 0; k < 8; k++){
      const pat = [0,2,4,7,4,2,4,2][k] + (s.drums === 'house' && k % 2 ? 7 : 0);
      tone(ctx, out, mtof(note(deg + pat, 1)), bt + k * beat / 2, beat * (s.soft ? 1.2 : .45), s.wave, s.soft ? .06 : s.wave === 'square' || s.wave === 'sawtooth' ? .045 : .09);
    }
    for (let b = 0; b < 4; b++){
      const t = bt + b * beat;
      if (s.drums === 'house' || (s.drums === 'rock' && b % 2 === 0) || (s.drums === 'samba' && b % 2 === 1) || (s.drums === 'forro' && b % 2 === 0)) kick(ctx, out, t, s.drums === 'samba' ? .9 : .7);
      if (s.drums === 'rock' && b % 2 === 1) noise(ctx, out, t, .18, .35, 1200);
      if (['house','rock','samba','jazz','shaker','forro'].includes(s.drums)) for (let h = 0; h < (s.drums === 'samba' || s.drums === 'shaker' ? 4 : 2); h++) noise(ctx, out, t + h * beat / (s.drums === 'samba' || s.drums === 'shaker' ? 4 : 2), .05, s.drums === 'jazz' ? .08 : .12, 7000);
    }
  }
  playing = a.id;
  const p = $('#player'), btn = $('#playbtn'); if (p) p.classList.add('on'); if (btn) btn.textContent = '■ Parar';
  stopSample.h = setTimeout(stopSample, (16 * beat + .6) * 1000);
}
function stopSample(){
  clearTimeout(stopSample.h);
  if (AC){ try { AC.close(); } catch(e){} AC = null; }
  playing = null;
  const p = $('#player'), btn = $('#playbtn'); if (p) p.classList.remove('on'); if (btn) btn.textContent = '▶ Ouvir amostra';
}

/* ---------- início ---------- */
const h0 = location.hash.slice(1);
state.view = TABS.some(t => t[0] === h0) ? h0 : 'explorar';
render();
</script>
