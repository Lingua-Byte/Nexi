<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f120d">
<title>NEXI SFX Studio</title>
<style>
:root{--bg:#0f120d;--panel:#171c14;--panel2:#1f261b;--panel3:#283121;--line:#313d28;--text:#e8efd9;--muted:#93a184;
  --accent:#c4d585;--accent2:#f2cf62;--hot:#ef7d5a;--wave:#c9dc86;--wave2:#8fb8d9;--grid:#252e1f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:13px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
button,select,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.app{max-width:1500px;margin:0 auto;padding:10px 16px 30px}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.brand{font-weight:950;letter-spacing:.14em;font-size:1.2rem;margin-right:8px;white-space:nowrap}
.brand span{color:var(--accent)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .12s;white-space:nowrap}
.btn:hover{background:var(--panel3)} .btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);color:#1a2210;border-color:var(--accent);font-weight:800}
.btn.pri:hover{background:#d3e396}
.btn.sm{padding:4px 8px;font-size:.78rem}
.btn.on{border-color:var(--accent);color:var(--accent)}
.btn.rec{border-color:var(--hot);color:var(--hot)}
.chk{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:.8rem;cursor:pointer;user-select:none}
.status{color:var(--muted);font-size:.78rem;min-width:110px}
.sp{flex:1}
.vol{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:.78rem}
.vol input{width:80px}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr) 300px;gap:10px;align-items:start}
@media (max-width:1180px){.layout{grid-template-columns:230px minmax(0,1fr)}.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px}.right .card+.card{margin-top:0}}
@media (max-width:760px){.layout{grid-template-columns:1fr}.right{grid-template-columns:1fr}.lib .list{max-height:240px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:10px}
.card+.card{margin-top:10px}
.card h2{margin:0 0 8px;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:6px}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.tabs button{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px;cursor:pointer;font-size:.78rem}
.tabs button.on{border-color:var(--accent);color:var(--accent)}
input[type=text],input[type=search],input[type=number],select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.chips button{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:3px 9px;font-size:.74rem;cursor:pointer}
.chips button.on{background:var(--accent);color:#1a2210;border-color:var(--accent);font-weight:700}
.list{display:flex;flex-direction:column;gap:3px;max-height:calc(100vh - 260px);min-height:120px;overflow:auto}
.item{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid transparent;border-radius:8px;padding:5px 8px;cursor:pointer;font-size:.8rem}
.item:hover{border-color:var(--line)} .item.cur{border-color:var(--accent)}
.item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .cat{font-size:.65rem;color:var(--muted)}
.item button{background:none;border:0;color:var(--muted);cursor:pointer;padding:1px 4px}
.item button:hover{color:var(--text)}
.empty{color:var(--muted);font-size:.78rem;padding:6px 2px}
.viz{position:relative;background:#0a0c09;border:1px solid var(--line);border-radius:10px;overflow:hidden}
canvas{display:block;width:100%}
#cvWave{height:190px;cursor:pointer}
#cvSpec{height:190px;display:none;cursor:pointer}
.meters{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
@media (max-width:560px){.meters{grid-template-columns:repeat(3,1fr)}}
.meter{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 7px}
.meter b{display:block;font-size:.95rem;font-variant-numeric:tabular-nums}
.meter span{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.meter.warn b{color:var(--hot)}
.strip{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.lyr{display:flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:4px 6px 4px 4px;cursor:pointer;font-size:.78rem;max-width:200px}
.lyr.cur{border-color:var(--accent);background:var(--panel3)}
.lyr.off{opacity:.45}
.lyr .tag{font-size:.6rem;font-weight:800;background:var(--line);border-radius:5px;padding:1px 4px;color:var(--accent)}
.lyr .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lyr button{background:none;border:0;cursor:pointer;color:var(--muted);padding:0 2px;font-size:.72rem}
.lyr button.solo.on{color:var(--accent2);font-weight:800}
.lhead{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.lhead input[type=text]{flex:1;min-width:120px}
.sections{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px}
.sec{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.sec h3{margin:0 0 4px;font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);display:flex;justify-content:space-between;align-items:center}
.sec h3 button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.64rem}
.ctl{display:grid;grid-template-columns:104px minmax(0,1fr) 62px;align-items:center;gap:6px;padding:1.5px 0}
.ctl label{font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl .v{font-size:.7rem;text-align:right;font-variant-numeric:tabular-nums;cursor:text;border-radius:4px}
.ctl .v:hover{background:var(--panel3)}
.ctl .v.off{color:var(--muted)}
.ctl select{width:100%;padding:3px 6px;font-size:.76rem;grid-column:2/4}
.ctl.boolc input{justify-self:start}
input[type=range]{width:100%;accent-color:var(--accent);height:16px;margin:0}
.smpbar{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0 6px}
.kb{margin-top:10px}
.kbwrap{position:relative;height:96px;display:flex;user-select:none;touch-action:none;overflow:hidden;border-radius:8px}
.wk{flex:1;background:linear-gradient(#f4f6ee,#d9ddd0);border:1px solid #6d7563;border-top:0;border-radius:0 0 6px 6px;position:relative;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;font-size:.6rem;color:#555;padding-bottom:4px}
.wk.dn{background:linear-gradient(#cfe08a,#a8bd5c)}
.bk{position:absolute;top:0;height:60%;background:linear-gradient(#2a2f25,#11140f);border:1px solid #000;border-radius:0 0 5px 5px;z-index:2;cursor:pointer}
.bk.dn{background:linear-gradient(#a8bd5c,#6e8236)}
.kbbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.hint{color:var(--muted);font-size:.72rem;margin-top:6px}
kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;font-size:.68rem}
.lbl{font-size:.72rem;color:var(--muted);display:block;margin:6px 0 2px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,40px);background:var(--accent);color:#1a2210;padding:8px 16px;border-radius:99px;font-weight:800;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
details.mg{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:5px 9px;margin-bottom:6px}
details.mg summary{cursor:pointer;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700;padding:2px 0}
details.mg summary .st{color:var(--muted);font-weight:400;letter-spacing:0;text-transform:none;margin-left:6px}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">NEXI <span>SFX</span> STUDIO</div>
  <button class="btn pri" id="bPlay" title="Tocar (Espaço)">▶ Tocar</button>
  <button class="btn" id="bStop" title="Parar">■</button>
  <label class="chk"><input type="checkbox" id="cLoop"> Loop</label>
  <label class="chk"><input type="checkbox" id="cAuto" checked> Tocar ao editar</label>
  <button class="btn" id="bVary" title="Gerar variação (V)">🎲 Variar</button>
  <button class="btn sm" id="bUndo" title="Desfazer (Ctrl+Z)">↶</button>
  <button class="btn sm" id="bRedo" title="Refazer (Ctrl+Shift+Z)">↷</button>
  <button class="btn sm" id="bNew" title="Projeto vazio">Novo</button>
  <span class="status" id="status">—</span>
  <span class="sp"></span>
  <span class="vol">Monitor <input type="range" id="monVol" min="0" max="1" step="0.01" value="0.8"></span>
  <a class="btn sm" href="./">← NEXI</a>
</header>

<div class="layout">
  <aside class="lib">
    <div class="card">
      <div class="tabs"><button id="tLib" class="on">Biblioteca</button><button id="tMine">Meus sons</button></div>
      <div id="paneLib">
        <input type="search" id="search" placeholder="Buscar preset…" style="width:100%">
        <div class="chips" id="cats"></div>
        <div class="list" id="presetList"></div>
      </div>
      <div id="paneMine" style="display:none">
        <div class="row"><input type="text" id="saveName" placeholder="Nome do som" class="grow"><button class="btn sm" id="bSave">⭐ Salvar</button></div>
        <div class="list" id="bankList" style="margin-top:8px"></div>
        <div class="row" style="margin-top:8px">
          <button class="btn sm grow" id="bBankExp">Exportar banco</button>
          <button class="btn sm grow" id="bBankImp">Importar</button>
        </div>
      </div>
    </div>
  </aside>

  <main>
    <div class="card">
      <h2><span id="sndTitle">—</span>
        <span class="tabs" style="margin:0;width:170px"><button id="vWave" class="on">Onda</button><button id="vSpec">Espectro</button></span></h2>
      <div class="viz"><canvas id="cvWave"></canvas><canvas id="cvSpec"></canvas></div>
      <div class="meters" id="meters"></div>
    </div>
    <div class="card">
      <h2>Camadas <span class="row">
        <select id="addLayer"><option value="">+ Adicionar camada…</option></select>
      </span></h2>
      <div class="strip" id="strip"></div>
      <div id="editor"></div>
    </div>
    <div class="card kb">
      <div class="kbbar">
        <h2 style="margin:0">Teclado</h2>
        <button class="btn sm" id="octDn">Oitava −</button><span id="octLbl" class="status" style="min-width:0">C4</span><button class="btn sm" id="octUp">Oitava +</button>
        <button class="btn sm" id="bMidi">🎹 Conectar MIDI</button>
        <span class="hint" style="margin:0">Teclas <kbd>A</kbd>–<kbd>K</kbd> tocam notas · <kbd>Z</kbd>/<kbd>X</kbd> mudam a oitava · Dó central = altura original</span>
      </div>
      <div class="kbwrap" id="kbd"></div>
    </div>
  </main>

  <aside class="right">
    <div class="card">
      <h2>Master</h2>
      <div id="master"></div>
    </div>
    <div class="card">
      <h2>Exportar</h2>
      <div class="row">
        <select id="exRate" class="grow"><option>44100</option><option selected>48000</option><option>88200</option><option>96000</option></select>
        <select id="exBits" class="grow"><option value="16">16 bits</option><option value="24" selected>24 bits</option><option value="32">32 bits float</option></select>
        <select id="exCh" class="grow"><option value="2">Estéreo</option><option value="1">Mono</option></select>
      </div>
      <label class="lbl" for="exName">Nome do arquivo</label>
      <input type="text" id="exName" value="sfx" style="width:100%">
      <div class="row" style="margin-top:8px"><button class="btn pri grow" id="bWav">⬇ Baixar WAV</button></div>
      <label class="lbl">Variações (round-robin para jogos)</label>
      <div class="row">
        <input type="number" id="varN" min="2" max="64" value="8" style="width:64px">
        <input type="range" id="varAmt" min="0.05" max="1" step="0.01" value="0.5" class="grow" title="Intensidade da variação">
      </div>
      <div class="row" style="margin-top:6px">
        <button class="btn sm grow" id="bVarZip">⬇ Variações (ZIP)</button>
        <button class="btn sm grow" id="bStems">⬇ Stems (ZIP)</button>
      </div>
      <div class="row" style="margin-top:6px">
        <button class="btn sm grow" id="bProjExp">Salvar projeto</button>
        <button class="btn sm grow" id="bProjImp">Abrir projeto</button>
      </div>
      <div class="hint" id="exInfo"></div>
    </div>
    <div class="hint">Atalhos: <kbd>Espaço</kbd> tocar · <kbd>V</kbd> variar · <kbd>Ctrl+Z</kbd> desfazer · duplo clique num controle volta ao padrão · clique no valor para digitar</div>
  </aside>
</div>
</div>
<input type="file" id="fileAudio" accept="audio/*" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<div class="toast" id="toast"></div>
<script>
"use strict";
/* ======================================================================
   NEXI SFX Studio — motor de síntese (render offline, determinístico)
   ====================================================================== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dbToGain = db => Math.pow(10, db / 20);
const gainToDb = g => 20 * Math.log10(Math.max(g, 1e-12));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function polyblep(t, dt){
  if (t < dt){ t /= dt; return t+t-t*t-1; }
  if (t > 1-dt){ t = (t-1)/dt; return t*t+t+t+1; }
  return 0;
}
// Filtro de variáveis de estado ZDF (estável em qualquer frequência)
const newSVF = () => ({ic1:0, ic2:0, lp:0, bp:0, hp:0});
function svfTick(s, x, g, k){
  const a1 = 1/(1+g*(g+k)), a2 = g*a1, a3 = g*a2;
  const v3 = x - s.ic2, v1 = a1*s.ic1 + a2*v3, v2 = s.ic2 + a2*s.ic1 + a3*v3;
  s.ic1 = 2*v1 - s.ic1; s.ic2 = 2*v2 - s.ic2;
  s.lp = v2; s.bp = v1; s.hp = x - k*v1 - v2;
}
const panGains = p => { const a = (clamp(p,-1,1)+1)*Math.PI/4; return [Math.min(1, Math.SQRT2*Math.cos(a)), Math.min(1, Math.SQRT2*Math.sin(a))]; };

/* ---------------- Esquemas de parâmetros ---------------- */
const P = (k,l,min,max,def,s='lin',u='',x={}) => ({k,l,min,max,def,s,u,...x});
const C = (k,l,c,def) => ({k,l,c,def,s:'choice'});
const B = (k,l,def) => ({k,l,def,s:'bool'});
const LABELS = {saw:'Serra',square:'Quadrada',pulse:'Pulso',tri:'Triângulo',sine:'Seno',
  stack:'Pilha 3→2→1',par:'Paralelo',exp:'Exponencial',lin:'Linear',off:'Desligado',lp:'Passa-baixa',hp:'Passa-alta',bp:'Passa-banda',notch:'Rejeita-banda',
  '12':'12 dB/oit','24':'24 dB/oit',normal:'Normal',granular:'Granular',peak:'Pico',lufs:'LUFS',none:'Nenhuma'};

const MATERIALS = {
  madeira:{r:[1,2.756,5.404,8.933,13.344,18.638],t60:0.25,hf:3.0},
  metal:{r:[1,1.594,2.136,2.296,2.653,2.918,3.156,3.501,3.6,3.652,4.06,4.154,4.601,4.654,4.9,5.13],t60:2.2,hf:0.25},
  vidro:{r:[1,2.32,4.25,6.63,9.38,12.6,16.2],t60:1.6,hf:0.35},
  pedra:{r:null,t60:0.08,hf:2.0},
  plastico:{r:[1,2.76,5.4,8.9,13.3],t60:0.1,hf:3.5},
  ceramica:{r:[1,2.1,3.9,5.7,7.8,10.1],t60:0.5,hf:1.0},
  pele:{r:[1,1.594,2.136,2.296,2.653,2.918,3.156,3.501,3.6,3.652],t60:0.4,hf:1.2},
  sino:{r:[0.5,1,1.183,1.506,2,2.514,2.662,3.011,4.166,5.433,6.796],t60:4,hf:0.15},
};
const VOWELS = [
  {F:[600,1040,2250,2450,2750],A:[0,-7,-9,-9,-20],B:[60,70,110,120,130]},
  {F:[400,1620,2400,2800,3100],A:[0,-12,-9,-12,-18],B:[40,80,100,120,120]},
  {F:[250,1750,2600,3050,3340],A:[0,-30,-16,-22,-28],B:[60,90,100,120,120]},
  {F:[400,750,2400,2600,2900],A:[0,-11,-21,-20,-40],B:[40,80,100,120,120]},
  {F:[350,600,2400,2675,2950],A:[0,-20,-32,-28,-36],B:[40,80,100,120,120]},
];
const vowelFmt = v => ['A','E','I','O','U'][Math.round(v)] + (Math.abs(v-Math.round(v))>0.05 ? '~' : '');
const PHYS_ENV = {a:0.0005,d:30,s:1,len:2,r:0.05,curve:0};

const ENGINES = {
  analog:{name:'Analógico',tag:'ANL',params:[
    C('wave','Onda',['saw','square','pulse','tri','sine'],'saw'), P('freq','Frequência',20,12000,220,'log','Hz'),
    P('voices','Vozes (unison)',1,7,1,'int'), P('detune','Desafinação',0,100,12,'lin','ct'), P('spread','Abertura estéreo',0,1,0.6,'lin','%'),
    P('pw','Largura do pulso',0.05,0.95,0.3,'lin','%'), P('sub','Sub-oscilador',0,1,0,'lin','%'), P('noise','Ruído',0,1,0,'lin','%'), P('drift','Deriva analógica',0,1,0.2,'lin','%')]},
  fm:{name:'FM',tag:'FM',params:[
    P('freq','Frequência',20,12000,440,'log','Hz'), C('algo','Algoritmo',['stack','par'],'stack'),
    P('r1','Razão portadora',0.25,16,1,'log','x'), P('r2','Razão op 2',0.25,16,2,'log','x'), P('i2','Índice op 2',0,30,2,'sq'),
    P('r3','Razão op 3',0.25,16,3,'log','x'), P('i3','Índice op 3',0,30,0,'sq'), P('fb','Realimentação',0,1,0,'lin','%'),
    P('idxDecay','Decaimento do índice',0.005,20,0.5,'log','s'), P('idxSus','Índice sustentado',0,1,0.2,'lin','%'), P('stereo','Desafinação estéreo',0,30,0,'lin','ct')]},
  noise:{name:'Ruído',tag:'RUÍ',params:[
    C('color','Cor',['branco','rosa','marrom','azul','veludo'],'rosa'), P('stereo','Descorrelação estéreo',0,1,0.7,'lin','%'),
    P('modRate','Rajadas: velocidade',0.05,40,1,'log','Hz'), P('modDepth','Rajadas: intensidade',0,1,0,'lin','%')]},
  modal:{name:'Modal (impacto físico)',tag:'MOD',env:PHYS_ENV,params:[
    C('material','Material',Object.keys(MATERIALS),'metal'), P('freq','Frequência',30,8000,300,'log','Hz'),
    P('decay','Decaimento',0.05,6,1,'log','x'), P('damping','Amortecimento agudo',0,1,0.5,'lin','%'), P('hardness','Dureza do golpe',0,1,0.7,'lin','%'),
    P('modes','Modos',4,64,32,'int'), P('inharm','Inarmonicidade',0,1,0.2,'lin','%'), P('position','Ponto do golpe',0,1,0.3,'lin','%'),
    P('noise','Ruído de contato',0,1,0.2,'lin','%'), P('stereo','Abertura estéreo',0,1,0.6,'lin','%')]},
  string:{name:'Corda (física)',tag:'CRD',env:PHYS_ENV,params:[
    P('freq','Frequência',20,4000,220,'log','Hz'), P('decay','Sustentação',0.05,20,2,'log','s'), P('bright','Brilho',0,1,0.6,'lin','%'),
    P('pick','Ponto da palheta',0.02,0.5,0.15,'lin','%'), P('stereo','Desafinação estéreo',0,25,4,'lin','ct')]},
  particles:{name:'Partículas',tag:'PRT',params:[
    P('density','Densidade',0.5,4000,200,'log','/s'), P('fmin','Freq. mínima',30,16000,800,'log','Hz'), P('fmax','Freq. máxima',30,18000,5000,'log','Hz'),
    P('pdecay','Duração da partícula',0.0005,0.5,0.01,'log','s'), P('tone','Tom ↔ ruído',0,1,0.3,'lin','%'),

function renderAnalog(p, c){
  const {N, sr, pm, rnd} = c, L = new Float32Array(N), R = new Float32Array(N);
  const n = clamp(p.voices|0, 1, 7), vs = [];
  for (let v=0; v<n; v++){
    const x = n>1 ? v/(n-1)*2-1 : 0, [gl, gr] = panGains(x*p.spread);
    vs.push({det:x*p.detune, gl:gl*0.7071, gr:gr*0.7071, ph:n>1?rnd():0, dc:0, tg:0, nt:0});
  }
  const drAmt = p.drift*12, drA = 1 - Math.exp(-1/(0.15*sr)), norm = 1/Math.sqrt(n);
  let subPh = 0;
  for (let i=0; i<N; i++){
    const base = p.freq*pm[i]; let l = 0, r = 0;
    for (let v=0; v<n; v++){
      const o = vs[v];
      if (drAmt > 0){ if (i >= o.nt){ o.tg = (rnd()*2-1)*drAmt; o.nt = i + sr*(0.1+0.3*rnd()); } o.dc += (o.tg-o.dc)*drA; }
      let dt = base*Math.pow(2, (o.det+o.dc)/1200)/sr; if (dt > 0.49) dt = 0.49;
      o.ph += dt; if (o.ph >= 1) o.ph -= 1;
      const ph = o.ph; let s;
      switch (p.wave){
        case 'saw': s = 2*ph-1-polyblep(ph, dt); break;
        case 'square': case 'pulse': { const w = p.wave==='square' ? 0.5 : p.pw; s = ph < w ? 1 : -1; s += polyblep(ph, dt); let t2 = ph-w; if (t2 < 0) t2 += 1; s -= polyblep(t2, dt); break; }
        case 'tri': s = 4*Math.abs(ph-0.5)-1; break;
        default: s = Math.sin(TAU*ph);
      }
      l += s*o.gl; r += s*o.gr;
    }
    l *= norm; r *= norm;
    if (p.sub > 0){ subPh += base*0.5/sr; if (subPh >= 1) subPh -= 1; const s = Math.sin(TAU*subPh)*p.sub*0.8; l += s; r += s; }
    if (p.noise > 0){ l += (rnd()*2-1)*p.noise*0.5; r += (rnd()*2-1)*p.noise*0.5; }
    L[i] = l; R[i] = r;
  }
  return {L, R};
}

function renderFM(p, c){
  const {N, sr, pm} = c;
  const one = det => {
    const out = new Float32Array(N); let p1=0, p2=0, p3=0, prev=0;
    const dm = Math.pow(2, det/1200);
    for (let i=0; i<N; i++){
      const t = i/sr, base = p.freq*pm[i]*dm;
      const ie = p.idxSus + (1-p.idxSus)*Math.exp(-4.6*t/p.idxDecay);
      p1 += base*p.r1/sr; p2 += base*p.r2/sr; p3 += base*p.r3/sr;
      p1 -= Math.floor(p1); p2 -= Math.floor(p2); p3 -= Math.floor(p3);
      const o3 = Math.sin(TAU*p3 + p.fb*Math.PI*prev); prev = 0.5*(prev + o3);
      let o1;
      if (p.algo === 'par'){ const o2 = Math.sin(TAU*p2); o1 = Math.sin(TAU*p1 + p.i2*ie*o2 + p.i3*ie*o3); }
      else { const o2 = Math.sin(TAU*p2 + p.i3*ie*o3); o1 = Math.sin(TAU*p1 + p.i2*ie*o2); }
      out[i] = o1*0.5;
    }

  };
  if (p.stereo > 0) return {L: one(-p.stereo/2), R: one(p.stereo/2)};
  const m = one(0); return {L: m, R: m.slice()};
}

function noiseGen(color, rnd, sr){
  let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0, br=0, prev=0; const vp = 2000/sr;
  return () => {
    const w = rnd()*2-1;
    switch (color){
      case 'rosa': { b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759; b2=0.969*b2+w*0.153852; b3=0.8665*b3+w*0.3104856;
        b4=0.55*b4+w*0.5329522; b5=-0.7616*b5-w*0.016898; const o=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.2; b6=w*0.115926; return o; }
      case 'marrom': br = (br + 0.02*w)/1.02; return br*3.5;
      case 'azul': { const o = (w-prev)*0.5; prev = w; return o; }
      case 'veludo': return rnd() < vp ? (rnd()<0.5?-1:1) : 0;
      default: return w;
    }

}
function renderNoise(p, c){
  const {N, sr, rnd} = c, L = new Float32Array(N), R = new Float32Array(N);
  const gC = noiseGen(p.color, rnd, sr), gL = noiseGen(p.color, rnd, sr), gR = noiseGen(p.color, rnd, sr);
  const s = p.stereo, cs = Math.sqrt(1-s), is = Math.sqrt(s);
  const per = sr/p.modRate; let mA = rnd(), mB = rnd(), mT = 0;
  for (let i=0; i<N; i++){
    let g = 1;
    if (p.modDepth > 0){ if (++mT >= per){ mT -= per; mA = mB; mB = rnd(); } const x = mT/per; const sm = mA+(mB-mA)*(0.5-0.5*Math.cos(Math.PI*x)); g = 1 - p.modDepth*(1-sm); }
    const cm = gC();
    if (s > 0){ L[i] = (cm*cs + gL()*is)*g; R[i] = (cm*cs + gR()*is)*g; } else { L[i] = R[i] = cm*g; }
  }
  return {L, R};
}

function renderModal(p, c){
  const {N, sr, pm, rnd} = c, L = new Float32Array(N), R = new Float32Array(N);
  const mat = MATERIALS[p.material] || MATERIALS.metal, f0 = p.freq*pm[0], nM = p.modes|0, ratios = [];
  if (!mat.r){ ratios.push(1); for (let k=1; k<nM; k++) ratios.push(ratios[k-1] + 0.35 + rnd()*0.9); }
  else for (let k=0; k<nM; k++){
    if (k < mat.r.length) ratios.push(mat.r[k]);
    else { const a = ratios[k-1], b = ratios[k-2]; ratios.push(a + Math.max(0.15, a-b)*(0.6+rnd()*0.8)); }
  }
  const exLen = Math.max(2, Math.round((0.0002 + Math.pow(1-p.hardness,2)*0.008)*sr));
  const ea = Math.exp(-TAU*Math.min(250*Math.pow(2, p.hardness*6.2), sr*0.45)/sr), ex = new Float32Array(exLen);
  let lp = 0;
  for (let i=0; i<exLen; i++){ const w = Math.sin(Math.PI*(i+0.5)/exLen); lp = (1-ea)*w*(0.6+0.4*(rnd()*2-1)) + ea*lp; ex[i] = lp; }
  const hfEff = mat.hf*(0.3+p.damping*1.7), base60 = mat.t60*p.decay;
  for (let k=0; k<nM; k++){
    let ratio = ratios[k]; if (k > 0) ratio *= 1 + p.inharm*(rnd()*2-1)*0.03*Math.sqrt(k);
    const f = f0*ratio; if (f >= sr*0.45) continue;
    const t60 = Math.max(0.003, base60/(1 + hfEff*(ratio-1)*0.25));
    const posAmp = 0.25 + 0.75*Math.abs(Math.sin(Math.PI*(k+1)*(0.07+p.position*0.86)));
    const amp = posAmp*(0.7+0.6*rnd())/Math.pow(k+1, 0.6*(1-p.hardness)+0.15);
    const w = TAU*f/sr, r = Math.exp(-6.9078/(t60*sr)), c1 = 2*r*Math.cos(w), c2 = -r*r, gin = amp*Math.sin(w);
    const [gl, gr] = panGains((rnd()*2-1)*p.stereo);
    const end = Math.min(N, Math.ceil(t60*1.1*sr) + exLen);
    let y1 = 0, y2 = 0;
    for (let i=0; i<end; i++){ const y = (i < exLen ? ex[i]*gin : 0) + c1*y1 + c2*y2; y2 = y1; y1 = y; L[i] += y*gl; R[i] += y*gr; }
  }
  let pk = 0; for (let i=0; i<N; i++){ const a = Math.max(Math.abs(L[i]), Math.abs(R[i])); if (a > pk) pk = a; }
  if (pk > 0){ const g = 1/pk; for (let i=0; i<N; i++){ L[i] *= g; R[i] *= g; } }

    const tau = (0.002 + (1-p.hardness)*0.015)*sr, nEnd = Math.min(N, Math.ceil(tau*7)), tmp = new Float32Array(nEnd);
    const s = newSVF(), g = Math.tan(Math.PI*Math.min(sr*0.45, f0*3 + 1500 + 4000*p.hardness)/sr); let npk = 0;
    for (let i=0; i<nEnd; i++){ svfTick(s, (rnd()*2-1)*Math.exp(-i/tau), g, 1.1); tmp[i] = s.bp; npk = Math.max(npk, Math.abs(s.bp)); }
    const gn = npk > 0 ? p.noise*0.8/npk : 0;

  }

}

function renderString(p, c){
  const {N, sr, pm} = c;
  let minPm = Infinity; for (let i=0; i<N; i+=64) minPm = Math.min(minPm, pm[i]);
  const one = (det, rnd) => {
    const out = new Float32Array(N), fB = p.freq*Math.pow(2, det/1200);
    let bl = 16; while (bl < sr/(fB*minPm) + 8 && bl < sr) bl <<= 1;
    const buf = new Float32Array(bl), mask = bl-1, a = 0.25 + 0.75*p.bright;
    const exN = Math.max(2, Math.round(sr/(fB*pm[0]))), exc = new Float32Array(exN), ea = 0.15 + 0.85*p.bright;
    let lp = 0, mean = 0;
    for (let i=0; i<exN; i++){ lp = ea*(rnd()*2-1) + (1-ea)*lp; exc[i] = lp; }
    const pk = Math.max(1, Math.round(p.pick*exN));
    for (let i=exN-1; i>=pk; i--) exc[i] -= exc[i-pk];
    for (let i=0; i<exN; i++) mean += exc[i]; mean /= exN; for (let i=0; i<exN; i++) exc[i] -= mean;
    let w = 0, lpS = 0;
    for (let i=0; i<N; i++){
      const f = fB*pm[i], D = clamp(sr/f - (1-a)/a, 2, bl-2), g = Math.pow(10, -3/(f*p.decay));
      const rp = w - D, i0 = Math.floor(rp), fr = rp - i0;
      const d = buf[i0 & mask]*(1-fr) + buf[(i0+1) & mask]*fr;
      lpS = a*d + (1-a)*lpS;
      const y = (i < exN ? exc[i] : 0) + g*lpS;
      buf[w & mask] = y; w++; out[i] = y;
    }
    return out;
  };
  if (p.stereo > 0) return {L: one(-p.stereo/2, c.rnd), R: one(p.stereo/2, mulberry32(c.seed ^ 0x5bd1e995))};
  const m = one(0, c.rnd); return {L: m, R: m.slice()};
}

function renderParticles(p, c){
  const {N, sr, pm, rnd} = c, L = new Float32Array(N), R = new Float32Array(N);
  const lnA = Math.log(p.fmin), lnB = Math.log(Math.max(p.fmax, p.fmin*1.001)), maxLen = Math.ceil(p.pdecay*6.9*sr);
  const r = Math.exp(-6.9078/(p.pdecay*sr)), s = newSVF();
  let t = 0, guard = 0;
  while (guard++ < 400000){
    t += -Math.log(1 - rnd() + 1e-12)/p.density;
    const n0 = Math.floor(t*sr); if (n0 >= N) break;
    const f = Math.min(sr*0.45, Math.exp(lnA + (lnB-lnA)*rnd())*pm[n0]);
    const amp = Math.pow(rnd(), p.ampVar*2.5), [gl, gr] = panGains((rnd()*2-1)*p.stereo);
    const len = Math.min(N-n0, maxLen), w = TAU*f/sr, cw = Math.cos(w), sw = Math.sin(w), g = Math.tan(Math.PI*f/sr);
    let cr = 1, ci = 0, e = amp; s.ic1 = s.ic2 = 0;
    for (let j=0; j<len; j++){
      let v = p.tone*ci;
      if (p.tone < 1){ svfTick(s, rnd()*2-1, g, 0.5); v += (1-p.tone)*s.bp*1.25; }
      v *= e; L[n0+j] += v*gl; R[n0+j] += v*gr;
      const ncr = cr*cw - ci*sw; ci = cr*sw + ci*cw; cr = ncr; e *= r;
    }
  }
  return {L, R};
}

function renderFormant(p, c){
  const {N, sr, pm, rnd} = c, out = new Float32Array(N);
  const fs = [0,1,2,3,4].map(newSVF), gF = [], gK = [], gA = [], sc = 1/p.size;
  let ph = 0, cyc = 0, jit = 0, glp = 0;
  for (let i=0; i<N; i++){
    if ((i & 31) === 0){
      const t = i/sr, m = p.morph > 0 ? Math.min(1, t/p.morph) : 1, sm = m*m*(3-2*m);
      const vi = clamp(p.vowelA + (p.vowelB-p.vowelA)*sm, 0, 4), i0 = Math.floor(vi), i1 = Math.min(4, i0+1), fr = vi - i0;
      for (let j=0; j<5; j++){
        const F = Math.min(sr*0.45, (VOWELS[i0].F[j]*(1-fr) + VOWELS[i1].F[j]*fr)*sc);
        const Bw = (VOWELS[i0].B[j]*(1-fr) + VOWELS[i1].B[j]*fr)*Math.sqrt(sc);
        gF[j] = Math.tan(Math.PI*F/sr); gK[j] = Bw/F; gA[j] = dbToGain(VOWELS[i0].A[j]*(1-fr) + VOWELS[i1].A[j]*fr);
      }
    }
    let dt = p.freq*pm[i]*(1+jit)/sr; if (dt > 0.45) dt = 0.45;
    ph += dt; if (ph >= 1){ ph -= 1; cyc++; jit = jit*0.6 + p.jitter*0.025*(rnd()*2-1); }
    glp += (2*ph-1-polyblep(ph, dt) - glp)*0.35;
    let src = glp;
    if (p.growl > 0 && (cyc & 1)) src *= 1 - p.growl*0.7;
    src += (rnd()*2-1)*p.breath*0.6;
    let y = 0;
    for (let j=0; j<5; j++){ svfTick(fs[j], src, gF[j], gK[j]); y += fs[j].bp*gK[j]*gA[j]; }
    out[i] = y;
  }
  return {L: out, R: out.slice()};

function hermite(a, pos){
  const n = a.length, i = Math.floor(pos), f = pos - i;
  const x0 = a[clamp(i-1,0,n-1)], x1 = a[clamp(i,0,n-1)], x2 = a[clamp(i+1,0,n-1)], x3 = a[clamp(i+2,0,n-1)];
  const c1 = 0.5*(x2-x0), c2 = x0 - 2.5*x1 + 2*x2 - 0.5*x3, c3 = 0.5*(x3-x0) + 1.5*(x1-x2);
  return ((c3*f + c2)*f + c1)*f + x1;
}
function renderSampler(p, c){
  const {N, sr, pm, rnd} = c, L = new Float32Array(N), R = new Float32Array(N);
  const smp = SAMPLES.get(p.sample); if (!smp) return {L, R};

function crc32(b){ let c = 0xFFFFFFFF; for (let i=0; i<b.length; i++) c = CRC_T[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(files){
  const enc = new TextEncoder(), parts = [], cen = []; let off = 0;
  for (const f of files){
    const nm = enc.encode(f.name), crc = crc32(f.data), h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true);
    h.setUint32(14, crc, true); h.setUint32(18, f.data.length, true); h.setUint32(22, f.data.length, true); h.setUint16(26, nm.length, true);
    parts.push(new Uint8Array(h.buffer), nm, f.data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
    c.setUint32(16, crc, true); c.setUint32(20, f.data.length, true); c.setUint32(24, f.data.length, true); c.setUint16(28, nm.length, true); c.setUint32(42, off, true);
    cen.push(new Uint8Array(c.buffer), nm);
    off += 30 + nm.length + f.data.length;
  }
  const cl = cen.reduce((a, b) => a + b.length, 0), e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, cl, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...cen, new Uint8Array(e.buffer)], {type:'application/zip'});
}

/* ---- Variações (round-robin) ---- */
function varySound(snd, amt){
  const s = JSON.parse(JSON.stringify(snd)), j = r => (Math.random()*2-1)*r*amt;
  s.layers.forEach(l => {
    l.seed = (Math.random()*4294967295) >>> 0;
    l.pitch += j(0.8); l.vol += j(1.5);
    if (l.start > 0) l.start = Math.max(0, l.start*(1 + j(0.1)));
    l.env.d *= 1 + j(0.15);
    if (l.filter.type !== 'off') l.filter.freq = clamp(l.filter.freq*Math.pow(2, j(0.3)), 20, 20000);
    ENGINES[l.type].params.forEach(d => {
      if (d.s === 'choice' || d.s === 'bool' || d.s === 'int' || d.s === 'sample' || d.k === 'freq') return;
      l.p[d.k] = clamp(l.p[d.k] + j(0.05)*(d.max - d.min), d.min, d.max);
    });
  });
  return s;
}

function Ly(type, p = {}, o = {}){
  const l = newLayer(type, 0);
  Object.assign(l.p, p);
  for (const k in o){
    if (o[k] && typeof o[k] === 'object' && !Array.isArray(o[k])) Object.assign(l[k], o[k]); else l[k] = o[k];
  }
  return l;
}

const CATEGORIES = [...new Set(PRESET_DEFS.map(d => d[0]))];
function buildPreset(def){
  const [cat, name, layers, master] = def;
  const m = defaultMaster();
  if (master.revType && REV_TYPES[master.revType]) Object.assign(m, REV_TYPES[master.revType]);
  Object.assign(m, master);
  const ls = JSON.parse(JSON.stringify(layers));
  ls.forEach((l, i) => l.seed = hashStr(name + '#' + i));
  return {name, cat, layers: ls, master: m};
}

const $ = id => document.getElementById(id);
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtHz = h => h >= 1000 ? (h/1000).toFixed(h >= 10000 ? 1 : 2)+' kHz' : h.toFixed(h < 100 ? 1 : 0)+' Hz';
const fmtS = s => s < 1 ? (s*1000).toFixed(s < 0.01 ? 1 : 0)+' ms' : s.toFixed(2)+' s';
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } },
};
let toastT = 0;
function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800); }

/* ---------------- Estado ---------------- */
let S = null;            // som atual
let sel = 0;             // camada selecionada
let undoStack = [], redoStack = [];
function commit(){
  const j = JSON.stringify(S);
  if (undoStack[undoStack.length-1] !== j){ undoStack.push(j); if (undoStack.length > 200) undoStack.shift(); redoStack = []; }
}
function undo(){ if (undoStack.length < 2) return; redoStack.push(undoStack.pop()); S = JSON.parse(undoStack[undoStack.length-1]); afterLoad(true); }
function redo(){ if (!redoStack.length) return; const j = redoStack.pop(); undoStack.push(j); S = JSON.parse(j); afterLoad(true); }
function normalizeSound(s){
  const out = {name: String(s.name || 'Sem nome').slice(0,80), cat: s.cat || '', master: Object.assign(defaultMaster(), s.master || {}), layers: []};
  (s.layers || []).forEach(l => {
    if (!ENGINES[l.type]) return;
    const n = newLayer(l.type, l.seed);
    for (const k of ['name','on','solo','vol','pan','start','pitch','fine','drive']) if (l[k] !== undefined) n[k] = l[k];
    for (const k of ['env','pitchEnv','filter','mod','p']) if (l[k]) Object.assign(n[k], l[k]);
    out.layers.push(n);
  });
  return out;
}

/* ---------------- Controles genéricos ---------------- */
function toX(d, v){
  if (d.s === 'log') return Math.log(v/d.min)/Math.log(d.max/d.min);
  if (d.s === 'sq') return Math.sqrt(Math.max(0, (v-d.min)/(d.max-d.min)));
  return (v-d.min)/(d.max-d.min);
}
function fromX(d, x){
  if (d.s === 'log') return d.min*Math.pow(d.max/d.min, x);
  if (d.s === 'sq') return d.min + x*x*(d.max-d.min);
  const v = d.min + x*(d.max-d.min);
  return d.s === 'int' ? Math.round(v) : v;
}
function fmtVal(d, v){
  if (d.off && d.off(v)) return 'off';
  switch (d.u){
    case 'Hz': return fmtHz(v);
    case 's': return fmtS(v);
    case 'ms': return v.toFixed(0)+' ms';
    case 'dB': return (v > 0 ? '+' : '')+v.toFixed(1)+' dB';
    case 'LUFS': return v.toFixed(1);
    case 'st': return (v > 0 ? '+' : '')+v.toFixed(Math.abs(v) < 10 ? 2 : 1)+' st';
    case 'ct': return (v > 0 ? '+' : '')+v.toFixed(0)+' ct';
    case '%': return (v*100).toFixed(0)+'%';
    case 'x': return '×'+v.toFixed(v < 10 ? 3 : 1);
    case 'Q': return 'Q '+v.toFixed(2);
    case 'oct': return (v > 0 ? '+' : '')+v.toFixed(2)+' oit';
    case 'pan': return Math.abs(v) < 0.01 ? 'C' : (v < 0 ? 'E ' : 'D ')+Math.round(Math.abs(v)*100);

async function addSampleFromArrayBuffer(name, ab){

    const rec = new MediaRecorder(stream), chunks = [];

const PREVIEW_SR = 48000;

/* ---------------- Render ---------------- */
let renderTok = 0, renderTimer = 0, wantPlay = false;

async function doRender(){

  try {
    const r = await renderSound(S, PREVIEW_SR);

}

}

/* ---------------- Reprodução ---------------- */
let mainSrc = null, playT0 = 0, playDur = 0, raf = 0;
function playMain(){

  if (!curBuf) curBuf = toBuffer(current);
  const s = c.createBufferSource(); s.buffer = curBuf; s.loop = $('cLoop').checked; s.connect(monGain);
  s.onended = () => { if (mainSrc === s){ mainSrc = null; drawWave(); } };
  s.start(); mainSrc = s; playT0 = c.currentTime; playDur = curBuf.duration;
  cancelAnimationFrame(raf); tick();
}
function stopMain(){ if (mainSrc){ const s = mainSrc; mainSrc = null; try { s.stop(); } catch(e){} } drawWave(); }
function tick(){
  if (!mainSrc) return;
  let pos = (ac.currentTime - playT0)/playDur; if (mainSrc.loop) pos %= 1;
  drawWave(pos); if (pos <= 1) raf = requestAnimationFrame(tick);
}
async function auditionLayer(i){

  const s = c.createBufferSource(); s.buffer = toBuffer(r); s.connect(monGain); s.start(); mainSrc = s; s.onended = () => { if (mainSrc === s) mainSrc = null; };

/* ---------------- Visualização ---------------- */
function fit(cv){
  const dpr = window.devicePixelRatio || 1, r = cv.getBoundingClientRect();
  const w = Math.max(1, Math.round(r.width*dpr)), h = Math.max(1, Math.round(r.height*dpr));
  if (cv.width !== w || cv.height !== h){ cv.width = w; cv.height = h; }
  return {ctx: cv.getContext('2d'), w, h, dpr};
}
const cssv = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let viewMode = 'wave';
function drawAll(){ drawWave(); if (viewMode === 'spec') drawSpec(); }
function drawGrid(ctx, w, h, dpr, dur){
  ctx.strokeStyle = cssv('--grid'); ctx.fillStyle = cssv('--muted'); ctx.lineWidth = 1; ctx.font = `${10*dpr}px system-ui`;
  const steps = [0.01,0.025,0.05,0.1,0.25,0.5,1,2,5,10]; const step = steps.find(s => dur/s <= 10) || 10;
  for (let t = step; t < dur; t += step){ const x = t/dur*w; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); ctx.fillText(fmtS(t), x+3, h-4*dpr); }
}
function drawWave(pos = -1){
  if (viewMode !== 'wave') return drawSpecHead(pos);
  const {ctx, w, h, dpr} = fit($('cvWave')); ctx.clearRect(0, 0, w, h);
  if (!current) return;
  const N = current.L.length, dur = N/current.sr, lane = h/2;
  drawGrid(ctx, w, h, dpr, dur);
  [[current.L, cssv('--wave'), lane/2], [current.R, cssv('--wave2'), lane*1.5]].forEach(([d, col, mid]) => {
    ctx.strokeStyle = cssv('--grid'); ctx.beginPath(); ctx.moveTo(0, mid); ctx.lineTo(w, mid); ctx.stroke();
    ctx.fillStyle = col; const spp = N/w;
    for (let x=0; x<w; x++){
      let lo = 1, hi = -1; const a = Math.floor(x*spp), b = Math.min(N, Math.floor((x+1)*spp) + 1);
      for (let i=a; i<b; i++){ const v = d[i]; if (v < lo) lo = v; if (v > hi) hi = v; }
      if (hi < lo) continue;
      ctx.fillRect(x, mid - hi*lane*0.46, 1, Math.max(1, (hi-lo)*lane*0.46));
    }
  });
  ctx.fillStyle = cssv('--muted'); ctx.fillText('E', 4*dpr, 12*dpr); ctx.fillText('D', 4*dpr, lane + 12*dpr);
  if (pos >= 0 && pos <= 1){ ctx.fillStyle = cssv('--accent2'); ctx.fillRect(pos*w - dpr, 0, 2*dpr, h); }
}
function fft(re, im){
  const n = re.length;
  for (let i=1, j=0; i<n; i++){ let bit = n >> 1; for (; j & bit; bit >>= 1) j ^= bit; j ^= bit; if (i < j){ [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; } }
  for (let len=2; len<=n; len<<=1){
    const ang = -TAU/len, wr = Math.cos(ang), wi = Math.sin(ang), hl = len >> 1;
    for (let i=0; i<n; i+=len){ let cr = 1, ci = 0;
      for (let j=0; j<hl; j++){ const a = i+j, b = a+hl, tr = re[b]*cr - im[b]*ci, ti = re[b]*ci + im[b]*cr;
        re[b] = re[a]-tr; im[b] = im[a]-ti; re[a] += tr; im[a] += ti; const nc = cr*wr - ci*wi; ci = cr*wi + ci*wr; cr = nc; } }
  }
}
const SPEC_LUT = (() => { const st = [[0,[10,12,9]],[0.25,[43,31,74]],[0.5,[138,43,107]],[0.75,[232,116,59]],[1,[251,233,160]]], lut = [];
  for (let i=0; i<256; i++){ const t = i/255; let k = 0; while (k < st.length-2 && t > st[k+1][0]) k++; const [t0, c0] = st[k], [t1, c1] = st[k+1], f = (t-t0)/(t1-t0); lut.push(c0.map((v, j) => Math.round(v + (c1[j]-v)*f))); }
  return lut; })();
let specImg = null;
function drawSpec(){
  const {ctx, w, h} = fit($('cvSpec')); if (!current) return;
  const sr = current.sr, N = current.L.length, n = 2048, win = new Float32Array(n);
  for (let i=0; i<n; i++) win[i] = 0.5 - 0.5*Math.cos(TAU*i/n);
  const cols = Math.min(w, 900), img = ctx.createImageData(cols, h), re = new Float32Array(n), im = new Float32Array(n);
  const rowBin = []; for (let y=0; y<h; y++){ const f = 20*Math.pow((sr/2)/20, 1 - y/h); rowBin.push(f/(sr/2)*(n/2)); }
  for (let x=0; x<cols; x++){
    const c = Math.floor(x/cols*N) - n/2;
    for (let i=0; i<n; i++){ const j = c + i; re[i] = j >= 0 && j < N ? (current.L[j] + current.R[j])*0.5*win[i] : 0; im[i] = 0; }
    fft(re, im);
    for (let y=0; y<h; y++){
      const b = rowBin[y], b0 = Math.floor(b), f = b - b0;
      const m0 = Math.hypot(re[b0], im[b0]), m1 = Math.hypot(re[b0+1] || 0, im[b0+1] || 0);
      const db = 20*Math.log10((m0*(1-f) + m1*f)/(n/4) + 1e-9);
      const col = SPEC_LUT[clamp(Math.round((db + 100)/100*255), 0, 255)], o = (y*cols + x)*4;
      img.data[o] = col[0]; img.data[o+1] = col[1]; img.data[o+2] = col[2]; img.data[o+3] = 255;
    }
  }
  const off = document.createElement('canvas'); off.width = cols; off.height = h; off.getContext('2d').putImageData(img, 0, 0);
  specImg = off; drawSpecHead(-1);
}
function drawSpecHead(pos){
  if (viewMode !== 'spec' || !specImg) return;
  const {ctx, w, h, dpr} = fit($('cvSpec'));
  ctx.imageSmoothingEnabled = true; ctx.drawImage(specImg, 0, 0, w, h);
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.font = `${10*dpr}px system-ui`;
  [100, 1000, 10000].forEach(f => { const y = h*(1 - Math.log(f/20)/Math.log((current.sr/2)/20)); ctx.fillText(fmtHz(f), 4*dpr, y - 2*dpr); ctx.fillRect(0, y, 6*dpr, dpr); });
  if (pos >= 0 && pos <= 1){ ctx.fillStyle = cssv('--accent2'); ctx.fillRect(pos*w - dpr, 0, 2*dpr, h); }
}
function renderMeters(){
  if (!stats) return;
  const s = stats, m = S.master, f = v => isFinite(v) ? v.toFixed(1) : '−∞';
  const items = [['Duração', fmtS(s.dur)], ['Pico', f(s.peak)+' dB'], ['True peak', f(s.tp)+' dBTP', s.tp > m.ceiling + 0.05],
    ['Loudness', f(s.lufs)+' LUFS'], ['Correlação', s.corr.toFixed(2), s.corr < 0], ['Camadas', S.layers.filter(l => l.on).length + '/' + S.layers.length]];
  $('meters').innerHTML = items.map(([k, v, w]) => `<div class="meter${w ? ' warn' : ''}"><b>${v}</b><span>${k}</span></div>`).join('');
  updateExInfo();
}
function updateExInfo(){
  if (!current) return;
  const sr = +$('exRate').value, bits = +$('exBits').value, ch = +$('exCh').value, bytes = 44 + current.L.length/current.sr*sr*ch*bits/8;
  $('exInfo').textContent = `Arquivo estimado: ${bytes > 1048576 ? (bytes/1048576).toFixed(2)+' MB' : (bytes/1024).toFixed(0)+' KB'} · ${sr} Hz · ${bits === 32 ? '32 float' : bits+' bits'} · ${ch === 2 ? 'estéreo' : 'mono'}`;
}

/* ---------------- Teclado e MIDI ---------------- */
const KEYMAP = {a:0, w:1, s:2, e:3, d:4, f:5, t:6, g:7, y:8, h:9, u:10, j:11, k:12, o:13, l:14, p:15};
let octave = 0; const voices = new Map();
function noteOn(semi, vel = 0.85){
  if (!current) return;
  const c = ensureAC(); if (!curBuf) curBuf = toBuffer(current);
  noteOff(semi, true);
  const s = c.createBufferSource(), g = c.createGain();
  s.buffer = curBuf; s.playbackRate.value = Math.pow(2, semi/12); g.gain.value = vel;
  s.connect(g); g.connect(monGain); s.start(); voices.set(semi, {s, g});
  s.onended = () => { if (voices.get(semi)?.s === s) voices.delete(semi); };
  keyVisual(semi, true);
}
function noteOff(semi, hard){
  const v = voices.get(semi); keyVisual(semi, false); if (!v) return;
  const sustained = S.layers.some(l => l.on && l.env.s > 0.05);
  if (sustained || hard){ const t = ac.currentTime; v.g.gain.setTargetAtTime(0, t, hard ? 0.005 : 0.08); try { v.s.stop(t + (hard ? 0.03 : 0.6)); } catch(e){} }
  voices.delete(semi);
}
function buildKeyboard(){
  const kb = $('kbd'); kb.innerHTML = '';
  const whites = [], first = -12 + octave*12;
  for (let s = first; s <= first + 24; s++){
    const pc = ((s % 12) + 12) % 12, black = [1,3,6,8,10].includes(pc);
    if (!black){ const k = el('div', 'wk', pc === 0 ? 'C' + (4 + Math.floor(s/12)) : ''); k.dataset.s = s; kb.appendChild(k); whites.push(k); }
  }
  const ww = 100/whites.length; let wi = 0;
  for (let s = first; s <= first + 24; s++){
    const pc = ((s % 12) + 12) % 12;
    if ([1,3,6,8,10].includes(pc)){ const k = el('div', 'bk'); k.dataset.s = s; k.style.left = `calc(${wi*ww - ww*0.3}%)`; k.style.width = `${ww*0.6}%`; kb.appendChild(k); }
    else wi++;
  }
  $('octLbl').textContent = 'Dó central: C' + (4 + octave) + (octave ? ` (${octave > 0 ? '+' : ''}${octave} oit)` : '');
}
function keyVisual(semi, on){ const k = $('kbd').querySelector(`[data-s="${semi}"]`); if (k) k.classList.toggle('dn', on); }
let ptrNote = new Map();
$('kbd').addEventListener('pointerdown', e => { const k = e.target.closest('[data-s]'); if (!k) return; e.preventDefault(); $('kbd').setPointerCapture(e.pointerId); const s = +k.dataset.s; ptrNote.set(e.pointerId, s); noteOn(s, 0.6 + 0.4*clamp(e.offsetY/(k.clientHeight || 1), 0, 1)); });
$('kbd').addEventListener('pointermove', e => {
  if (!ptrNote.has(e.pointerId)) return; const k = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-s]'); if (!k) return;
  const s = +k.dataset.s, old = ptrNote.get(e.pointerId); if (s !== old){ noteOff(old); ptrNote.set(e.pointerId, s); noteOn(s); }
});
const ptrUp = e => { if (ptrNote.has(e.pointerId)){ noteOff(ptrNote.get(e.pointerId)); ptrNote.delete(e.pointerId); } };
$('kbd').addEventListener('pointerup', ptrUp); $('kbd').addEventListener('pointercancel', ptrUp);
$('octDn').onclick = () => { octave = Math.max(-3, octave-1); buildKeyboard(); };
$('octUp').onclick = () => { octave = Math.min(3, octave+1); buildKeyboard(); };
$('bMidi').onclick = async () => {
  if (!navigator.requestMIDIAccess){ toast('Este navegador não suporta Web MIDI'); return; }
  try {
    const midi = await navigator.requestMIDIAccess(); let n = 0;
    const bind = inp => { inp.onmidimessage = ev => { const [st, note, vel] = ev.data, cmd = st & 0xf0;
      if (cmd === 0x90 && vel > 0) noteOn(note - 60, vel/127); else if (cmd === 0x80 || (cmd === 0x90 && vel === 0)) noteOff(note - 60); }; n++; };
    midi.inputs.forEach(bind); midi.onstatechange = e => { if (e.port.type === 'input' && e.port.state === 'connected') bind(e.port); };
    $('bMidi').classList.add('on'); toast(n ? `MIDI conectado (${n} entrada${n > 1 ? 's' : ''})` : 'MIDI ativo — conecte um teclado');
  } catch(e){ toast('Acesso MIDI negado'); }
};

/* ---------------- Exportação ---------------- */
const slug = s => (s || 'sfx').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'sfx';
function download(blob, name){
  const url = URL.createObjectURL(blob), a = el('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
const exOpts = () => ({sr: +$('exRate').value, bits: +$('exBits').value, mono: $('exCh').value === '1'});
async function busy(label, fn){
  document.body.style.cursor = 'progress'; setStatus(label);
  try { await fn(); } catch(e){ console.error(e); toast('Erro: ' + e.message); } finally { document.body.style.cursor = ''; setStatus('Pronto'); }
}
$('bWav').onclick = () => busy('Exportando…', async () => {
  const o = exOpts(), r = await renderSound(S, o.sr);
  download(new Blob([encodeWav(r, o.bits, o.mono)], {type:'audio/wav'}), slug($('exName').value) + '.wav'); toast('WAV exportado');
});
$('bVarZip').onclick = () => busy('Gerando variações…', async () => {
  const o = exOpts(), n = clamp(+$('varN').value | 0, 2, 64), amt = +$('varAmt').value, base = slug($('exName').value), files = [];
  for (let i=0; i<n; i++){ setStatus(`Variação ${i+1}/${n}…`); const r = await renderSound(i === 0 ? S : varySound(S, amt), o.sr); files.push({name: `${base}_${String(i+1).padStart(2,'0')}.wav`, data: encodeWav(r, o.bits, o.mono)}); }
  download(makeZip(files), base + '_variacoes.zip'); toast(`${n} variações exportadas`);
});
$('bStems').onclick = () => busy('Exportando stems…', async () => {
  const o = exOpts(), base = slug($('exName').value), files = [];
  for (let i=0; i<S.layers.length; i++){ if (!S.layers[i].on) continue; setStatus(`Stem ${i+1}…`); const r = await renderSound(S, o.sr, {only: i, raw: true}); files.push({name: `${base}_${String(i+1).padStart(2,'0')}_${slug(S.layers[i].name)}.wav`, data: encodeWav(r, o.bits, o.mono)}); }
  if (!files.length) throw new Error('nenhuma camada ativa');
  download(makeZip(files), base + '_stems.zip'); toast('Stems exportados (sem normalização)');
});
$('bProjExp').onclick = () => { download(new Blob([JSON.stringify({app:'nexi-sfx-studio', version:2, sound:S}, null, 1)], {type:'application/json'}), slug(S.name) + '.nexisfx.json'); };
let jsonTarget = 'project';
$('bProjImp').onclick = () => { jsonTarget = 'project'; $('fileJson').click(); };
$('bBankImp').onclick = () => { jsonTarget = 'bank'; $('fileJson').click(); };
$('fileJson').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (jsonTarget === 'bank'){
      const arr = Array.isArray(j) ? j : j.sounds; if (!Array.isArray(arr)) throw 0;
      let n = 0; arr.forEach(s => { if (s && s.snd){ bank.push({name: String(s.name || 'Som').slice(0,80), snd: normalizeSound(s.snd)}); n++; } });
      saveBank(); toast(`${n} sons importados`);
    } else { loadSound(normalizeSound(j.sound || j)); toast('Projeto aberto'); }
  } catch(err){ toast('Arquivo inválido'); }
};
$('bBankExp').onclick = () => download(new Blob([JSON.stringify({app:'nexi-sfx-studio', version:2, sounds: bank}, null, 1)], {type:'application/json'}), 'nexi-sfx-banco.json');
$('bSave').onclick = () => { const n = $('saveName').value.trim() || S.name; bank.unshift({name: n, snd: JSON.parse(JSON.stringify({...S, name: n}))}); $('saveName').value = ''; saveBank(); toast('Salvo em Meus sons'); };

/* ---------------- Carregar / eventos ---------------- */
function loadSound(s){ S = s; sel = 0; commit(); afterLoad(false); }
function afterLoad(fromUndo){
  sel = Math.min(sel, Math.max(0, S.layers.length - 1));
  $('sndTitle').textContent = S.name; if (!fromUndo) $('exName').value = slug(S.name);
  renderStrip(); renderEditor(); renderMaster(); scheduleRender(true);
}
$('bPlay').onclick = playMain;
$('bStop').onclick = () => { stopMain(); voices.forEach((v, k) => noteOff(k, true)); };
$('cLoop').onchange = () => { if (mainSrc) playMain(); };
$('bVary').onclick = () => { S = varySound(S, +$('varAmt').value); commit(); afterLoad(true); };
$('bUndo').onclick = undo; $('bRedo').onclick = redo;
$('bNew').onclick = () => { curPreset = null; renderLibrary(); loadSound({name:'Novo som', cat:'', master: defaultMaster(), layers:[newLayer('analog')]}); };
$('monVol').oninput = () => { if (monGain) monGain.gain.value = +$('monVol').value; };
$('search').oninput = renderLibrary;
$('tLib').onclick = () => { $('tLib').classList.add('on'); $('tMine').classList.remove('on'); $('paneLib').style.display = ''; $('paneMine').style.display = 'none'; };
$('tMine').onclick = () => { $('tMine').classList.add('on'); $('tLib').classList.remove('on'); $('paneMine').style.display = ''; $('paneLib').style.display = 'none'; renderBank(); };
$('vWave').onclick = () => { viewMode = 'wave'; $('vWave').classList.add('on'); $('vSpec').classList.remove('on'); $('cvWave').style.display = ''; $('cvSpec').style.display = 'none'; drawWave(); };
$('vSpec').onclick = () => { viewMode = 'spec'; $('vSpec').classList.add('on'); $('vWave').classList.remove('on'); $('cvSpec').style.display = 'block'; $('cvWave').style.display = 'none'; drawSpec(); };
['cvWave', 'cvSpec'].forEach(id => $(id).onclick = playMain);
['exRate', 'exBits', 'exCh'].forEach(id => $(id).onchange = updateExInfo);
const addSel = $('addLayer');
Object.entries(ENGINES).forEach(([k, e]) => { const o = el('option', null, esc(e.name)); o.value = k; addSel.appendChild(o); });
addSel.onchange = () => { if (addSel.value) addLayer(addSel.value); addSel.value = ''; };
const held = new Set();
document.addEventListener('keydown', e => {
  if (e.target.matches('input[type=text], input[type=search], input[type=number], textarea, select')) return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === 'y'){ e.preventDefault(); redo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === 'Space'){ e.preventDefault(); mainSrc ? stopMain() : playMain(); return; }
  if (k in KEYMAP){ if (!held.has(k)){ held.add(k); noteOn(KEYMAP[k] + octave*12); } e.preventDefault(); return; }
  if (k === 'z'){ octave = Math.max(-3, octave-1); buildKeyboard(); }
  else if (k === 'x'){ octave = Math.min(3, octave+1); buildKeyboard(); }
  else if (k === 'v') $('bVary').click();
});
document.addEventListener('keyup', e => { const k = e.key.toLowerCase(); if (held.has(k)){ held.delete(k); noteOff(KEYMAP[k] + octave*12); } });
let rsT = 0; window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(drawAll, 100); });

(async function init(){
  renderLibrary(); buildKeyboard(); renderBank();
  await idbLoadAll();
  curPreset = PRESET_DEFS[0][1]; renderLibrary();
  S = buildPreset(PRESET_DEFS[0]); commit(); afterLoad(false);
  wantPlay = false;
})();

</script>
