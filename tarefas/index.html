<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14111f">
<title>Missões do Dia</title>
<meta name="description" content="Lista de tarefas gamificada: ganhe XP, moedas, suba de nível e desbloqueie conquistas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1fb; --bg2:#ebe6f7; --card:#ffffff; --ink:#1d1830; --muted:#6e6788; --line:#e2dcf0;
  --accent:#6c4cf5; --accent-ink:#ffffff; --accent-soft:#ece7ff;
  --xp:#6c4cf5; --coin:#e8a10c; --coin-soft:#fff3d6; --fire:#f0562b; --fire-soft:#ffe6dc;
  --ok:#17a36b; --ok-soft:#dcf6ea; --easy:#17a36b; --mid:#e8a10c; --hard:#e03d5f;
  --shadow:0 1px 2px #1d18300d,0 6px 20px #1d18300f;
  --radius:18px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14111f; --bg2:#1b1729; --card:#211c33; --ink:#f1eefb; --muted:#a49cc0; --line:#332c4b;
    --accent:#8b73ff; --accent-ink:#14111f; --accent-soft:#2c2550;
    --xp:#8b73ff; --coin:#ffc23d; --coin-soft:#3a2f17; --fire:#ff7a4d; --fire-soft:#3d2219;
    --ok:#3ccf8e; --ok-soft:#173528; --easy:#3ccf8e; --mid:#ffc23d; --hard:#ff6b88;
    --shadow:0 1px 2px #0006,0 8px 24px #0005;
  }
}
:root[data-theme="dark"]{
  --bg:#14111f; --bg2:#1b1729; --card:#211c33; --ink:#f1eefb; --muted:#a49cc0; --line:#332c4b;
  --accent:#8b73ff; --accent-ink:#14111f; --accent-soft:#2c2550;
  --xp:#8b73ff; --coin:#ffc23d; --coin-soft:#3a2f17; --fire:#ff7a4d; --fire-soft:#3d2219;
  --ok:#3ccf8e; --ok-soft:#173528; --easy:#3ccf8e; --mid:#ffc23d; --hard:#ff6b88;
  --shadow:0 1px 2px #0006,0 8px 24px #0005;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.display{font-family:Fredoka,system-ui,sans-serif;font-weight:600;letter-spacing:.005em;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 80px}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{width:36px;height:36px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:Fredoka;font-weight:700;font-size:20px}
.logo h1{font-size:1.35rem}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:17px}
.icon-btn:hover{border-color:var(--accent)}
.top-actions{display:flex;gap:8px}

/* Hero */
.hero{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
.avatar{width:76px;height:76px;border-radius:22px;background:linear-gradient(145deg,var(--accent),#c04cf5);display:grid;place-items:center;font-size:40px;position:relative;flex:none}
.avatar .lvl{position:absolute;bottom:-8px;right:-8px;background:var(--ink);color:var(--bg);font-family:Fredoka;font-weight:700;font-size:.8rem;border-radius:99px;padding:2px 8px;border:3px solid var(--card)}
.who .rank{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.who h2{font-size:1.3rem;margin:2px 0 8px}
.xpbar{height:12px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.xpbar>div{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--xp),#c04cf5);transition:width .6s cubic-bezier(.2,.9,.3,1.2)}
.xptext{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
.ring{position:relative;width:78px;height:78px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .track{stroke:var(--line)}
.ring .prog{stroke:var(--ok);transition:stroke-dashoffset .6s ease}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.ring .lbl b{font-family:Fredoka;font-size:1.15rem}
.ring .lbl small{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}

.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 18px}
.chip{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;display:flex;align-items:center;gap:10px}
.chip .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:none}
.chip b{display:block;font-family:Fredoka;font-size:1.1rem;font-variant-numeric:tabular-nums;line-height:1.1}
.chip small{color:var(--muted);font-size:.72rem}
.chip.coin .ico{background:var(--coin-soft)} .chip.fire .ico{background:var(--fire-soft)} .chip.done .ico{background:var(--ok-soft)}
.bump{animation:bump .45s ease}
@keyframes bump{40%{transform:scale(1.12)}}

/* Tabs */
.tabs{display:flex;gap:6px;background:var(--bg2);padding:5px;border-radius:14px;margin-bottom:14px;overflow-x:auto}
.tab{flex:1;border:0;background:transparent;padding:9px 10px;border-radius:10px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.tab .count{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:.72rem;margin-left:4px}
.panel{display:none}
.panel.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}

/* Add form */
.add{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;margin-bottom:14px}
.add-row{display:flex;gap:8px}
.add input[type=text]{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 13px;outline:none}
.add input[type=text]:focus{border-color:var(--accent)}
.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--accent);color:var(--accent-ink);font-weight:700;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 10px;font-size:.82rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.seg button .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.toggle{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);font-weight:600;padding:5px 10px;border:1px solid var(--line);border-radius:11px;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent)}
.add select{border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:6px 8px;font-size:.82rem;font-weight:600}
.reward-hint{margin-left:auto;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* Task list */
.filters{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.filter{border:1px solid var(--line);background:transparent;border-radius:99px;padding:5px 12px;font-size:.8rem;font-weight:600;color:var(--muted)}
.filter[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.task{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 12px 12px 10px;display:flex;align-items:center;gap:12px;border-left:4px solid var(--c,var(--line));transition:opacity .3s,transform .3s}
.task.done{opacity:.6}
.task.done .t-title{text-decoration:line-through;text-decoration-thickness:2px}
.task.pop{animation:pop .5s ease}
@keyframes pop{30%{transform:scale(1.03)}}
.check{width:30px;height:30px;border-radius:10px;border:2px solid var(--c,var(--line));background:transparent;display:grid;place-items:center;flex:none;font-size:15px;color:transparent;transition:background .2s}
.check:hover{background:var(--accent-soft)}
.task.done .check{background:var(--c);color:#fff}
.t-body{flex:1;min-width:0}
.t-title{font-weight:600;overflow-wrap:anywhere}
.t-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.tag{font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--bg2);color:var(--muted)}
.tag.xp{background:var(--accent-soft);color:var(--accent)}
.tag.coin{background:var(--coin-soft);color:var(--coin)}
.del{border:0;background:transparent;color:var(--muted);font-size:18px;width:30px;height:30px;border-radius:9px;flex:none;opacity:.6}
.del:hover{opacity:1;background:var(--bg2)}
.empty{text-align:center;color:var(--muted);padding:34px 16px;border:2px dashed var(--line);border-radius:var(--radius)}
.empty .big{font-size:40px}

/* Shop */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.reward{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px}
.reward .r-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.reward .r-ico{font-size:28px}
.reward .r-name{font-weight:600;overflow-wrap:anywhere}
.reward .btn{padding:8px 12px;font-size:.85rem}
.reward .btn:disabled{background:var(--bg2);color:var(--muted);cursor:not-allowed;filter:none;transform:none}
.reward-actions{display:flex;gap:6px;align-items:center}
.reward-actions .btn{flex:1}
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:4px 0 10px}
.section-h h3{font-size:1.05rem}
.section-h small{color:var(--muted)}

/* Badges */
.badge{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px;display:flex;gap:12px;align-items:center}
.badge .b-ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--accent-soft);flex:none}
.badge.locked .b-ico{filter:grayscale(1);opacity:.45;background:var(--bg2)}
.badge.locked .b-name{color:var(--muted)}
.badge .b-name{font-weight:700}
.badge .b-desc{font-size:.78rem;color:var(--muted)}
.mini{height:5px;border-radius:99px;background:var(--bg2);margin-top:6px;overflow:hidden}
.mini>div{height:100%;background:var(--accent);border-radius:99px}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.stat b{font-family:Fredoka;font-size:1.6rem;display:block;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:.78rem}
.chart{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;margin-top:12px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar-col .b{width:100%;max-width:44px;border-radius:8px 8px 4px 4px;background:var(--accent);min-height:3px;transition:height .5s ease;position:relative}
.bar-col.today .b{background:linear-gradient(var(--xp),#c04cf5)}
.bar-col .v{font-size:.75rem;font-weight:700;font-variant-numeric:tabular-nums}
.bar-col .d{font-size:.7rem;color:var(--muted);text-transform:capitalize}
.danger{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}

/* Overlays */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.float{position:fixed;z-index:51;pointer-events:none;font-family:Fredoka;font-weight:700;font-size:1.05rem;animation:floatUp 1.1s ease-out forwards;white-space:nowrap;text-shadow:0 2px 8px #0003}
@keyframes floatUp{from{opacity:0;transform:translate(-50%,0) scale(.7)}15%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}to{opacity:0;transform:translate(-50%,-70px) scale(1)}}
.toast-wrap{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:80;width:min(92vw,380px)}
.toast{background:var(--ink);color:var(--bg);border-radius:14px;padding:11px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px #0004;animation:toastIn .35s cubic-bezier(.2,.9,.3,1.3)}
.toast .ti{font-size:22px}
.toast b{display:block;font-family:Fredoka}
.toast small{opacity:.75}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.95)}}
.modal{position:fixed;inset:0;background:#0d0a1899;display:none;place-items:center;z-index:70;padding:16px;backdrop-filter:blur(3px)}
.modal.on{display:grid;animation:fade .25s ease}
.modal-card{background:var(--card);border-radius:24px;padding:28px 24px;text-align:center;max-width:340px;width:100%;box-shadow:0 20px 60px #0006;animation:levelIn .6s cubic-bezier(.2,.9,.3,1.4)}
.modal-card .big{font-size:64px;line-height:1}
.modal-card h2{font-size:1.7rem;margin:10px 0 4px}
.modal-card p{color:var(--muted);margin:0 0 18px}
@keyframes levelIn{from{opacity:0;transform:scale(.6) rotate(-6deg)}}

@media (max-width:620px){
  .hero{grid-template-columns:auto 1fr;gap:14px}
  .ring{grid-column:1/-1;width:100%;height:auto;display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:14px;padding:8px 12px}
  .ring svg{width:46px;height:46px}
  .ring .lbl{position:static;display:block;text-align:left}
  .chip{padding:9px;gap:8px}
  .chip .ico{width:30px;height:30px;font-size:16px}
  .reward-hint{width:100%;margin-left:0}
  .tabs{overflow:visible}
  .tab{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 4px;font-size:.74rem}
  .tab .count{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <header class="top">
    <div class="logo"><div class="mark">✓</div><h1>Missões do Dia</h1></div>
    <div class="top-actions">
      <button class="icon-btn" id="soundBtn" title="Som" aria-label="Ligar ou desligar som">🔊</button>
      <button class="icon-btn" id="themeBtn" title="Tema" aria-label="Alternar tema">🌓</button>
    </div>
  </header>

  <section class="hero" aria-label="Seu progresso">
    <div class="avatar" id="avatar">🐣<span class="lvl" id="lvlBadge">1</span></div>
    <div class="who">
      <div class="rank" id="rank">Nível 1</div>
      <h2 id="title">Aprendiz</h2>
      <div class="xpbar" role="progressbar" aria-label="Experiência"><div id="xpFill"></div></div>
      <div class="xptext"><span id="xpNow">0 XP</span><span id="xpNext">faltam 80 XP</span></div>
    </div>
    <div class="ring" title="Meta diária">
      <svg width="78" height="78" viewBox="0 0 78 78"><circle class="track" cx="39" cy="39" r="32" fill="none" stroke-width="8"/><circle class="prog" id="ringProg" cx="39" cy="39" r="32" fill="none" stroke-width="8" stroke-linecap="round" stroke-dasharray="201.06" stroke-dashoffset="201.06"/></svg>
      <div class="lbl"><div><b id="goalTxt">0/3</b><br><small>meta de hoje</small></div></div>
    </div>
  </section>

  <div class="chips">
    <div class="chip coin"><div class="ico">🪙</div><div><b id="coins">0</b><small>moedas</small></div></div>
    <div class="chip fire"><div class="ico">🔥</div><div><b id="streak">0</b><small>sequência</small></div></div>
    <div class="chip done"><div class="ico">✅</div><div><b id="todayDone">0</b><small>hoje</small></div></div>
  </div>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-tab="tasks">⚔️ Missões <span class="count" id="pendingCount">0</span></button>
    <button class="tab" role="tab" aria-selected="false" data-tab="shop">🛒 Loja</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="badges">🏆 Conquistas <span class="count" id="badgeCount">0</span></button>
    <button class="tab" role="tab" aria-selected="false" data-tab="stats">📊 Progresso</button>
  </nav>

  <!-- MISSÕES -->
  <section class="panel on" id="tab-tasks">
    <form class="add" id="addForm" autocomplete="off">
      <div class="add-row">
        <input type="text" id="taskInput" placeholder="Nova missão… ex: Ler 20 páginas" maxlength="120" aria-label="Nova missão">
        <button class="btn" type="submit">+ Adicionar</button>
      </div>
      <div class="opts">
        <div class="seg" id="diffSeg" role="group" aria-label="Dificuldade">
          <button type="button" data-diff="easy" aria-pressed="true"><span class="dot" style="background:var(--easy)"></span>Fácil</button>
          <button type="button" data-diff="mid" aria-pressed="false"><span class="dot" style="background:var(--mid)"></span>Média</button>
          <button type="button" data-diff="hard" aria-pressed="false"><span class="dot" style="background:var(--hard)"></span>Difícil</button>
        </div>
        <select id="catSel" aria-label="Categoria">
          <option value="geral">📌 Geral</option>
          <option value="trabalho">💼 Trabalho</option>
          <option value="estudos">📚 Estudos</option>
          <option value="saude">💪 Saúde</option>
          <option value="casa">🏠 Casa</option>
          <option value="pessoal">🌱 Pessoal</option>
        </select>
        <label class="toggle"><input type="checkbox" id="dailyChk"> 🔁 Diária</label>
        <span class="reward-hint" id="rewardHint">+10 XP · +5 🪙</span>
      </div>
    </form>
    <div class="filters" id="filters">
      <button class="filter" data-f="pending" aria-pressed="true">Pendentes</button>
      <button class="filter" data-f="daily" aria-pressed="false">Diárias</button>
      <button class="filter" data-f="done" aria-pressed="false">Concluídas</button>
      <button class="filter" data-f="all" aria-pressed="false">Todas</button>
    </div>
    <ul class="list" id="list"></ul>
  </section>

  <!-- LOJA -->
  <section class="panel" id="tab-shop">
    <form class="add" id="rewardForm" autocomplete="off">
      <div class="add-row">
        <input type="text" id="rewardName" placeholder="Crie uma recompensa… ex: 1 episódio de série" maxlength="80" aria-label="Nome da recompensa">
        <input type="text" id="rewardCost" inputmode="numeric" placeholder="🪙" style="flex:0 0 76px" aria-label="Custo em moedas">
        <button class="btn" type="submit">Criar</button>
      </div>
    </form>
    <div class="section-h"><h3>Recompensas</h3><small>Gaste suas moedas com você mesmo</small></div>
    <div class="grid" id="rewards"></div>
  </section>

  <!-- CONQUISTAS -->
  <section class="panel" id="tab-badges">
    <div class="grid" id="badges"></div>
  </section>

  <!-- PROGRESSO -->
  <section class="panel" id="tab-stats">
    <div class="stats-grid" id="statsGrid"></div>
    <div class="chart">
      <div class="section-h"><h3>Últimos 7 dias</h3><small>missões concluídas</small></div>
      <div class="bars" id="bars"></div>
    </div>
    <div class="danger">
      <button class="btn ghost" id="goalBtn">🎯 Alterar meta diária</button>
      <button class="btn ghost" id="resetBtn">↺ Recomeçar do zero</button>
    </div>
  </section>
</div>

<div class="toast-wrap" id="toasts" aria-live="polite"></div>
<div class="modal" id="levelModal" role="dialog" aria-modal="true" aria-labelledby="lvTitle">
  <div class="modal-card">
    <div class="big" id="lvIco">🎉</div>
    <h2 id="lvTitle">Nível 2!</h2>
    <p id="lvText">Você agora é Aventureiro.</p>
    <button class="btn" id="lvClose">Continuar a jornada</button>
  </div>
</div>

<script>
(() => {
'use strict';
const KEY = 'missoes-do-dia-v1';
const $ = s => document.querySelector(s);

/* ---------- Config ---------- */
const DIFF = {
  easy: { name: 'Fácil',   xp: 10, coins: 5,  color: 'var(--easy)' },
  mid:  { name: 'Média',   xp: 25, coins: 12, color: 'var(--mid)'  },
  hard: { name: 'Difícil', xp: 50, coins: 25, color: 'var(--hard)' },
};
const CATS = { geral:'📌 Geral', trabalho:'💼 Trabalho', estudos:'📚 Estudos', saude:'💪 Saúde', casa:'🏠 Casa', pessoal:'🌱 Pessoal' };
const RANKS = [
  [1,'🐣','Aprendiz'],[3,'🐥','Explorador'],[5,'🦊','Aventureiro'],[8,'🐺','Guerreiro'],
  [12,'🦁','Campeão'],[16,'🐉','Mestre'],[20,'🦄','Lenda'],[30,'🌟','Imortal']
];
const xpFor = lvl => Math.round(80 * Math.pow(lvl, 1.35)); // XP para passar do nível lvl
const DEFAULT_REWARDS = [
  { id: 'r1', ico: '☕', name: 'Pausa para um café especial', cost: 30 },
  { id: 'r2', ico: '📺', name: '1 episódio de série', cost: 60 },
  { id: 'r3', ico: '🎮', name: '1 hora de videogame', cost: 120 },
  { id: 'r4', ico: '🍕', name: 'Pedir aquela comida', cost: 250 },
];
const REWARD_ICONS = ['🎁','🍫','🎧','🛍️','🧋','🎬','🛁','📖','🍦','😴'];

/* ---------- Datas ---------- */
const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d; };
const today = () => dayKey();
const yesterday = () => dayKey(addDays(-1));

/* ---------- Estado ---------- */
const fresh = () => ({
  tasks: [
    { id: uid(), title: 'Beber 2 litros de água', diff: 'easy', cat: 'saude', daily: true, done: false, created: Date.now() },
    { id: uid(), title: 'Arrumar a mesa de trabalho', diff: 'mid', cat: 'casa', daily: false, done: false, created: Date.now() },
    { id: uid(), title: 'Estudar 1 hora sem celular', diff: 'hard', cat: 'estudos', daily: false, done: false, created: Date.now() },
  ],
  totalXp: 0, coins: 0, streak: 0, bestStreak: 0, lastActive: null,
  history: {}, done: 0, hardDone: 0, spent: 0, bought: 0,
  badges: {}, rewards: DEFAULT_REWARDS.slice(), goal: 3, sound: true, theme: null,
});
function uid(){ return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }

let S;
function load(){
  try { S = Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY)) || {}); }
  catch { S = fresh(); }
  // Reinicia missões diárias de dias anteriores
  const t = today();
  S.tasks.forEach(k => { if (k.daily && k.done && k.doneDay !== t) { k.done = false; k.earned = null; } });
  // Sequência quebrada?
  if (S.lastActive && S.lastActive !== t && S.lastActive !== yesterday()) S.streak = 0;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }

/* ---------- Nível ---------- */
function levelInfo(total){
  let lvl = 1, rest = total;
  while (rest >= xpFor(lvl)) { rest -= xpFor(lvl); lvl++; }
  return { lvl, cur: rest, need: xpFor(lvl) };
}
function rankFor(lvl){ let r = RANKS[0]; for (const x of RANKS) if (lvl >= x[0]) r = x; return r; }
const streakBonus = () => Math.min(S.streak, 5) * 0.1; // +10% por dia, até +50%

/* ---------- Conquistas ---------- */
const BADGES = [
  { id:'first',  ico:'🌱', name:'Primeiro passo',   desc:'Conclua sua primeira missão', val:()=>S.done, max:1 },
  { id:'ten',    ico:'🎯', name:'Pegando o ritmo',  desc:'Conclua 10 missões',          val:()=>S.done, max:10 },
  { id:'fifty',  ico:'🏅', name:'Máquina',          desc:'Conclua 50 missões',          val:()=>S.done, max:50 },
  { id:'hundred',ico:'💎', name:'Centurião',        desc:'Conclua 100 missões',         val:()=>S.done, max:100 },
  { id:'hard5',  ico:'🗡️', name:'Destemido',        desc:'Conclua 5 missões difíceis',  val:()=>S.hardDone, max:5 },
  { id:'goal',   ico:'☀️', name:'Dia produtivo',    desc:'Bata a meta diária',          val:()=>todayCount() >= S.goal ? 1 : 0, max:1 },
  { id:'five',   ico:'⚡', name:'Turbo',            desc:'Conclua 5 missões em um dia', val:()=>todayCount(), max:5 },
  { id:'st3',    ico:'🔥', name:'Em chamas',        desc:'Sequência de 3 dias',         val:()=>S.bestStreak, max:3 },
  { id:'st7',    ico:'🌋', name:'Imparável',        desc:'Sequência de 7 dias',         val:()=>S.bestStreak, max:7 },
  { id:'st30',   ico:'👑', name:'Hábito de ferro',  desc:'Sequência de 30 dias',        val:()=>S.bestStreak, max:30 },
  { id:'lvl5',   ico:'🦊', name:'Aventureiro',      desc:'Alcance o nível 5',           val:()=>levelInfo(S.totalXp).lvl, max:5 },
  { id:'lvl10',  ico:'🐉', name:'Veterano',         desc:'Alcance o nível 10',          val:()=>levelInfo(S.totalXp).lvl, max:10 },
  { id:'buy',    ico:'🛍️', name:'Mereço!',          desc:'Resgate uma recompensa',      val:()=>S.bought, max:1 },
  { id:'rich',   ico:'💰', name:'Cofrinho',         desc:'Junte 300 moedas',            val:()=>S.coins, max:300 },
];
const todayCount = () => S.history[today()] || 0;
function checkBadges(){
  for (const b of BADGES) {
    if (!S.badges[b.id] && b.val() >= b.max) {
      S.badges[b.id] = Date.now();
      setTimeout(() => { toast(b.ico, 'Conquista desbloqueada!', b.name); sfx('badge'); }, 450);
    }
  }
}

/* ---------- Ações ---------- */
let curDiff = 'easy', curFilter = 'pending';

function addTask(title){
  S.tasks.unshift({ id: uid(), title, diff: curDiff, cat: $('#catSel').value, daily: $('#dailyChk').checked, done: false, created: Date.now() });
  save(); render(); sfx('add');
}

function complete(id, el){
  const k = S.tasks.find(x => x.id === id); if (!k || k.done) return;
  const before = levelInfo(S.totalXp).lvl;
  const t = today();
  // Sequência
  if (S.lastActive !== t) {
    S.streak = S.lastActive === yesterday() ? S.streak + 1 : 1;
    S.lastActive = t;
    S.bestStreak = Math.max(S.bestStreak, S.streak);
  }
  const d = DIFF[k.diff];
  const mult = 1 + streakBonus();
  const goalBefore = todayCount() >= S.goal;
  const xp = Math.round(d.xp * mult), coins = Math.round(d.coins * mult);
  k.done = true; k.doneDay = t; k.doneAt = Date.now(); k.earned = { xp, coins, day: t };
  S.totalXp += xp; S.coins += coins; S.done++; if (k.diff === 'hard') S.hardDone++;
  S.history[t] = (S.history[t] || 0) + 1;
  // Bônus por bater a meta
  let bonus = 0;
  if (!goalBefore && todayCount() >= S.goal) { bonus = 20; S.coins += bonus; k.earned.bonus = bonus; }

  const r = el.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2, d.color);
  floatText(r.left + r.width / 2, r.top, `+${xp} XP`, 'var(--xp)');
  setTimeout(() => floatText(r.left + r.width / 2 + 40, r.top + 6, `+${coins} 🪙`, 'var(--coin)'), 150);
  sfx('done');
  if (bonus) setTimeout(() => { toast('🎯', 'Meta diária batida!', `Bônus de +${bonus} moedas`); sfx('badge'); }, 300);

  checkBadges(); save(); render(id);
  bumpEl('#coins'); bumpEl('#todayDone');
  const after = levelInfo(S.totalXp).lvl;
  if (after > before) setTimeout(() => levelUp(after), 650);
}

function undo(id){
  const k = S.tasks.find(x => x.id === id); if (!k || !k.done) return;
  const e = k.earned || { xp: 0, coins: 0 };
  S.totalXp = Math.max(0, S.totalXp - e.xp);
  S.coins = Math.max(0, S.coins - e.coins - (e.bonus || 0));
  S.done = Math.max(0, S.done - 1);
  if (k.diff === 'hard') S.hardDone = Math.max(0, S.hardDone - 1);
  if (e.day && S.history[e.day]) S.history[e.day]--;
  k.done = false; k.earned = null; k.doneDay = null;
  save(); render(); sfx('undo');
}

function removeTask(id){
  S.tasks = S.tasks.filter(x => x.id !== id);
  save(); render();
}

function buy(id){
  const r = S.rewards.find(x => x.id === id); if (!r || S.coins < r.cost) return;
  S.coins -= r.cost; S.spent += r.cost; S.bought++;
  toast(r.ico, 'Recompensa resgatada!', `Aproveite: ${r.name}`);
  sfx('buy'); checkBadges(); save(); render(); bumpEl('#coins');
}

/* ---------- Render ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function render(popId){
  const L = levelInfo(S.totalXp);
  const [, ico, title] = rankFor(L.lvl);
  $('#avatar').firstChild.nodeValue = ico;
  $('#lvlBadge').textContent = L.lvl;
  $('#rank').textContent = `Nível ${L.lvl}` + (S.streak > 1 ? ` · bônus +${Math.round(streakBonus()*100)}% XP` : '');
  $('#title').textContent = title;
  $('#xpFill').style.width = (L.cur / L.need * 100) + '%';
  $('#xpNow').textContent = `${L.cur} / ${L.need} XP`;
  $('#xpNext').textContent = `faltam ${L.need - L.cur} XP`;
  $('#coins').textContent = S.coins;
  $('#streak').textContent = S.streak;
  const tc = todayCount();
  $('#todayDone').textContent = tc;
  $('#goalTxt').textContent = `${Math.min(tc, S.goal)}/${S.goal}`;
  $('#ringProg').style.strokeDashoffset = 201.06 * (1 - Math.min(tc / S.goal, 1));
  const d = DIFF[curDiff], m = 1 + streakBonus();
  $('#rewardHint').textContent = `Recompensa: +${Math.round(d.xp*m)} XP · +${Math.round(d.coins*m)} 🪙`;

  const pending = S.tasks.filter(k => !k.done).length;
  $('#pendingCount').textContent = pending;
  $('#badgeCount').textContent = `${Object.keys(S.badges).length}/${BADGES.length}`;

  renderList(popId); renderRewards(); renderBadges(); renderStats();
}

function renderList(popId){
  const f = { pending: k => !k.done, done: k => k.done, daily: k => k.daily, all: () => true }[curFilter];
  const items = S.tasks.filter(f).sort((a, b) => (a.done - b.done) || ((b.doneAt||0) - (a.doneAt||0)));
  const ul = $('#list');
  if (!items.length) {
    const msg = { pending: ['🏝️','Nenhuma missão pendente.','Adicione uma nova ou aproveite o descanso, herói.'], done: ['🗺️','Nada concluído ainda.','Toque no quadrado de uma missão para concluí-la.'], daily: ['🔁','Sem missões diárias.','Marque “Diária” ao criar uma missão: ela volta todo dia.'], all: ['✨','Sua lista está vazia.','Escreva sua primeira missão acima.'] }[curFilter];
    ul.innerHTML = `<li class="empty"><div class="big">${msg[0]}</div><b>${msg[1]}</b><br><small>${msg[2]}</small></li>`;
    return;
  }
  ul.innerHTML = items.map(k => {
    const d = DIFF[k.diff];
    const xp = k.done && k.earned ? k.earned.xp : d.xp, co = k.done && k.earned ? k.earned.coins : d.coins;
    return `<li class="task${k.done ? ' done' : ''}${k.id === popId ? ' pop' : ''}" style="--c:${d.color}" data-id="${k.id}">
      <button class="check" data-act="toggle" aria-label="${k.done ? 'Desfazer' : 'Concluir'}: ${esc(k.title)}">✓</button>
      <div class="t-body">
        <div class="t-title">${esc(k.title)}</div>
        <div class="t-meta">
          <span class="tag">${d.name}</span>
          <span class="tag">${CATS[k.cat] || CATS.geral}</span>
          ${k.daily ? '<span class="tag">🔁 Diária</span>' : ''}
          <span class="tag xp">${k.done ? '+' : ''}${xp} XP</span>
          <span class="tag coin">${k.done ? '+' : ''}${co} 🪙</span>
        </div>
      </div>
      <button class="del" data-act="del" aria-label="Excluir: ${esc(k.title)}" title="Excluir">×</button>
    </li>`;
  }).join('');
}

function renderRewards(){
  $('#rewards').innerHTML = S.rewards.map(r => {
    const can = S.coins >= r.cost;
    return `<div class="reward">
      <div class="r-top"><span class="r-ico">${r.ico}</span><span class="tag coin">${r.cost} 🪙</span></div>
      <div class="r-name">${esc(r.name)}</div>
      <div class="reward-actions">
        <button class="btn" data-buy="${r.id}" ${can ? '' : 'disabled'}>${can ? 'Resgatar' : `Faltam ${r.cost - S.coins} 🪙`}</button>
        <button class="del" data-rdel="${r.id}" aria-label="Remover recompensa" title="Remover">×</button>
      </div>
    </div>`;
  }).join('') || '<div class="empty" style="grid-column:1/-1"><div class="big">🎁</div>Crie recompensas para gastar suas moedas.</div>';
}

function renderBadges(){
  $('#badges').innerHTML = BADGES.map(b => {
    const got = !!S.badges[b.id], v = Math.min(b.val(), b.max);
    return `<div class="badge${got ? '' : ' locked'}">
      <div class="b-ico">${b.ico}</div>
      <div style="flex:1;min-width:0">
        <div class="b-name">${b.name}</div>
        <div class="b-desc">${b.desc}</div>
        ${got ? `<div class="b-desc" style="color:var(--ok);font-weight:700">Desbloqueada ✓</div>` : `<div class="mini"><div style="width:${v / b.max * 100}%"></div></div>`}
      </div>
    </div>`;
  }).join('');
}

function renderStats(){
  const L = levelInfo(S.totalXp);
  const stats = [
    [S.done, 'missões concluídas'], [S.totalXp, 'XP total'], [L.lvl, 'nível atual'],
    [S.bestStreak, 'maior sequência (dias)'], [S.hardDone, 'missões difíceis'], [S.spent, 'moedas gastas'],
  ];
  $('#statsGrid').innerHTML = stats.map(([v, l]) => `<div class="stat"><b>${v}</b><small>${l}</small></div>`).join('');
  const days = [...Array(7)].map((_, i) => addDays(i - 6));
  const vals = days.map(d => S.history[dayKey(d)] || 0);
  const max = Math.max(...vals, S.goal, 1);
  $('#bars').innerHTML = days.map((d, i) => `<div class="bar-col${i === 6 ? ' today' : ''}">
    <span class="v">${vals[i]}</span>
    <div class="b" style="height:${vals[i] / max * 100}%"></div>
    <span class="d">${i === 6 ? 'hoje' : d.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '')}</span>
  </div>`).join('');
}

/* ---------- Efeitos ---------- */
const cv = $('#fx'), cx = cv.getContext('2d');
let parts = [], raf = null;
function sizeCanvas(){ const r = devicePixelRatio || 1; cv.width = innerWidth * r; cv.height = innerHeight * r; cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px'; cx.setTransform(r, 0, 0, r, 0, 0); }
addEventListener('resize', sizeCanvas); sizeCanvas();
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
function resolveColor(c){ const m = /var\((--[\w-]+)\)/.exec(c); return m ? getComputedStyle(document.documentElement).getPropertyValue(m[1]).trim() : c; }
function burst(x, y, color, n = 26){
  if (reduced) return;
  const pal = [resolveColor(color), resolveColor('var(--xp)'), resolveColor('var(--coin)'), '#c04cf5'];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 5;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 1, size: 3 + Math.random() * 4, c: pal[i % pal.length], rot: Math.random() * 6, sq: Math.random() > .5 });
  }
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.life > 0);
  for (const p of parts) {
    p.x += p.vx; p.y += p.vy; p.vy += .18; p.vx *= .98; p.life -= .018; p.rot += .15;
    cx.globalAlpha = Math.max(p.life, 0); cx.fillStyle = p.c;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot);
    if (p.sq) cx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * .6);
    else { cx.beginPath(); cx.arc(0, 0, p.size / 2, 0, 7); cx.fill(); }
    cx.restore();
  }
  cx.globalAlpha = 1;
  raf = parts.length ? requestAnimationFrame(tick) : null;
  if (!raf) cx.clearRect(0, 0, innerWidth, innerHeight);
}
function confettiRain(){
  if (reduced) return;
  for (let i = 0; i < 6; i++) setTimeout(() => burst(Math.random() * innerWidth, innerHeight * .3, 'var(--accent)', 30), i * 120);
}
function floatText(x, y, txt, color){
  const el = document.createElement('div');
  el.className = 'float'; el.textContent = txt; el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.color = color;
  document.body.appendChild(el); setTimeout(() => el.remove(), 1150);
}
function bumpEl(sel){ const el = $(sel).closest('.chip'); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
function toast(ico, title, sub){
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span class="ti">${ico}</span><div><b>${esc(title)}</b><small>${esc(sub)}</small></div>`;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = 0; setTimeout(() => el.remove(), 300); }, 3200);
}
function levelUp(lvl){
  const [, ico, title] = rankFor(lvl);
  $('#lvIco').textContent = ico;
  $('#lvTitle').textContent = `Nível ${lvl}!`;
  const prevTitle = rankFor(lvl - 1)[2];
  $('#lvText').textContent = title !== prevTitle ? `Evolução! Agora você é ${title}.` : `Continue assim, ${title}. Rumo ao nível ${lvl + 1}!`;
  $('#levelModal').classList.add('on');
  $('#lvClose').focus();
  confettiRain(); sfx('level');
}

/* ---------- Som (WebAudio, sem arquivos) ---------- */
let ac;
function sfx(type){
  if (!S.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const seq = { add: [[520, .06]], done: [[660, .07], [880, .09]], undo: [[440, .07], [330, .09]], buy: [[700, .06], [940, .06], [1180, .1]], badge: [[784, .08], [988, .08], [1318, .14]], level: [[523, .1], [659, .1], [784, .1], [1046, .25]] }[type] || [];
    let t = ac.currentTime;
    for (const [f, dur] of seq) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
      t += dur * 0.85;
    }
  } catch {}
}

/* ---------- Eventos ---------- */
$('#addForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('#taskInput').value.trim(); if (!v) { $('#taskInput').focus(); return; }
  addTask(v); $('#taskInput').value = '';
  if (curFilter === 'done') setFilter('pending');
});
$('#diffSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  curDiff = b.dataset.diff;
  $('#diffSeg').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
});
function setFilter(f){
  curFilter = f;
  $('#filters').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x.dataset.f === f));
  renderList();
}
$('#filters').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setFilter(b.dataset.f); });
$('#list').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const li = b.closest('.task'), id = li.dataset.id;
  if (b.dataset.act === 'del') { li.style.opacity = 0; li.style.transform = 'translateX(30px)'; setTimeout(() => removeTask(id), 200); return; }
  const k = S.tasks.find(x => x.id === id);
  k.done ? undo(id) : complete(id, b);
});
document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === b));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === 'tab-' + b.dataset.tab));
});
$('#rewardForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('#rewardName').value.trim(), cost = parseInt($('#rewardCost').value, 10);
  if (!name) { $('#rewardName').focus(); return; }
  if (!(cost > 0)) { $('#rewardCost').focus(); toast('🪙', 'Defina um custo', 'Quantas moedas vale essa recompensa?'); return; }
  S.rewards.push({ id: uid(), ico: REWARD_ICONS[Math.floor(Math.random() * REWARD_ICONS.length)], name, cost: Math.min(cost, 99999) });
  $('#rewardName').value = ''; $('#rewardCost').value = '';
  save(); render(); sfx('add');
});
$('#rewards').addEventListener('click', e => {
  const b = e.target.closest('[data-buy]'); if (b) return buy(b.dataset.buy);
  const d = e.target.closest('[data-rdel]'); if (d) { S.rewards = S.rewards.filter(r => r.id !== d.dataset.rdel); save(); render(); }
});
$('#lvClose').addEventListener('click', () => $('#levelModal').classList.remove('on'));
$('#levelModal').addEventListener('click', e => { if (e.target.id === 'levelModal') $('#levelModal').classList.remove('on'); });
addEventListener('keydown', e => { if (e.key === 'Escape') $('#levelModal').classList.remove('on'); });
$('#goalBtn').addEventListener('click', () => {
  const v = parseInt(prompt('Quantas missões por dia você quer concluir?', S.goal), 10);
  if (v > 0 && v <= 50) { S.goal = v; save(); render(); }
});
$('#resetBtn').addEventListener('click', () => {
  if (confirm('Apagar todo o progresso, missões e recompensas? Isso não pode ser desfeito.')) { S = fresh(); S.tasks = []; save(); render(); toast('🌱', 'Nova jornada', 'Tudo zerado. Boa sorte!'); }
});
function applyTheme(){ if (S.theme) document.documentElement.dataset.theme = S.theme; else delete document.documentElement.dataset.theme; }
$('#themeBtn').addEventListener('click', () => {
  const dark = S.theme ? S.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  S.theme = dark ? 'light' : 'dark'; applyTheme(); save();
});
function applySound(){ $('#soundBtn').textContent = S.sound ? '🔊' : '🔇'; }
$('#soundBtn').addEventListener('click', () => { S.sound = !S.sound; applySound(); save(); });

// Atualiza missões diárias se a página ficar aberta na virada do dia
let lastDay = today();
setInterval(() => { if (today() !== lastDay) { lastDay = today(); load(); render(); } }, 60000);

load(); applyTheme(); applySound(); render();
})();
</script>
</body>
</html>
