name: Deploy NEXI to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  # RAIZ: gera um APK novo a cada publicação. Ele abre o app publicado, então o conteúdo
  # se atualiza sozinho; o número do APK sobe sempre, para instalar por cima do anterior.
  raiz-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raiz-android
    env:
      RAIZ_VERSION_CODE: ${{ github.run_number }}
      RAIZ_VERSION_NAME: 1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: raiz-android/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Marcar a versão nativa no app
        run: |
          NATIVE=$(cat native-version.txt)
          node -e "const f='capacitor.config.json',c=JSON.parse(require('fs').readFileSync(f));c.appendUserAgent='RAIZAPK/'+process.argv[1]+'/'+process.env.RAIZ_VERSION_CODE;require('fs').writeFileSync(f,JSON.stringify(c,null,2))" "$NATIVE"
          echo "{\"versionCode\": $RAIZ_VERSION_CODE, \"versionName\": \"$RAIZ_VERSION_NAME\", \"native\": $NATIVE}" > apk.json
      - run: npm ci
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: raiz-android/android
      - run: mkdir -p out && mv android/app/build/outputs/apk/debug/app-debug.apk out/RAIZ.apk && mv apk.json out/
      - uses: actions/upload-artifact@v4
        with:
          name: RAIZ-apk
          path: raiz-android/out/

  deploy:
    needs: raiz-apk
    # o site publica mesmo se o APK falhar
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Carimbar versão do RAIZ (atualização automática do app)
        run: sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" linguas/sw.js
      - name: Colocar o APK do RAIZ no site
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: RAIZ-apk
          path: linguas/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
