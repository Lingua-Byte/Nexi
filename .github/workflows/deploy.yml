name: Deploy NEXI to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    env:
      RAIZ_VERSION_CODE: ${{ github.run_number }}
      RAIZ_VERSION_NAME: 1.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Carimbar versão do RAIZ (atualização automática do app)
        run: sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" linguas/sw.js

      # RAIZ: um APK novo a cada publicação. Ele abre o app publicado, então o conteúdo
      # se atualiza sozinho; o número sobe sempre, para instalar por cima do anterior.
      # Se o APK falhar, o site publica mesmo assim (continue-on-error).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: raiz-android/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Gerar o APK do RAIZ
        id: apk
        continue-on-error: true
        working-directory: raiz-android
        run: |
          NATIVE=$(cat native-version.txt)
          node -e "const f='capacitor.config.json',c=JSON.parse(require('fs').readFileSync(f));c.appendUserAgent='RAIZAPK/'+process.argv[1]+'/'+process.env.RAIZ_VERSION_CODE;require('fs').writeFileSync(f,JSON.stringify(c,null,2))" "$NATIVE"
          npm ci
          npx cap sync android
          (cd android && ./gradlew assembleDebug --no-daemon)
          cp android/app/build/outputs/apk/debug/app-debug.apk ../linguas/RAIZ.apk
          echo "{\"versionCode\": $RAIZ_VERSION_CODE, \"versionName\": \"$RAIZ_VERSION_NAME\", \"native\": $NATIVE}" > ../linguas/apk.json
      - name: Tirar arquivos de build do site
        run: rm -rf raiz-android/node_modules raiz-android/android/.gradle raiz-android/android/app/build raiz-android/android/build raiz-android/android/capacitor-cordova-android-plugins

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      # O GitHub às vezes ainda não registrou o pacote logo após o upload ("Found 0 artifacts"):
      # espera um pouco e, se falhar, tenta de novo.
      - name: Esperar o GitHub registrar o pacote
        run: sleep 15
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Esperar antes de tentar de novo
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Deploy to GitHub Pages (2ª tentativa)
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
