<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trastes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Aprenda violão em lições curtas: cordas, notas, acordes, ritmo e ouvido.">
<meta name="theme-color" content="#d4891f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: uma coluna estreita como app de celular — trilha em zigue-zague, lição em tela cheia, barra inferior fixa. */
:root{
  --bg:#eceff3; --surface:#ffffff; --ink:#1c1e26; --muted:#5d6472; --line:#d8dce4;
  --brass:#d4891f; --brass-deep:#9d600c; --brass-soft:#f7e5c6;
  --ok:#14906a; --ok-deep:#0d6a4d; --ok-soft:#d3f1e4;
  --bad:#cf4038; --bad-deep:#9c2c26; --bad-soft:#fadedb;
  --locked:#c5cad3; --locked-deep:#a7adb8;
  --wood:#4a2c22; --wood-2:#5c382a; --fretwire:#cfc8bb; --strg:#e8d6ae; --pearl:#efe8dc;
  --u1:#1f8a8a; --u2:#d4891f; --u3:#c4513f; --u4:#4b5bb5; --u5:#6f8a2a; --u6:#8a4a8f;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14161b; --surface:#1e2129; --ink:#eef0f4; --muted:#a3a9b6; --line:#31353f;
  --brass:#e9a03a; --brass-deep:#a8690c; --brass-soft:#3a2c16;
  --ok:#2fbf8c; --ok-deep:#16855f; --ok-soft:#15372b;
  --bad:#ef6a5f; --bad-deep:#ad3d35; --bad-soft:#3f201d;
  --locked:#3a3f4b; --locked-deep:#2a2e37;
  --pearl:#d9d1c3;
  --u1:#2fa5a5; --u2:#e29a31; --u3:#dd6a57; --u4:#6b7be0; --u5:#8aa83a; --u6:#b06bb5;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14161b; --surface:#1e2129; --ink:#eef0f4; --muted:#a3a9b6; --line:#31353f;
  --brass:#e9a03a; --brass-deep:#a8690c; --brass-soft:#3a2c16;
  --ok:#2fbf8c; --ok-deep:#16855f; --ok-soft:#15372b;
  --bad:#ef6a5f; --bad-deep:#ad3d35; --bad-soft:#3f201d;
  --locked:#3a3f4b; --locked-deep:#2a2e37;
  --pearl:#d9d1c3;
  --u1:#2fa5a5; --u2:#e29a31; --u3:#dd6a57; --u4:#6b7be0; --u5:#8aa83a; --u6:#b06bb5;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
h1,h2,h3{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:2px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:-.01em}
.logo svg{width:26px;height:26px}
.stats{display:flex;gap:4px}
.stat{display:flex;align-items:center;gap:4px;font-weight:800;font-variant-numeric:tabular-nums;padding:6px 8px;border-radius:12px;background:none;border:0}
.stat:hover{background:var(--surface)}
.stat svg{width:20px;height:20px}
.stat.flame{color:#e0702a}.stat.flame.off{color:var(--locked-deep)}
.stat.xp{color:var(--brass)}
.stat.heart{color:var(--bad)}

.view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}

/* daily goal */
.goal{display:flex;align-items:center;gap:14px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px}
.goal .ring{width:48px;height:48px;flex:none}
.goal b{font-family:var(--display);font-size:1.05rem}
.goal small{display:block;color:var(--muted);font-size:.85rem}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brass);border-radius:99px;transition:width .4s}

/* path */
.unit{margin-top:22px}
.unit-head{border-radius:var(--r);padding:14px 16px;color:#fff;background:var(--uc);box-shadow:0 4px 0 color-mix(in srgb,var(--uc) 70%,#000)}
.unit-head .eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.unit-head h2{font-size:1.3rem;margin-top:2px}
.unit-head p{margin:4px 0 0;font-size:.9rem;opacity:.92}
.unit.locked .unit-head{background:var(--locked);color:var(--muted);box-shadow:0 4px 0 var(--locked-deep)}
.nodes{display:flex;flex-direction:column;align-items:center;gap:18px;padding:52px 0 6px}
.node-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node{width:74px;height:70px;border-radius:50%;border:0;background:var(--uc);color:#fff;box-shadow:0 7px 0 color-mix(in srgb,var(--uc) 62%,#000);display:grid;place-items:center;transition:transform .08s,box-shadow .08s;position:relative}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 color-mix(in srgb,var(--uc) 62%,#000)}
.node svg{width:32px;height:32px}
.node.locked{background:var(--locked);color:var(--locked-deep);box-shadow:0 7px 0 var(--locked-deep)}
.node.current::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid var(--uc);opacity:.45;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.92);opacity:.6}100%{transform:scale(1.15);opacity:0}}
.stars{display:flex;gap:2px;margin-top:10px;height:14px}
.stars svg{width:14px;height:14px;color:var(--locked)}
.stars svg.on{color:var(--brass)}
.start-tag{position:absolute;top:-38px;background:var(--surface);border:2px solid var(--line);color:var(--uc);font-weight:800;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:10px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.start-tag::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-4px)}}
.node-label{font-size:.8rem;font-weight:700;color:var(--muted);margin-top:4px;text-align:center;max-width:150px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(10 12 16 / .45);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:22px 22px 0 0;padding:22px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .2s ease-out;display:flex;flex-direction:column;gap:12px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet h3{font-size:1.4rem}
.sheet p{margin:0;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 18px;font-weight:800;font-size:1rem;letter-spacing:.06em;text-transform:uppercase;background:var(--brass);color:#fff;box-shadow:0 4px 0 var(--brass-deep);transition:transform .06s,box-shadow .06s;width:100%}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brass-deep)}
.btn:disabled{background:var(--locked);color:var(--muted);box-shadow:0 4px 0 var(--locked-deep);cursor:not-allowed}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 var(--ok-deep)}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 var(--bad-deep)}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.small{width:auto;padding:9px 14px;font-size:.82rem}
.btn svg{width:20px;height:20px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:2px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{display:flex;width:100%;max-width:560px}
.nav button{flex:1;background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.nav button svg{width:26px;height:26px}
.nav button[aria-current="page"]{color:var(--brass)}

/* cards */
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px}
.section-title{font-size:1.25rem;margin:22px 0 10px}
.muted{color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}

/* lesson overlay */
.lesson{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.lesson-in{flex:1;display:flex;flex-direction:column;width:100%;max-width:600px;margin:0 auto;min-height:0}
.l-head{display:flex;align-items:center;gap:12px;padding:14px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.l-head .x{background:none;border:0;padding:4px;color:var(--muted);display:grid}
.l-head .x svg{width:26px;height:26px}
.l-head .bar{flex:1;height:16px}
.l-head .bar>i{background:var(--ok)}
.l-hearts{display:flex;align-items:center;gap:4px;font-weight:800;color:var(--bad);font-variant-numeric:tabular-nums}
.l-hearts svg{width:22px;height:22px}
.l-body{flex:1;overflow-y:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.l-foot{border-top:2px solid var(--line);padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px}
.kicker{font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
.prompt{font-family:var(--display);font-size:1.45rem;font-weight:800}
.prompt small{display:block;font-family:var(--body);font-size:.95rem;font-weight:600;color:var(--muted);margin-top:6px}
.visual{display:flex;justify-content:center}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;padding:13px 14px;font-weight:700;text-align:left;display:flex;align-items:center;gap:10px;transition:transform .06s}
.opt:active{transform:translateY(2px)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:var(--muted)}
.opt.sel{border-color:var(--brass);background:var(--brass-soft)}
.opt.sel .k{border-color:var(--brass);color:var(--brass)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.diag{flex-direction:column;justify-content:center;padding:10px}
.opt.diag svg{width:100%;max-width:110px}
.opt.pat{justify-content:center}
.opt:disabled{cursor:default}
.play{display:flex;justify-content:center;gap:12px}
.playbtn{width:96px;height:96px;border-radius:24px;border:0;background:var(--u4);color:#fff;box-shadow:0 6px 0 color-mix(in srgb,var(--u4) 60%,#000);display:grid;place-items:center}
.playbtn:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--u4) 60%,#000)}
.playbtn svg{width:44px;height:44px}
.playbtn.slow{width:64px;height:64px;border-radius:18px;align-self:flex-end}
.playbtn.slow svg{width:28px;height:28px}

/* feedback */
.fb{position:absolute;left:0;right:0;bottom:0;z-index:5;animation:up .18s ease-out}
.fb-in{max-width:600px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.fb.ok{background:var(--ok-soft);color:var(--ok-deep)}
.fb.bad{background:var(--bad-soft);color:var(--bad-deep)}
:root[data-theme="dark"] .fb.ok{color:var(--ok)} :root[data-theme="dark"] .fb.bad{color:var(--bad)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fb.ok{color:var(--ok)}:root:not([data-theme="light"]) .fb.bad{color:var(--bad)}}
.fb h3{font-size:1.35rem;display:flex;align-items:center;gap:8px}
.fb h3 svg{width:28px;height:28px}
.fb p{margin:0;color:var(--ink);font-weight:600}
.fb p.exp{font-weight:400;color:var(--muted)}

/* fretboard */
.fbwrap{--open:46px;width:100%;overflow-x:auto;padding:4px 0}
.board{--F:5;position:relative;display:grid;grid-template-columns:var(--open) repeat(var(--F),minmax(44px,1fr));min-width:calc(var(--open) + var(--F) * 46px);border-radius:10px;overflow:hidden;background:linear-gradient(90deg,var(--bg) 0 var(--open),transparent var(--open)),linear-gradient(180deg,var(--wood-2),var(--wood));box-shadow:0 3px 0 var(--line)}
.board .nut{position:absolute;top:0;bottom:0;left:calc(var(--open) - 6px);width:7px;background:var(--pearl);z-index:1}
.board .inlay{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--pearl);opacity:.75;transform:translate(-50%,-50%);z-index:0}
.cell{position:relative;height:40px;border:0;padding:0;background:none;z-index:2;border-right:3px solid var(--fretwire)}
.cell.o{border-right:0}
.cell::before{content:"";position:absolute;left:0;right:0;top:50%;height:var(--sw,2px);transform:translateY(-50%);background:var(--strg);box-shadow:0 1px 0 rgb(0 0 0 / .35)}
.cell.o::before{left:50%;background:color-mix(in srgb,var(--strg) 60%,var(--muted))}
.cell .lbl{position:absolute;left:4px;top:50%;transform:translateY(-50%);font:700 .72rem var(--mono);color:var(--muted)}
.cell .dot{position:absolute;left:50%;top:50%;width:28px;height:28px;border-radius:50%;transform:translate(-50%,-50%);display:grid;place-items:center;font:700 .75rem var(--mono);color:#fff;background:var(--brass);box-shadow:0 2px 0 rgb(0 0 0 / .35);z-index:3}
.cell .dot.ok{background:var(--ok)} .cell .dot.bad{background:var(--bad)} .cell .dot.ghost{background:transparent;border:3px solid var(--ok);color:var(--ok)}
.cell .dot.mute,.cell .dot.open{background:var(--surface);color:var(--ink);border:2px solid var(--ink);width:24px;height:24px;font-size:.8rem;box-shadow:none}
.cell .dot.mute{color:var(--bad);border-color:var(--bad)}
.cell.dim{opacity:.35}
.cell:not(:disabled):hover .hov{opacity:1}
.cell .hov{position:absolute;left:50%;top:50%;width:22px;height:22px;border-radius:50%;transform:translate(-50%,-50%);background:rgb(255 255 255 / .22);opacity:0;transition:opacity .1s}
.fretnums{display:grid;grid-template-columns:var(--open) repeat(var(--F),minmax(44px,1fr));min-width:calc(var(--open) + var(--F) * 46px);font:600 .7rem var(--mono);color:var(--muted);text-align:center;margin-top:4px}

/* chord svg */
.chord-svg{width:150px;max-width:100%;color:var(--ink)}
.chord-svg .ln{stroke:var(--ink);stroke-width:1.4;fill:none}
.chord-svg .nutl{stroke:var(--ink);stroke-width:5}
.chord-svg .d{fill:var(--ink)}
.chord-svg .ft{fill:var(--surface);font:700 8px var(--mono);text-anchor:middle;dominant-baseline:central}
.chord-svg .mk{fill:none;stroke:var(--ink);stroke-width:1.5}
.chord-svg .tx{fill:var(--ink);font:700 9px var(--mono);text-anchor:middle}
.chord-svg .nm{fill:var(--muted);font:600 7px var(--mono);text-anchor:middle}

/* tab */
.tab{font:700 1.02rem/1.35 var(--mono);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 16px;margin:0;overflow-x:auto;white-space:pre;letter-spacing:.04em}
.tab b{color:var(--brass)}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.mt{background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;padding:14px 10px;font-weight:800;font-size:1.05rem;text-align:center}
.mt.sel{border-color:var(--u4);background:color-mix(in srgb,var(--u4) 14%,var(--surface))}
.mt.done{opacity:.35;border-color:var(--ok);pointer-events:none}
.mt.shake{animation:shake .3s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* rhythm */
.rhythm{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.slots{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.slot{background:var(--surface);border:2px solid var(--line);border-radius:10px;text-align:center;padding:6px 0 4px;transition:background .05s}
.slot .ar{font-size:1.5rem;font-weight:800;line-height:1.1;height:1.7rem;color:var(--ink)}
.slot .ct{font:600 .7rem var(--mono);color:var(--muted)}
.slot.now{background:var(--brass-soft);border-color:var(--brass)}
.slot.hit{border-color:var(--ok);background:var(--ok-soft)}
.slot.miss{border-color:var(--bad);background:var(--bad-soft)}
.taparea{height:130px;border-radius:22px;border:0;background:var(--u5);color:#fff;font-family:var(--display);font-weight:800;font-size:1.6rem;box-shadow:0 7px 0 color-mix(in srgb,var(--u5) 60%,#000);touch-action:manipulation;user-select:none}
.taparea:active,.taparea.flash{transform:translateY(5px);box-shadow:0 2px 0 color-mix(in srgb,var(--u5) 60%,#000)}
.taparea:disabled{background:var(--locked);color:var(--muted);box-shadow:0 7px 0 var(--locked-deep)}
.status{text-align:center;font-weight:800;min-height:1.5em;color:var(--muted)}
.pat-arrows{font:800 1.15rem var(--mono);letter-spacing:.12em}

/* tuner */
.tuner{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.tnote{font-family:var(--display);font-weight:800;font-size:4rem;line-height:1}
.tnote small{font-size:1.1rem;color:var(--muted);display:block;font-weight:600;font-family:var(--body);margin-top:4px}
.meter{position:relative;width:100%;max-width:340px;height:44px;border-radius:12px;background:linear-gradient(90deg,var(--bad-soft),var(--ok-soft) 42% 58%,var(--bad-soft));border:2px solid var(--line)}
.meter .ctr{position:absolute;left:50%;top:4px;bottom:4px;width:2px;background:var(--ok);transform:translateX(-50%)}
.meter .needle{position:absolute;top:-6px;bottom:-6px;width:6px;border-radius:3px;background:var(--ink);left:50%;transform:translateX(-50%);transition:left .12s}
.meter.ok .needle{background:var(--ok)}
.strbtns{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:100%}
.strbtns button{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:8px 0;font-weight:800}
.strbtns button small{display:block;font-size:.66rem;color:var(--muted);font-weight:700}
.strbtns button.on{border-color:var(--ok);background:var(--ok-soft)}

/* metronome */
.metro{display:flex;flex-direction:column;align-items:center;gap:12px}
.bpm{font-family:var(--display);font-weight:800;font-size:3rem;font-variant-numeric:tabular-nums;line-height:1}
.beats{display:flex;gap:10px}
.beats i{width:18px;height:18px;border-radius:50%;background:var(--line)}
.beats i.on{background:var(--brass)}
.beats i.on.acc{background:var(--bad)}
input[type=range]{width:100%;max-width:340px;accent-color:var(--brass)}

/* chord dictionary */
.chordcard{background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:var(--r);padding:12px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.chordcard b{font-family:var(--display);font-size:1.25rem}
.chordcard small{color:var(--muted);font-size:.8rem}
.chordcard svg{width:100%;max-width:120px}
.chordcard:active{transform:translateY(2px)}

/* profile */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sg{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px}
.sg b{font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums;display:block;line-height:1.1}
.sg span{color:var(--muted);font-size:.85rem;font-weight:700}
.ach{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:2px solid var(--line)}
.ach:last-child{border-bottom:0}
.ach .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--locked);color:var(--locked-deep);flex:none}
.ach.got .ic{background:var(--brass);color:#fff}
.ach .ic svg{width:24px;height:24px}
.ach b{display:block}
.ach small{color:var(--muted)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:2px solid var(--line)}
.toggle:last-child{border-bottom:0}
.toggle small{display:block;color:var(--muted)}
.sw{appearance:none;width:52px;height:30px;border-radius:99px;background:var(--locked);position:relative;cursor:pointer;flex:none;transition:background .15s;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw:checked{background:var(--ok)}
.sw:checked::after{left:25px}

/* results */
.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.result h2{font-size:2rem}
.result .big-ic{width:110px;height:110px;color:var(--brass)}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chip{border:2px solid var(--line);border-radius:14px;overflow:hidden;min-width:96px;background:var(--surface)}
.chip span{display:block;font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;color:#fff;background:var(--cc)}
.chip b{display:block;font-family:var(--display);font-size:1.4rem;padding:8px;font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:90;max-width:calc(100% - 32px);text-align:center;animation:up .2s}
.intro-text{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px}
.intro-text p{margin:0 0 6px}.intro-text p:last-child{margin:0}
.mic-live{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.mic-live .tnote{font-size:3rem}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:380px){.prompt{font-size:1.25rem}.opts.two{gap:8px}}

/* ============ Componentes visuais ============ */
function chordSVG(k, {names = false} = {}){
  const c = CHORDS[k], fr = c.frets, fg = c.fing;
  const X = s => 16 + s * 14, Y0 = 26, FH = 20;
  let g = `<svg class="chord-svg" viewBox="0 0 102 ${names ? 140 : 132}" role="img" aria-label="Diagrama do acorde ${k}">`;
  g += `<line class="nutl" x1="${X(0) - 1}" y1="${Y0}" x2="${X(5) + 1}" y2="${Y0}"/>`;
  for (let f = 1; f <= 5; f++) g += `<line class="ln" x1="${X(0)}" y1="${Y0 + f * FH}" x2="${X(5)}" y2="${Y0 + f * FH}"/>`;
  for (let s = 0; s < 6; s++) {
    g += `<line class="ln" x1="${X(s)}" y1="${Y0}" x2="${X(s)}" y2="${Y0 + 5 * FH}" style="stroke-width:${1.9 - s * .15}"/>`;
    if (fr[s] < 0) g += `<path class="mk" d="M${X(s) - 4} 10l8 8M${X(s) + 4} 10l-8 8"/>`;
    else if (fr[s] === 0) g += `<circle class="mk" cx="${X(s)}" cy="14" r="4.2"/>`;
    else g += `<circle class="d" cx="${X(s)}" cy="${Y0 + (fr[s] - .5) * FH}" r="6.6"/><text class="ft" x="${X(s)}" y="${Y0 + (fr[s] - .5) * FH + .5}">${fg[s] || ''}</text>`;
    if (names) g += `<text class="nm" x="${X(s)}" y="136">${SLET[s]}</text>`;
  }
  return g + '</svg>';
}
function tabHTML(cols){
  const lines = [];
  for (let s = 5; s >= 0; s--) {
    let l = SLET[s] + '|-';
    for (const col of cols) { const n = col.find(x => x.s === s); const t = n ? String(n.f) : ''; l += (n ? '<b>' + t + '</b>' : '') + '-'.repeat(Math.max(0, 2 - t.length)) + '-'; }
    lines.push(l + '|');
  }
  return lines.join('\n');
}

const patArrows = p => p.split('').map(ch => ARROW[ch] || '·').join(' ');

/* Braço do violão (horizontal, 1ª corda em cima, como na tablatura) */
function fretboard({frets = 5, marks = [], onTap = null, only = null, labels = true, sound = true} = {}){
  const wrap = h('div', {class:'fbwrap'});
  const board = h('div', {class:'board', style:`--F:${frets}`});
  const cells = {};
  for (let row = 0; row < 6; row++) {
    const s = 5 - row;
    for (let f = 0; f <= frets; f++) {
      const dim = only != null && only !== s;
      const b = h('button', {class:'cell' + (f === 0 ? ' o' : '') + (dim ? ' dim' : ''), style:`--sw:${(1 + (5 - row) * .45).toFixed(2)}px`, 'aria-label':`${num(s)} corda, ${f === 0 ? 'solta' : 'casa ' + f}`, disabled: dim || null});
      b.append(h('span', {class:'hov'}));
      if (f === 0 && labels) b.append(h('span', {class:'lbl'}, SLET[s]));
      b.addEventListener('click', () => { if (sound) playNote(OPEN[s] + f, 0, .6, 1.6); onTap && onTap(s, f, b); });
      cells[s + ':' + f] = b; board.append(b);
    }
  }
  board.append(h('div', {class:'nut'}));
  for (const f of [3, 5, 7, 9]) if (f <= frets) board.append(h('i', {class:'inlay', style:`left:calc(var(--open) + (100% - var(--open)) * ${(f - .5) / frets});top:50%`}));
  if (frets >= 12) for (const tp of ['33.3%','66.6%']) board.append(h('i', {class:'inlay', style:`left:calc(var(--open) + (100% - var(--open)) * ${11.5 / frets});top:${tp}`}));
  const nums = h('div', {class:'fretnums', style:`--F:${frets}`}, h('span', {}, ''), ...times(frets, i => h('span', {}, String(i + 1))));
  wrap.append(board, nums);
  const api = {
    el: wrap,
    clear(){ board.querySelectorAll('.dot').forEach(d => d.remove()); },
    mark(s, f, label = '', cls = ''){ const c = cells[s + ':' + f]; if (!c) return; c.querySelector('.dot')?.remove(); c.append(h('span', {class:'dot ' + cls}, label)); },
    unmark(s, f){ cells[s + ':' + f]?.querySelector('.dot')?.remove(); },
    disable(){ Object.values(cells).forEach(c => c.disabled = true); },
  };
  marks.forEach(m => api.mark(m.s, m.f, m.label || '', m.cls || ''));
  return api;
}

function tunerCard(){

  const ov = h('div', {class:'lesson', role:'dialog', 'aria-label':lesson.title});

}
function cleanupQ(){ if (!L) return; L.cleanup.forEach(f => { try{ f(); }catch(e){} }); L.cleanup = []; }
function closeLesson(){ cleanupQ(); micStop(); L?.ov.remove(); L = null; document.body.style.overflow = ''; render(); }

  scrim.append(h('div', {class:'sheet'}, h('h3', {}, 'Sair agora?'), h('p', {}, 'O progresso desta lição será perdido.'),
    h('button', {class:'btn', onclick:() => scrim.remove()}, 'Continuar a lição'),
    h('button', {class:'btn ghost', onclick:() => { scrim.remove(); closeLesson(); }}, 'Sair')));
  document.body.append(scrim);
}
function setProgress(){ const tot = L.done + L.queue.length; $('.l-head .bar>i', L.ov).style.width = (tot ? 100 * L.done / tot : 0) + '%'; const hs = $('.l-hearts span', L.ov); if (hs && !L.practice) hs.textContent = S.hearts; }
function nextQ(){
  cleanupQ();
  L.ov.querySelector('.fb')?.remove();
  setProgress();
  if (!L.queue.length) return finishLesson();
  const q = L.queue[0]; L.q = q; L.state = 'q';
  const body = $('.l-body', L.ov), foot = $('.l-foot', L.ov);
  body.innerHTML = ''; foot.innerHTML = ''; body.scrollTop = 0;
  const check = h('button', {class:'btn', disabled:true}, 'Verificar');
  L.checkBtn = check; L.ready = v => { check.disabled = !v; };
  check.onclick = () => { if (!check.disabled && L.grade) answer(L.grade()); };
  foot.append(check);

}
function answer(res){

  L.queue.shift();

  else { L.queue.push(q); if (!L.practice) loseHeart(); }

  sfx(res.ok ? 'ok' : res.skip ? '' : 'bad');

  const praise = pick(['Mandou bem!','Isso aí!','Afinadíssimo!','Certinho!','Muito bom!']);
  const fb = h('div', {class:'fb ' + (res.ok || res.skip ? 'ok' : 'bad'), role:'status'});
  const inn = h('div', {class:'fb-in'});
  inn.append(h('h3', {html:(res.ok ? ICON.check + praise : res.skip ? 'Exercício pulado' : ICON.x + 'Não foi dessa vez')}));
  if (!res.ok && res.correct) inn.append(h('p', {}, 'Resposta certa: ' + res.correct));

  const out = !L.practice && S.hearts <= 0 && !res.ok && !res.skip;
  const cont = h('button', {class:'btn ' + (res.ok || res.skip ? 'ok' : 'bad')}, out ? 'Ver resultado' : 'Continuar');
  cont.onclick = () => out ? (closeLesson(), noHearts()) : nextQ();
  inn.append(cont); fb.append(inn);
  $('.lesson-in', L.ov).style.position = 'relative';
  $('.lesson-in', L.ov).append(fb);
  L.contBtn = cont; setTimeout(() => cont.focus(), 30);
  L.ov.querySelectorAll('.l-body button, .l-body input').forEach(b => { if (!b.classList.contains('playbtn') && !b.classList.contains('keep')) b.disabled = true; });
}
function finishLesson(){
  cleanupQ(); micStop();
  L.state = 'end';
  const acc = L.graded ? Math.round(100 * L.firstOk / L.graded) : 100;
  const stars = acc >= 90 ? 3 : acc >= 70 ? 2 : 1;
  let xp = L.practice ? 5 : 10 + (acc === 100 ? 5 : 0);
  const prev = S.prog[L.lesson.id];
  if (!L.practice) S.prog[L.lesson.id] = {stars:Math.max(stars, prev?.stars || 0), best:Math.max(acc, prev?.best || 0)};
  if (L.practice && S.hearts < MAXH) { S.hearts++; if (S.hearts >= MAXH) S.heartsTs = Date.now(); }
  S.xp += xp; if (S.day !== today()) { S.day = today(); S.dayXp = 0; }
  S.dayXp += xp;
  let streakUp = false;
  if (S.lastDay !== today()) { S.streak = S.lastDay === yesterday() ? S.streak + 1 : 1; S.lastDay = today(); streakUp = true; }
  S.best = Math.max(S.best, S.streak);
  save();
  if (acc === 100 && L.graded >= 3) grant('perfeita');
  checkAch();
  sfx('win');
  const secs = Math.round((Date.now() - L.start) / 1000);
  const body = $('.l-body', L.ov), foot = $('.l-foot', L.ov);
  $('.l-head .bar>i', L.ov).style.width = '100%';
  body.innerHTML = ''; foot.innerHTML = '';
  const r = h('div', {class:'result'});
  r.append(h('div', {class:'big-ic', html:ICON.trophy}), h('h2', {}, L.practice ? 'Treino concluído' : 'Lição concluída!'));
  if (streakUp) r.append(h('p', {class:'muted', style:'margin:0;font-weight:700'}, `Ofensiva: ${S.streak} ${S.streak === 1 ? 'dia' : 'dias'} seguidos`));
  r.append(h('div', {class:'chips'},
    h('div', {class:'chip', style:'--cc:var(--brass)'}, h('span', {}, 'XP'), h('b', {}, '+' + xp)),
    h('div', {class:'chip', style:'--cc:var(--ok)'}, h('span', {}, 'Acerto'), h('b', {}, acc + '%')),
    h('div', {class:'chip', style:'--cc:var(--u4)'}, h('span', {}, 'Tempo'), h('b', {}, `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`))));
  if (!L.practice) r.append(starRow(stars));
  if (L.practice && S.hearts <= MAXH) r.append(h('p', {class:'muted', style:'margin:0'}, `Vidas: ${S.hearts} de ${MAXH}`));
  body.append(r);
  const b = h('button', {class:'btn ok', onclick:closeLesson}, 'Continuar'); foot.append(b); b.focus();
}
function noHearts(){
  syncHearts();
  const mins = Math.ceil((REGEN - (Date.now() - S.heartsTs)) / 60000);
  const scrim = h('div', {class:'scrim', onclick:e => { if (e.target === scrim) scrim.remove(); }});
  scrim.append(h('div', {class:'sheet'}, h('h3', {}, 'Suas vidas acabaram'), h('p', {}, `Uma nova vida chega em ${mins} min. Ou faça um Treino livre: ele não gasta vidas e devolve uma ao final.`),
    h('button', {class:'btn', onclick:() => { scrim.remove(); startLesson(freeLesson()); }}, 'Fazer Treino livre'),
    h('button', {class:'btn ghost', onclick:() => scrim.remove()}, 'Agora não')));
  document.body.append(scrim);
}

/* ---------- Áudio de exercícios ---------- */
function playAudio(a, slow = false){
  const c = ctx(), t = c.currentTime + .05, k = slow ? 1.7 : 1;
  if (a.note != null) playNote(a.note, t, .8);
  else if (a.chord) strumChord(a.chord, t, {gap:slow ? .09 : .026});
  else if (a.seq) a.seq.forEach((m, i) => playNote(m, t + i * .9 * k, .8, 1.2 * k));
  else if (a.prog) a.prog.forEach((ch, i) => { const b = t + i * 1.5 * k; strumChord(ch, b, {dur:.8 * k}); strumChord(ch, b + .75 * k, {down:false, vol:.35, dur:.7 * k}); });
  else if (a.pattern) playPattern(a.pattern, a.bpm || 80, t, slow ? .75 : 1);
}
function playPattern(p, bpm, t0, rate = 1){
  const beat = 60 / (bpm * rate), e = beat / 2;
  for (let bar = 0; bar < 2; bar++) for (let i = 0; i < 8; i++) {
    const t = t0 + (bar * 8 + i) * e;
    if (i % 2 === 0) blip(i === 0 ? 1500 : 1000, t, .03, .12);
    const ch = p[i]; if (ch === 'D' || ch === 'U') strumChord('Em', t, {down:ch === 'D', vol:ch === 'D' ? .45 : .3, dur:e * 1.6, gap:.012});
  }
  return t0 + 16 * e;
}
function audioButtons(q, body){
  const row = h('div', {class:'play'});
  row.append(h('button', {class:'playbtn keep', 'aria-label':'Ouvir', html:ICON.play, onclick:() => playAudio(q.audio)}));
  if (q.autoplay) row.append(h('button', {class:'playbtn slow keep', 'aria-label':'Ouvir devagar', html:ICON.slow, onclick:() => playAudio(q.audio, true)}));
  body.append(row);
}
function visual(v){
  const box = h('div', {class:'visual'});
  if (v.chord) box.innerHTML = chordSVG(v.chord, {names:true});
  else if (v.tab) box.append(h('pre', {class:'tab', html:tabHTML(v.tab)}));
  else if (v.fret) box.append(fretboard({frets:v.fret.frets || 5, marks:v.fret.marks, labels:false}).el);
  return box;
}
function header(q, body, title, small){
  body.append(h('div', {class:'kicker'}, q.kicker || ''));
  const p = h('div', {class:'prompt'}, title); if (small) p.append(h('small', {}, small));
  body.append(p);
}

/* ---------- Renderizadores ---------- */
const RENDER = {
  mc(q, body){
    header(q, body, q.prompt, q.small);
    if (q.visual) body.append(visual(q.visual));
    if (q.audio && (q.autoplay || !q.visual)) audioButtons(q, body);
    if (q.autoplay) setTimeout(() => L && L.q === q && playAudio(q.audio), 350);
    const isDiag = q.options.some(o => o && o.chord), isPat = q.options.some(o => o && o.pattern);
    const grid = h('div', {class:'opts' + (q.two || isDiag ? ' two' : '')});
    let sel = -1; const btns = [];
    q.options.forEach((o, i) => {
      const b = h('button', {class:'opt' + (isDiag ? ' diag' : '') + (isPat ? ' pat' : ''), 'aria-pressed':'false'});
      if (isDiag) b.innerHTML = chordSVG(o.chord);
      else if (isPat) b.append(h('span', {class:'pat-arrows'}, patArrows(o.pattern)));
      else b.append(h('span', {class:'k'}, String(i + 1)), h('span', {}, o));
      b.onclick = () => { sel = i; btns.forEach((x, j) => { x.classList.toggle('sel', j === i); x.setAttribute('aria-pressed', j === i); }); L.ready(true); if (isDiag) strumChord(o.chord); };
      btns.push(b); grid.append(b);
    });
    body.append(grid);
    L.keys = n => { if (btns[n]) btns[n].click(); };
    const label = o => o.chord ? chordLabel(o.chord) : o.pattern ? patArrows(o.pattern) : o;
    L.grade = () => { const ok = sel === q.answer; btns[q.answer].classList.add('right'); if (!ok) btns[sel].classList.add('wrong'); if (q.audio && !q.autoplay) playAudio(q.audio); return {ok, correct:label(q.options[q.answer]), explain:q.explain}; };
  },
  intro(q, body){
    header(q, body, q.title);
    if (q.chord) { const vb = h('div', {class:'visual', html:chordSVG(q.chord, {names:true})}); body.append(vb); body.append(h('div', {class:'play'}, h('button', {class:'btn small ghost keep', onclick:() => strumChord(q.chord)}, 'Ouvir acorde'), h('button', {class:'btn small ghost keep', onclick:() => strumChord(q.chord, 0, {gap:.35})}, 'Corda por corda'))); }
    if (q.fret) { const marks = q.fret === true ? [0,1,2,3,4,5].map(s => ({s, f:0, label:CF[pc(OPEN[s])], cls:'open'})) : times(6, f => f).filter(f => NATURAL.includes(pc(OPEN[q.fret.s] + f))).map(f => ({s:q.fret.s, f, label:CF[pc(OPEN[q.fret.s] + f)]})); body.append(fretboard({frets:5, marks}).el); }
    if (q.pattern) { body.append(slotsEl(q.pattern)); body.append(h('div', {class:'play'}, h('button', {class:'btn small ghost keep', onclick:() => playPattern(q.pattern, 72, ctx().currentTime + .05)}, 'Ouvir batida'))); }
    const t = h('div', {class:'intro-text'}); q.body.forEach(p => t.append(h('p', {html:p}))); body.append(t);
    L.checkBtn.textContent = 'Continuar'; L.ready(true);
    L.checkBtn.onclick = () => { L.queue.shift(); L.done++; nextQ(); };
  },
  tap(q, body){
    header(q, body, `Toque a nota ${PT[q.note]} (${CF[q.note]}) na ${num(q.s)} corda`, 'Toque na casa certa do braço.');
    let sel = null;
    const fb = fretboard({frets:q.maxF, only:q.s, labels:true, onTap:(s, f) => { if (L.state !== 'q') return; fb.clear(); fb.mark(s, f, '', ''); sel = f; L.ready(true); }});
    body.append(fb.el);
    L.grade = () => { const ok = sel != null && pc(OPEN[q.s] + sel) === q.note; fb.clear(); if (!ok) fb.mark(q.s, sel, '', 'bad'); fb.mark(q.s, q.f, CF[q.note], ok ? 'ok' : 'ghost'); return {ok, correct:`${q.f === 0 ? 'corda solta' : 'casa ' + q.f}`, explain:`Na ${num(q.s)} corda, ${PT[q.note]} fica ${q.f === 0 ? 'na corda solta' : 'na casa ' + q.f}.`}; };
  },
  build(q, body){
    const c = CHORDS[q.chord];
    header(q, body, `Monte o acorde ${chordLabel(q.chord)}`, 'Toque nas casas para colocar os dedos. Toque na parte das cordas soltas (à esquerda) para alternar entre solta (O) e abafada (X).');
    const st = [0,0,0,0,0,0];
    const fb = fretboard({frets:4, labels:false, sound:false, onTap:(s, f) => {
      if (L.state !== 'q') return;
      if (f === 0) st[s] = st[s] === -1 ? 0 : -1; else st[s] = st[s] === f ? 0 : f;
      if (st[s] >= 0) playNote(OPEN[s] + st[s], 0, .6, 1.4);
      draw(); L.ready(true);
    }});
    const draw = () => { fb.clear(); for (let s = 0; s < 6; s++) { if (st[s] > 0) fb.mark(s, st[s]); else fb.mark(s, 0, st[s] < 0 ? 'X' : 'O', st[s] < 0 ? 'mute' : 'open'); } };
    draw(); body.append(fb.el);
    body.append(h('div', {class:'play'}, h('button', {class:'btn small ghost keep', onclick:() => strum(st)}, 'Ouvir o que montei')));
    L.ready(true);
    L.grade = () => {
      const ok = st.every((f, s) => f === c.frets[s]);
      fb.clear();
      for (let s = 0; s < 6; s++) {
        const want = c.frets[s], got = st[s];
        if (want > 0) fb.mark(s, want, String(c.fing[s]), got === want ? 'ok' : 'ghost');
        if (got > 0 && got !== want) fb.mark(s, got, '', 'bad');
        if (want <= 0) fb.mark(s, 0, want < 0 ? 'X' : 'O', want < 0 ? 'mute' : 'open');
      }
      strumChord(q.chord, ctx().currentTime + .2);
      return {ok, correct: ok ? '' : `${c.frets.map(f => f < 0 ? 'x' : f).join(' ')} (da 6ª à 1ª corda)`, explain:c.tip};
    };
  },
  match(q, body, foot){
    header(q, body, q.prompt);
    foot.innerHTML = ''; foot.append(h('div', {class:'muted', style:'flex:1;text-align:center;font-weight:700;padding:12px 0'}, 'Toque num item de cada coluna'));
    const left = shuffle(q.pairs.map((p, i) => ({t:p[0], i}))), right = shuffle(q.pairs.map((p, i) => ({t:p[1], i})));
    const wrap = h('div', {class:'match'}), cl = h('div', {class:'col'}), cr = h('div', {class:'col'});
    let a = null, b = null, mistakes = 0, matched = 0;
    const tryPair = () => {
      if (!a || !b) return;
      const A = a, B = b; a = b = null;
      if (A.dataset.i === B.dataset.i) { A.classList.remove('sel'); B.classList.remove('sel'); A.classList.add('done'); B.classList.add('done'); matched++; if (S.settings.sound) blip(990, ctx().currentTime, .08, .12, 'sine');
        if (matched === q.pairs.length) setTimeout(() => answer({ok:mistakes === 0, correct:'', explain:mistakes ? `Você errou ${mistakes} ${mistakes === 1 ? 'par' : 'pares'}. Este exercício volta no fim.` : ''}), 250); }
      else { mistakes++; [A, B].forEach(x => { x.classList.remove('sel'); x.classList.add('shake'); setTimeout(() => x.classList.remove('shake'), 320); }); if (S.settings.sound) sfx('bad'); }
    };
    left.forEach(o => cl.append(h('button', {class:'mt', 'data-i':o.i, onclick:e => { a?.classList.remove('sel'); a = e.currentTarget; a.classList.add('sel'); tryPair(); }}, o.t)));
    right.forEach(o => cr.append(h('button', {class:'mt', 'data-i':o.i, onclick:e => { b?.classList.remove('sel'); b = e.currentTarget; b.classList.add('sel'); tryPair(); }}, o.t)));
    wrap.append(cl, cr); body.append(wrap);
  },
  rhythm(q, body, foot){
    header(q, body, 'Toque no ritmo', `${q.bpm} BPM · Depois da contagem (4 cliques), toque em cada seta, por 2 compassos.`);
    const slots = slotsEl(q.pattern); body.append(slots);
    const status = h('div', {class:'status', 'aria-live':'polite'}, 'Ouça o exemplo ou comece quando quiser.');
    const pad = h('button', {class:'taparea keep', disabled:true}, 'Toque');
    body.append(status, pad);
    foot.innerHTML = '';
    const ex = h('button', {class:'btn ghost'}, 'Ouvir exemplo'), go = h('button', {class:'btn'}, 'Começar');
    foot.append(ex, go);
    let running = false, raf = 0, taps = [], expected = [], tStart = 0, e = 0;
    const slotEls = [...slots.children];
    ex.onclick = () => { if (running) return; const c = ctx(); const t0 = c.currentTime + .1; const end = playPattern(q.pattern, q.bpm, t0); animate(t0, end, null); };
    const animate = (t0, end, onEnd) => {
      cancelAnimationFrame(raf); const ee = 60 / q.bpm / 2;
      const step = () => { const now = AC.currentTime; const i = Math.floor((now - t0) / ee); slotEls.forEach((s, j) => s.classList.toggle('now', i >= 0 && now < end && j === i % 8));
        if (now < end + .05) raf = requestAnimationFrame(step); else { slotEls.forEach(s => s.classList.remove('now')); onEnd && onEnd(); } };
      raf = requestAnimationFrame(step);
    };
    const tap = () => { if (!running) return; const t = AC.currentTime; taps.push(t); pad.classList.add('flash'); setTimeout(() => pad.classList.remove('flash'), 80); playNote(52, t, .35, .25); };
    pad.addEventListener('pointerdown', ev => { ev.preventDefault(); tap(); });
    pad.addEventListener('keydown', ev => { if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); tap(); } });
    L.space = () => tap();
    go.onclick = () => {
      if (running) return;
      running = true; ex.disabled = go.disabled = true; pad.disabled = false; pad.focus();
      slotEls.forEach(s => s.classList.remove('hit', 'miss'));
      const c = ctx(), beat = 60 / q.bpm; e = beat / 2; const t0 = c.currentTime + .25;
      for (let i = 0; i < 4; i++) blip(i === 0 ? 1600 : 1100, t0 + i * beat, .04, .3);
      tStart = t0 + 4 * beat; taps = []; expected = [];
      for (let bar = 0; bar < 2; bar++) for (let i = 0; i < 8; i++) { const t = tStart + (bar * 8 + i) * e; if (i % 2 === 0) blip(i === 0 ? 1500 : 1000, t, .03, .1); if (q.pattern[i] !== '-') expected.push({t, slot:i}); }
      let cd = 4; status.textContent = 'Prepare-se… 4';
      const cdTimer = setInterval(() => { cd--; status.textContent = cd > 0 ? `Prepare-se… ${cd}` : 'Agora!'; if (cd <= 0) clearInterval(cdTimer); }, beat * 1000);
      L.cleanup.push(() => clearInterval(cdTimer));
      const end = tStart + 16 * e;
      animate(tStart, end, () => evaluate());
    };
    const evaluate = () => {
      running = false; pad.disabled = true;
      const tol = Math.min(.17, e * .45); const used = new Set(); let hits = 0;
      const res = [];
      expected.forEach(x => { let bi = -1, bd = 9; taps.forEach((t, j) => { if (used.has(j)) return; const d = Math.abs(t - x.t); if (d < bd) { bd = d; bi = j; } }); const hit = bi >= 0 && bd <= tol; if (hit) { used.add(bi); hits++; } res.push({slot:x.slot, hit}); });
      const extra = taps.length - used.size;
      // marca o 2º compasso (o mais representativo)
      const second = res.slice(res.length / 2);
      second.forEach(r => slotEls[r.slot].classList.add(r.hit ? 'hit' : 'miss'));
      const ratio = hits / expected.length, ok = ratio >= .75 && extra <= 3;
      status.textContent = `${hits} de ${expected.length} no tempo${extra ? ` · ${extra} toque${extra > 1 ? 's' : ''} a mais` : ''}`;
      answer({ok, correct: ok ? '' : patArrows(q.pattern), explain: ok ? '' : (taps.length === 0 ? 'Nenhum toque registrado. Toque o botão verde depois da contagem.' : ratio < .75 ? 'Tente acompanhar os cliques do metrônomo: as setas ↓ caem junto com os números.' : 'Você tocou mais vezes do que as setas pedem. Nas pausas, a mão passa sem tocar.')});
    };
    L.cleanup.push(() => { cancelAnimationFrame(raf); running = false; });
  },
  mic(q, body, foot){
    const s = q.s, target = OPEN[s];
    header(q, body, `Toque a ${num(s)} corda solta`, `${SNAME[s]} · ${PT[pc(target)]} (${CF[pc(target)]})`);
    body.append(fretboard({frets:3, marks:[{s, f:0, label:CF[pc(target)], cls:'open'}], labels:false}).el);
    const live = h('div', {class:'mic-live'});
    const note = h('div', {class:'tnote'}, '…'); const meter = h('div', {class:'meter'}, h('i', {class:'ctr'}), h('i', {class:'needle'}));
    const st = h('div', {class:'status', 'aria-live':'polite'}, 'Ligando o microfone…');
    live.append(note, meter, st); body.append(live);
    body.append(h('div', {class:'play'}, h('button', {class:'btn small ghost keep', onclick:() => playNote(target, 0, .8)}, 'Ouvir referência')));
    foot.innerHTML = '';
    const skip = h('button', {class:'btn ghost'}, 'Agora não posso tocar');
    skip.onclick = () => answer({skip:true, explain:'Sem problemas. Você pode desligar os exercícios com microfone no Perfil.'});
    foot.append(skip);
    let raf = 0, last = 0, good = 0, alive = true;
    L.cleanup.push(() => { alive = false; cancelAnimationFrame(raf); });
    micStart().then(okMic => {
      if (!alive) return;
      if (!okMic) { st.textContent = 'Não consegui acessar o microfone. Verifique a permissão do navegador ou pule este exercício.'; note.textContent = '–'; skip.className = 'btn'; return; }
      st.textContent = 'Ouvindo… toque a corda e deixe soar.';
      const loop = t => {
        if (!alive) return; raf = requestAnimationFrame(loop);
        if (t - last < 55) return; last = t;
        const f = detect(); if (f < 0 || f > 1000) { good = Math.max(0, good - 1); return; }
        const m = midiOf(f), diff = m - target, oct = Math.round(diff / 12), d = diff - 12 * oct;
        const r = Math.round(m); note.textContent = PT[pc(r)];
        const cents = Math.round(d * 100);
        meter.querySelector('.needle').style.left = (50 + Math.max(-50, Math.min(50, Math.abs(oct) <= 1 ? cents : 50))) + '%';
        if (Math.abs(oct) <= 1 && Math.abs(cents) < 40) { good++; meter.classList.add('ok'); st.textContent = 'Isso! Segure mais um pouco…'; }
        else { good = 0; meter.classList.remove('ok'); if (Math.abs(oct) <= 1 && Math.abs(cents) < 150) st.textContent = cents > 0 ? 'Quase: está um pouco alto. Afine a corda para baixo.' : 'Quase: está um pouco baixo. Afine a corda para cima.'; else st.textContent = `Ouvi ${PT[pc(r)]}. Confira se é a ${num(s)} corda solta.`; }
        if (good >= 6) { alive = false; cancelAnimationFrame(raf); answer({ok:true, explain:`Você tocou ${SNAME[s]}.`}); }
      };
      raf = requestAnimationFrame(loop);
    });
  },
};
function slotsEl(p){ return h('div', {class:'slots', 'aria-label':'Batida: ' + patArrows(p)}, ...p.split('').map((ch, i) => h('div', {class:'slot'}, h('div', {class:'ar'}, ARROW[ch] || ''), h('div', {class:'ct'}, COUNT[i])))); }

/* ============ Teclado ============ */
document.addEventListener('keydown', e => {
  if (!L) return;
  if (e.key === 'Escape') { confirmExit(); return; }
  if (L.state === 'q' && L.q.type === 'rhythm' && e.key === ' ') { if (document.activeElement?.classList.contains('taparea')) return; e.preventDefault(); L.space && L.space(); return; }
  if (e.key === 'Enter' && document.activeElement?.tagName !== 'BUTTON') { e.preventDefault(); if (L.state === 'fb') L.contBtn?.click(); else if (L.state === 'q' && !L.checkBtn.disabled) L.checkBtn.click(); }
  if (L.state === 'q' && /^[1-4]$/.test(e.key) && L.keys) L.keys(+e.key - 1);
});

/* ============ Início ============ */
document.querySelectorAll('.nav button').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); window.scrollTo(0, 0); });
$('#st-hearts').onclick = () => { syncHearts(); toast(S.hearts >= MAXH ? `Vidas cheias (${MAXH})` : `${S.hearts} de ${MAXH} vidas · próxima em ${Math.ceil((REGEN - (Date.now() - S.heartsTs)) / 60000)} min`); };
$('#st-streak').onclick = () => toast(S.lastDay === today() ? `Ofensiva de ${S.streak} ${S.streak === 1 ? 'dia' : 'dias'}. Volte amanhã!` : 'Conclua uma lição hoje para manter a ofensiva');
$('#st-xp').onclick = () => toast(`${S.xp} XP no total · ${S.dayXp} hoje`);
load(); render();
setInterval(renderStats, 60000);
</script>
