<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Foto 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#e9e3d8; --bg2:#cfc6b6; --ink:#3b342c; --hint:#6d6457;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg1:#2a2723; --bg2:#141210; --ink:#ece6dc; --hint:#a39a8c; }
  }
  :root[data-theme="dark"]{ --bg1:#2a2723; --bg2:#141210; --ink:#ece6dc; --hint:#a39a8c; }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    background:radial-gradient(120% 90% at 50% 35%, var(--bg1), var(--bg2));
    color:var(--ink);font-family:Inter,system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  }
  .stage{
    position:relative;width:100%;flex:1;display:flex;align-items:center;justify-content:center;
    perspective:1400px;cursor:grab;
  }
  .stage.dragging{cursor:grabbing}

  /* tamanho da foto: proporção 3:4 + borda */
  .card{
    --w:min(74vw, 52vh * 0.8);
    width:var(--w);aspect-ratio:3/4.15;position:relative;
    transform-style:preserve-3d;will-change:transform;
  }
  .face,.edge{position:absolute;inset:0;border-radius:6px;backface-visibility:hidden;-webkit-backface-visibility:hidden}

  /* FRENTE */
  .front{
    transform:translateZ(1.6px);
    background:#fbfaf6;padding:4.5% 4.5% 13%;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);
  }
  .front .img{
    width:100%;height:100%;background:url(foto.jpg) center/cover no-repeat;
    border-radius:1px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12), inset 0 0 30px rgba(0,0,0,.12);
  }
  .front .caption{
    position:absolute;left:0;right:0;bottom:2.6%;text-align:center;
    font-family:Caveat,cursive;font-size:calc(var(--w) * .065);color:#4a4036;opacity:.85;
  }

  /* VERSO */
  .back{
    transform:rotateY(180deg) translateZ(1.6px);
    background-color:#f3efe6;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4  0 0 0 0 .35  0 0 0 0 .28  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
      repeating-linear-gradient(-32deg, transparent 0 34px, rgba(120,110,95,.07) 34px 35px);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.07), inset 0 0 40px rgba(140,120,90,.15);
    overflow:hidden;
  }
  .back .print{
    position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;
    padding:8% 8%;
  }
  .back .brand{
    font-size:calc(var(--w) * .028);letter-spacing:.35em;color:rgba(90,80,68,.45);text-transform:uppercase;
    display:flex;justify-content:space-between;
  }
  .back .note{
    font-family:Caveat,cursive;color:#2f4c7a;font-size:calc(var(--w) * .085);line-height:1.15;
    transform:rotate(-4deg);margin-top:20%;opacity:.88;
  }
  .back .note small{display:block;font-size:.62em;opacity:.8;margin-top:.4em}
  .back .stamp{
    align-self:flex-end;width:calc(var(--w)*.26);aspect-ratio:1;border:2px dashed rgba(90,80,68,.35);
    border-radius:4px;display:flex;align-items:center;justify-content:center;text-align:center;
    font-size:calc(var(--w)*.024);letter-spacing:.15em;color:rgba(90,80,68,.45);text-transform:uppercase;
  }

  /* ESPESSURA (camadas internas) */
  .edge{background:#e7e1d4}

  /* BRILHO que acompanha o giro */
  .glare{
    position:absolute;inset:0;border-radius:6px;pointer-events:none;mix-blend-mode:soft-light;
    background:linear-gradient(var(--ga,120deg), rgba(255,255,255,0) 30%, rgba(255,255,255,.75) 48%, rgba(255,255,255,0) 62%);
    background-size:220% 220%;background-position:var(--gp,50%) 50%;
  }
  .front .glare{mix-blend-mode:screen;opacity:.35}

  .shadow{
    position:absolute;left:50%;bottom:9%;width:calc(min(74vw, 52vh * .8) * 1.05);height:30px;
    transform:translateX(-50%);border-radius:50%;
    background:radial-gradient(closest-side, rgba(0,0,0,.35), transparent);filter:blur(6px);pointer-events:none;
  }

  .hint{
    padding:0 16px calc(22px + env(safe-area-inset-bottom));text-align:center;font-size:14px;color:var(--hint);
    transition:opacity .6s;
  }
  .hint b{font-weight:500;color:var(--ink)}
  .btns{display:flex;gap:10px;justify-content:center;margin-top:12px}
  .btns button{
    font:inherit;font-size:13px;color:var(--ink);background:rgba(127,127,127,.12);
    border:1px solid rgba(127,127,127,.25);border-radius:999px;padding:8px 16px;cursor:pointer;
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="shadow" id="shadow"></div>
    <div class="card" id="card">
      <div class="face back">
        <div class="print">
          <div class="brand"><span>Papel fotográfico</span><span>Nº 0711</span></div>
          <div class="note">Tarde de sol,<br>luz perfeita ☀<small>07 · 11 · 2026</small></div>
          <div class="stamp">Lab<br>foto<br>original</div>
        </div>
        <div class="glare"></div>
      </div>
      <div class="face front">
        <div class="img"></div>
        <div class="caption">luz da tarde</div>
        <div class="glare"></div>
      </div>
    </div>
  </div>

  <div class="hint" id="hint">
    <b>Arraste com o dedo</b> para girar a foto · toque duas vezes para virar
    <div class="btns"><button id="flip">Virar</button><button id="reset">Centralizar</button></div>
  </div>

<script>
(() => {
  const card = document.getElementById('card');
  const stage = document.getElementById('stage');
  const shadow = document.getElementById('shadow');
  const glares = card.querySelectorAll('.glare');

  // camadas de espessura
  const LAYERS = 7, THICK = 3.2;
  for (let i = 0; i < LAYERS; i++) {
    const e = document.createElement('div');
    e.className = 'edge';
    const z = -THICK/2 + (THICK * i / (LAYERS - 1));
    e.style.transform = `translateZ(${z}px)`;
    e.style.backfaceVisibility = 'visible';
    card.prepend(e);
  }

  let rx = 0, ry = 0;          // rotação atual
  let vx = 0, vy = 0;          // velocidade
  let target = null;           // alvo animado (virar/centralizar)
  let dragging = false, lastX = 0, lastY = 0, lastT = 0;
  let idle = true, t0 = performance.now();
  const SENS = 0.45;

  function render() {
    // tremido suave quando parado (dica de interatividade)
    let iy = 0, ix = 0;
    if (idle) {
      const t = (performance.now() - t0) / 1000;
      iy = Math.sin(t * 1.1) * 12; ix = Math.sin(t * 0.8) * 4;
    }
    const RY = ry + iy, RX = rx + ix;
    card.style.transform = `rotateX(${RX}deg) rotateY(${RY}deg)`;

    // brilho
    glares.forEach(g => {
      g.style.setProperty('--gp', `${50 + Math.sin(RY * Math.PI/180) * 70 + RX}%`);
      g.style.setProperty('--ga', `${110 + RX}deg`);
    });
    // sombra encolhe de lado
    const s = Math.abs(Math.cos(RY * Math.PI / 180));
    shadow.style.transform = `translateX(-50%) scaleX(${0.25 + 0.75 * s})`;
  }

  function loop() {
    if (!dragging) {
      if (target) {
        ry += (target.y - ry) * 0.12; rx += (target.x - rx) * 0.12;
        if (Math.abs(target.y - ry) < 0.05 && Math.abs(target.x - rx) < 0.05) { ry = target.y; rx = target.x; target = null; }
      } else {
        ry += vy; rx += vx;
        vy *= 0.95; vx *= 0.9;
        rx += (0 - rx) * 0.04;         // volta inclinação vertical
        if (Math.abs(vy) < 0.02) vy = 0;
      }
    }
    render();
    requestAnimationFrame(loop);
  }

  stage.addEventListener('pointerdown', e => {
    dragging = true; idle = false; target = null;
    stage.classList.add('dragging');
    stage.setPointerCapture(e.pointerId);
    lastX = e.clientX; lastY = e.clientY; lastT = performance.now();
    vx = vy = 0;
  });
  stage.addEventListener('pointermove', e => {
    if (!dragging) return;
    const now = performance.now(), dt = Math.max(1, now - lastT);
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    ry += dx * SENS;
    rx = Math.max(-45, Math.min(45, rx - dy * SENS));
    vy = (dx * SENS) / dt * 16; vx = -(dy * SENS) / dt * 16;
    lastX = e.clientX; lastY = e.clientY; lastT = now;
  });
  const end = () => { dragging = false; stage.classList.remove('dragging'); };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);

  function flip() {
    idle = false; vx = vy = 0;
    const base = Math.round(ry / 180) * 180;
    target = { x: 0, y: base + 180 };
  }
  let lastTap = 0;
  stage.addEventListener('pointerup', () => {
    const now = performance.now();
    if (now - lastTap < 300) flip();
    lastTap = now;
  });
  document.getElementById('flip').onclick = flip;
  document.getElementById('reset').onclick = () => {
    idle = false; vx = vy = 0;
    target = { x: 0, y: Math.round(ry / 360) * 360 };
  };

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
