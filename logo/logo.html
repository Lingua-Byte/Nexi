<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;font-family:'Montserrat',Arial,sans-serif;
background:radial-gradient(ellipse at 50% 35%,#1d2a44 0%,#0c1222 60%,#060912 100%);color:#fff;
display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.frame{position:absolute;inset:48px;border:2px solid rgba(245,200,0,.35);border-radius:28px}
.frame:after{content:"";position:absolute;inset:14px;border:1px solid rgba(245,200,0,.15);border-radius:20px}
svg{width:560px;height:560px;filter:drop-shadow(0 20px 40px rgba(245,200,0,.18))}
.name{font-weight:900;font-size:150px;letter-spacing:12px;margin-top:30px;
background:linear-gradient(180deg,#ffe566,#f5c800 55%,#d9a900);-webkit-background-clip:text;color:transparent}
.sub{font-weight:600;font-size:46px;letter-spacing:10px;text-transform:uppercase;margin-top:10px;color:#f1f1f1}
.line{display:flex;align-items:center;gap:24px;margin:44px 0 30px}
.line i{display:block;width:150px;height:3px;background:#f5c800}
.line b{width:16px;height:16px;background:#f5c800;transform:rotate(45deg)}
.creci{font-weight:600;font-size:38px;letter-spacing:6px;color:#c9d1e0}
.phone{margin-top:120px;display:flex;align-items:center;gap:22px;background:#f5c800;color:#0c1222;
padding:26px 52px;border-radius:80px;font-weight:800;font-size:58px}
.phone small{font-size:36px;font-weight:700}
.tag{margin-top:46px;font-weight:600;font-size:34px;letter-spacing:8px;color:#f5c800}
</style></head><body>
<div class="frame"></div>
<svg viewBox="0 0 200 200">
 <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe566"/><stop offset="1" stop-color="#d9a900"/></linearGradient></defs>
 <!-- roof -->
 <path d="M18 92 L100 22 L182 92" fill="none" stroke="url(#g)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
 <rect x="140" y="36" width="16" height="34" rx="2" fill="url(#g)"/>
 <!-- house walls -->
 <path d="M40 92 V176 H160 V92" fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
 <!-- W -->
 <path d="M58 104 L78 160 L100 116 L122 160 L142 104" fill="none" stroke="url(#g)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
 <!-- window -->
 <rect x="91" y="60" width="18" height="18" fill="none" stroke="#fff" stroke-width="3"/>
 <line x1="100" y1="60" x2="100" y2="78" stroke="#fff" stroke-width="2"/><line x1="91" y1="69" x2="109" y2="69" stroke="#fff" stroke-width="2"/>
</svg>
<div class="name">WALLITER</div>
<div class="sub">Corretor de Imóveis</div>
<div class="line"><i></i><b></b><i></i></div>
<div class="creci">CRECI 69343</div>

</div>

</body></html>
