<script>
const $ = s => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const pop = x => { x = clamp(x); return x < 1 ? 1 + 0.6 * Math.sin(x * Math.PI) * (1 - x) : 1; };
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const ap = (t, t0, d = 0.4) => ease((t - t0) / d); // aparecer
let D;
function iniciar(dados) {
  D = dados;
  document.documentElement.style.setProperty('--c', D.cor);
  const g = []; let cur = [];
  D.palavras.forEach((p, i) => {
    cur.push(i);
    const prox = D.palavras[i + 1];
    const pausa = !prox || prox.s - p.e > 0.16 || /[.,:;?!]["”]?$/.test(p.w);
    if (cur.length === 3 || pausa) { g.push(cur); cur = []; }
  });
  D.grupos = g;
}
function legenda(t) {
  const P = D.palavras; let html = '';
  if (!D.semLegenda?.some(([a, b]) => t >= a && t < b))
  for (let k = 0; k < D.grupos.length; k++) {
    const gr = D.grupos[k]; const ini = P[gr[0]].s; const prox = D.grupos[k + 1] ? P[D.grupos[k + 1][0]].s : D.dur;
    if (t >= ini - 0.05 && t < Math.min(prox, P[gr[gr.length - 1]].e + 0.5)) {
      html = gr.map((i, j) => {
        const fimW = gr[j + 1] !== undefined ? P[gr[j + 1]].s : P[i].e + 0.5;
        const w = esc(P[i].w.replace(/["“”.,:;!?]/g, ''));
        return t >= P[i].s - 0.03 && t < fimW ? `<span class="ativa">${w}</span>` : w;
      }).join(' ');
      break;
    }
  }
  $('#leg').innerHTML = html;
}
// ---------- mapa do Oriente Médio ----------
const MAR = [
  [[25,30],[36,31.5],[36.2,36.8],[30,37],[26,40.5],[25,41]], [[27.5,41],[41.5,41],[41.5,46.8],[27.5,46.8]],
  [[47,37],[49,37.3],[54,37],[53.5,41],[54,45],[52,47],[49,46.8],[47,44],[49,41.5]], [[58.2,44],[61.2,44],[61.2,46.3],[58.2,46.3]],
  [[48,30.2],[50.3,29.3],[52,27.6],[56.3,26.6],[56.6,24.8],[54,24],[51.5,24.6],[50,26.4],[48.5,28.6]],
  [[32.3,30],[34.5,28],[37.5,24],[40,20],[42.6,15],[43.5,12.6],[42.3,13.6],[39.2,17.5],[36,22],[34,25.8],[32.6,29.4]],
  [[43.4,12],[51,11.5],[52.5,15.5],[57.5,18.5],[59.8,22.3],[56.6,24.6],[57.2,25.5],[61.5,25.2],[66.6,25.4],[72,21],[75,15],[75,5],[43,5]],
];
function dentro(pt, poly) { let c = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const [xi, yi] = poly[i], [xj, yj] = poly[j]; if (((yi > pt[1]) !== (yj > pt[1])) && (pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi)) c = !c; } return c; }
const corC = () => getComputedStyle(document.documentElement).getPropertyValue('--c').trim();
function brilho(ctx, x, y, k, t, rot, alinhar) {
  const cor = corC(), pulso = 1 + 0.25 * Math.sin(t * 4);
  const g = ctx.createRadialGradient(x, y, 0, x, y, 90 * pulso * k); g.addColorStop(0, cor + 'cc'); g.addColorStop(1, cor + '00');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 90 * pulso * k, 0, 6.3); ctx.fill();
  ctx.fillStyle = cor; ctx.beginPath(); ctx.arc(x, y, 14 * k, 0, 6.3); ctx.fill();
  if (rot) { ctx.font = '500 34px "IBM Plex Mono"'; ctx.fillStyle = 'rgba(242,234,216,.92)'; ctx.textAlign = alinhar || 'left'; ctx.fillText(rot, x + (alinhar === 'right' ? -30 : 30), y - 26); }
}
function mapa(ctx, W, H, t, c) {
  const lon = x => 25 + x / W * 50, lat = y => 50 - y / H * 42, X = l => (l - 25) / 50 * W, Y = la => (50 - la) / 42 * H;
  ctx.clearRect(0, 0, W, H);
  for (let x = 12; x < W; x += 24) for (let y = 12; y < H; y += 24) {
    if (MAR.some(m => dentro([lon(x), lat(y)], m))) continue;
    ctx.beginPath(); ctx.arc(x, y, 3.6, 0, 6.3); ctx.fillStyle = 'rgba(242,234,216,.34)'; ctx.fill();
  }
  if (c.rota) { const [p, q] = c.rota.map(r => [X(r.lon), Y(r.lat)]), k = ease((t - c.rota[0].t0) / 1.2);
    ctx.setLineDash([16, 14]); ctx.lineWidth = 5; ctx.strokeStyle = corC(); ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(p[0] + (q[0] - p[0]) * k, p[1] + (q[1] - p[1]) * k); ctx.stroke(); ctx.setLineDash([]); }
  c.pontos.forEach(pt => { const k = ease((t - pt.t0) / 0.6); if (k > 0) brilho(ctx, X(pt.lon), Y(pt.lat), k, t, pt.rotulo, pt.alinhar); });
}
// ---------- globo (graticulado) ----------
function globo(ctx, W, H, t, c) {
  ctx.clearRect(0, 0, W, H);
  const R = 330, cx = W / 2, cy = H / 2, lam0 = (c.lon + (1 - ease((t - c.ini) / 1.6)) * 40) * Math.PI / 180, phi0 = Math.max(-50, Math.min(50, c.lat)) * Math.PI / 180;
  const proj = (la, lo) => { const p = la * Math.PI / 180, l = lo * Math.PI / 180 - lam0;
    const cosc = Math.sin(phi0) * Math.sin(p) + Math.cos(phi0) * Math.cos(p) * Math.cos(l);
    return [cx + R * Math.cos(p) * Math.sin(l), cy - R * (Math.cos(phi0) * Math.sin(p) - Math.sin(phi0) * Math.cos(p) * Math.cos(l)), cosc]; };
  ctx.strokeStyle = 'rgba(242,234,216,.35)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.3); ctx.stroke();
  ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(242,234,216,.16)';
  const linha = pts => { ctx.beginPath(); let on = false; pts.forEach(([x, y, v]) => { if (v > 0) { on ? ctx.lineTo(x, y) : ctx.moveTo(x, y); on = true; } else on = false; }); ctx.stroke(); };
  for (let lo = -180; lo < 180; lo += 20) linha(Array.from({ length: 91 }, (_, i) => proj(-90 + i * 2, lo)));
  for (let la = -60; la <= 60; la += 20) linha(Array.from({ length: 181 }, (_, i) => proj(la, -180 + i * 2)));
  const [x, y, v] = proj(c.lat, c.lon); const k = ease((t - c.ini - 1.2) / 0.6);
  if (v > 0 && k > 0) brilho(ctx, x, y, k, t, c.rotulo, c.lon > 100 ? 'right' : 'left');
}
// ---------- cenas ----------
function vis(t, c) { const e = ease((t - c.ini) / 0.4), s = 1 - ease((t - (c.fim - 0.3)) / 0.3); return { a: Math.min(e, s), dy: (1 - e) * 50 }; }
const R = {
  palavra(c, t, v) {
    const n = Math.round(clamp((t - c.ini - 0.2) / 0.9) * c.palavra.length);
    return `${c.gancho ? `<div class="gancho" style="opacity:${ap(t, c.ini, 0.25)}">${c.gancho}</div>` : ''}
      <div class="palavra" style="top:${c.topo || 760}px;font-size:${c.tam || 190}px">${esc(c.palavra.slice(0, n))}<span style="opacity:0">${esc(c.palavra.slice(n))}</span>
      <small style="opacity:${ap(t, c.ini + 1.1, 0.5)}">${esc(c.ipa || '')}</small></div>`;
  },
  texto(c, t, v) {
    return `<div class="bloco" style="top:${c.topo || 420}px;transform:translateY(${v.dy}px)">${c.meta ? `<div class="meta">${esc(c.meta)}</div>` : ''}
      <div class="serif" style="font-size:${c.tam || 112}px;margin-top:24px">${c.texto}</div>
      ${c.sub ? `<div class="txt" style="margin-top:34px;color:var(--creme2);opacity:${c.tSub ? ap(t, c.tSub) : 1}">${c.sub}</div>` : ''}</div>`;
  },
  cena(c, t, v) {
    const k = ap(t, c.ini, 0.8);
    return `<div class="bloco" style="top:430px"><div class="meta" style="font-size:40px;color:var(--c);letter-spacing:.2em;opacity:${k}">${esc(c.lugar)}</div>
      <div class="serif" style="font-size:150px;margin-top:20px;opacity:${k};letter-spacing:${(1 - k) * 0.08}em">${esc(c.ano)}</div>
      <div class="txt" style="margin-top:44px;color:var(--creme2);opacity:${ap(t, c.ini + 0.7, 0.6)}">${c.texto || ''}</div></div>`;
  },
  lugar(c, t, v) {
    return `<canvas id="cv" data-tipo="globo" width="1080" height="820" style="left:0;top:560px"></canvas>
      <div class="bloco" style="top:250px;transform:translateY(${v.dy}px)"><div class="meta">${esc(c.meta)}</div>
      <div class="titulo-serif" style="margin-top:18px;font-size:${c.tam || 110}px">${esc(c.titulo)}</div>
      <div class="meta" style="margin-top:16px;color:var(--creme2)">${esc(c.sub || '')}</div></div>`;
  },
  mapa(c, t, v) {
    return `<canvas id="cv" data-tipo="mapa" width="1080" height="900" style="left:0;top:520px"></canvas>
      <div class="bloco" style="top:250px;transform:translateY(${v.dy}px)"><div class="meta">${esc(c.meta)}</div>
      <div class="titulo-serif" style="margin-top:18px;font-size:${c.tam || 112}px">${esc(c.titulo)}</div>
      <div class="meta" style="margin-top:16px;color:var(--creme2)">${esc(c.sub || '')}</div></div>`;
  },
  digitos(c, t, v) {
    const ds = c.itens.map((d, i) => `<span style="opacity:${ap(t, c.ini + 0.5 + i * 0.12, 0.3)}">${esc(d)}</span>`).join('');
    return `<div class="bloco" style="top:300px;transform:translateY(${v.dy}px)"><div class="meta">${esc(c.meta)}</div>
      <div class="titulo-serif" style="margin:20px 0 70px;font-size:96px">${esc(c.titulo)}</div>
      <div class="cartao"><div class="digitos">${ds}</div><div class="meta" style="margin-top:34px;color:var(--c)">${esc(c.rodape)}</div></div></div>`;
  },
  citacao(c, t, v) {
    return `<div class="bloco" style="top:360px;transform:translateY(${v.dy}px)"><div class="meta">${esc(c.meta)}</div>
      <div class="cartao" style="margin-top:40px"><div class="serif" style="font-style:italic;font-size:${c.tam || 110}px">“${esc(c.texto)}”</div>
      ${c.traducao ? `<div class="meta" style="margin-top:36px;color:var(--c);opacity:${c.tTraducao ? ap(t, c.tTraducao) : 1}">${esc(c.traducao)}</div>` : ''}</div></div>`;
  },
  etimo(c, t, v) {
    const nos = c.nos.map((n, i) => {
      const a = ap(t, n.t0, 0.45);
      const ws = Array.isArray(n.w) ? n.w.map(esc).join('<span style="color:var(--creme3)"> · </span>') : esc(n.w);
      return `${i ? `<div class="seta" style="opacity:${a}">↓</div>` : ''}<div class="no" style="opacity:${a};transform:translateX(${(1 - a) * -40}px)"><div class="w" style="font-size:${c.tam || 100}px">${ws}</div><div class="meta m">${esc(n.m)}</div></div>`;
    }).join('');
    return `<div class="bloco" style="top:${c.topo || 300}px">${c.meta ? `<div class="meta" style="margin-bottom:30px">${esc(c.meta)}</div>` : ''}${nos}</div>`;
  },
  transforma(c, t, v) {
    const k = ap(t, c.tVira, 0.5);
    return `<div class="bloco" style="top:430px;transform:translateY(${v.dy}px)"><div class="meta">${esc(c.meta)}</div>
      <div class="no" style="margin-top:40px"><div class="w">${esc(c.de)}</div><div class="meta m">${esc(c.metaDe)}</div></div>
      <div class="seta" style="opacity:${k}">↓</div>
      <div class="no" style="opacity:${k}"><div class="w" style="font-size:140px">${esc(c.para)}</div><div class="meta m">${esc(c.metaPara)}</div></div></div>`;
  },
  quiz(c, t, v) {
    const rev = t >= c.tRevela; const espera = clamp((t - c.tPergunta) / (c.tRevela - c.tPergunta));
    const ops = c.opcoes.map((o, i) => `<div class="opc ${rev ? (i === c.certa ? 'certa' : 'errada') : ''}" style="opacity:${rev ? '' : ap(t, c.ini + 0.4 + i * 0.25, 0.3)}"><b>${'ABCD'[i]}</b>${o}</div>`).join('');
    const ring = !rev && t >= c.tPergunta ? `<svg width="120" height="120" style="position:absolute;right:0;top:-10px"><circle cx="60" cy="60" r="50" fill="none" stroke="rgba(242,234,216,.15)" stroke-width="10"/><circle cx="60" cy="60" r="50" fill="none" stroke="${corC()}" stroke-width="10" stroke-dasharray="${314 * (1 - espera)} 314" transform="rotate(-90 60 60)"/></svg>` : '';
    return `<div class="bloco" style="top:280px;transform:translateY(${v.dy}px)"><div class="meta" style="color:var(--c)">QUIZ</div>${ring}
      <div class="txt" style="font-size:66px;margin:22px 0 20px;padding-right:130px">${c.pergunta}</div>${ops}</div>`;
  },
  tribunal(c, t, v) {
    const its = c.itens.map(it => `<div class="item" style="opacity:${ap(t, it.t0)}"><div class="rot">${esc(it.rot)}</div><div class="txt" style="margin-top:8px">${it.txt}</div></div>`).join('');
    const vk = c.veredito ? (t - c.veredito.t0) : -1;
    const car = vk >= 0 ? `<div style="margin-top:50px;transform:rotate(-8deg) scale(${pop(vk / 0.35) * (vk < 0.12 ? 1.6 - vk * 5 : 1)});transform-origin:left;opacity:${clamp(vk / 0.1)}"><div class="carimbo" style="--cc:${c.veredito.cor || 'var(--mito)'};font-size:${c.veredito.tam || 140}px">${esc(c.veredito.txt)}</div></div>` : '';
    return `<div class="bloco" style="top:260px"><div class="meta">${esc(c.titulo || 'TRIBUNAL DA LÍNGUA')}</div>${its}${car}</div>`;
  },
  pistas(c, t, v) {
    const its = c.itens.map((it, i) => `<div class="pista" style="opacity:${ap(t, it.t0)};transform:translateX(${(1 - ap(t, it.t0)) * 60}px) rotate(${[-0.8, 0.6, -0.4, 0.9][i % 4]}deg)"><b>#${i + 1}</b><span>${it.txt}</span></div>`).join('');
    const ck = c.conclusao ? ap(t, c.conclusao.t0, 0.3) : 0;
    return `<div class="bloco" style="top:250px"><div class="meta">CASO · ${esc(c.titulo)}</div>${its}
      ${c.conclusao ? `<div style="margin-top:40px;opacity:${ck};transform:rotate(-6deg) scale(${pop(ck)})"><div class="carimbo" style="font-size:84px;--cc:${c.conclusao.cor || 'var(--mito)'}">${esc(c.conclusao.txt)}</div></div>` : ''}</div>`;
  },
  contagem(c, t, v) {
    let at = -1; c.itens.forEach((it, i) => { if (t >= it.t0) at = i; });
    const it = c.itens[Math.max(0, at)]; const k = ap(t, it.t0, 0.35);
    const feitos = c.itens.slice(0, Math.max(0, at)).map(x => `<span style="margin-right:26px">${esc(x.n)} · ${esc(x.curto || x.a)}</span>`).join('');
    return `<div class="bloco" style="top:250px"><div class="meta">${esc(c.meta)}</div>
      <div style="opacity:${at < 0 ? 0 : 1}"><div class="serif" style="font-size:300px;color:var(--c);line-height:1;margin-top:20px;transform:scale(${pop(k)});transform-origin:left">${esc(it.n)}</div>
      <div class="serif" style="font-size:110px;margin-top:10px;opacity:${k}">${it.a}</div>
      <div class="txt" style="margin-top:22px;color:var(--creme2);opacity:${k}">${it.b || ''}</div></div>
      <div class="meta" style="margin-top:46px;font-size:26px;line-height:1.6">${feitos}</div></div>`;
  },
  pares(c, t, v) {
    const its = c.itens.map(it => `<div class="par" style="opacity:${ap(t, it.t0)};${c.tam ? `font-size:${c.tam}px` : ''}"><span>${it.a}</span><i>${esc(c.sep || '→')}</i><span class="b">${it.b}</span></div>`).join('');
    return `<div class="bloco" style="top:${c.topo || 300}px">${c.meta ? `<div class="meta">${esc(c.meta)}</div>` : ''}${its}
      ${c.rodape ? `<div class="txt" style="margin-top:44px;color:var(--creme2);opacity:${c.tRodape ? ap(t, c.tRodape) : 1}">${c.rodape}</div>` : ''}</div>`;
  },
  compara(c, t, v) {
    const k = c.tDir ? ap(t, c.tDir) : ap(t, c.ini + 0.5);
    return `<div class="bloco" style="top:250px"><div class="meta">${esc(c.meta || '')}</div></div><div class="colunas">
      <div class="col"><div class="rot" style="color:var(--creme3)">${esc(c.esq.rot)}</div><div class="serif" style="font-size:${c.tam || 96}px;margin-top:20px">${c.esq.txt}</div><div class="txt" style="font-size:40px;margin-top:20px;color:var(--creme2)">${c.esq.sub || ''}</div></div>
      <div class="col d" style="opacity:${k}"><div class="rot">${esc(c.dir.rot)}</div><div class="serif" style="font-size:${c.tam || 96}px;margin-top:20px">${c.dir.txt}</div><div class="txt" style="font-size:40px;margin-top:20px;color:var(--creme2)">${c.dir.sub || ''}</div></div></div>`;
  },
  desmonte(c, t, v) {
    const cores = ['var(--c)', '#5B9BE0', '#4CAF7A', '#E05A4F', '#A57FDB', '#F2C94C'];
    const ps = c.pecas.map((p, i) => { const k = ap(t, p.t0, 0.35);
      return `<div style="display:inline-block;vertical-align:top;margin:0 8px 30px 0;opacity:${0.25 + 0.75 * k};transform:translateY(${(1 - k) * 30}px)"><div class="peca" style="background:${k > 0.01 ? cores[i % cores.length] + '' : 'transparent'};color:${k > 0.5 ? '#0E0E10' : 'var(--creme)'};font-size:${c.tam || 118}px">${esc(p.p)}</div><div class="glosa" style="opacity:${k}">${esc(p.g || '')}</div></div>`; }).join('');
    return `<div class="bloco" style="top:${c.topo || 330}px;right:120px"><div class="meta" style="margin-bottom:34px">${esc(c.meta || 'DESMONTANDO')}</div>${ps}
      ${c.resultado ? `<div class="txt" style="margin-top:20px;color:var(--creme2);opacity:${c.tResultado ? ap(t, c.tResultado) : 1}">${c.resultado}</div>` : ''}</div>`;
  },
  linha(c, t, v) {
    const its = c.itens.map(it => `<div class="linha-it" style="opacity:${ap(t, it.t0)}"><div class="ano">${esc(it.ano)}</div><div class="txt" style="font-size:46px;margin-top:6px">${it.txt}</div></div>`).join('');
    return `<div class="bloco" style="top:270px"><div class="meta" style="margin-bottom:34px">${esc(c.meta || 'LINHA DO TEMPO')}</div>${its}</div>`;
  },
  glossario(c, t, v) {
    const k = ap(t, c.ini + 0.2, 0.5);
    return `<div class="bloco" style="top:330px;transform:translateY(${v.dy}px)">
      <div class="meta" style="color:var(--c)">GLOSSÁRIO GLOSSA</div>
      <div class="cartao" style="margin-top:34px;border-color:var(--c)">
        <div class="meta">${c.novo ? 'TERMO' : 'REVISÃO · TERMO'} Nº ${c.numero}</div>
        <div class="serif" style="font-size:${c.termo.length > 14 ? 96 : 140}px;margin:18px 0 26px;transform:scale(${0.92 + 0.08 * k});transform-origin:left">${esc(c.termo)}</div>
        <div style="font-weight:800;font-size:52px;line-height:1.2">${c.definicao}</div>
        ${c.exemplos ? `<div class="meta" style="margin-top:30px;opacity:${c.tExemplos ? ap(t, c.tExemplos) : 1}">${esc(c.exemplos)}</div>` : ''}
      </div></div>`;
  },
  fim(c, t, v) {
    const k = ap(t, c.tCta || c.ini + 0.8, 0.4);
    const prox = c.prox ? `<div class="meta">A SEGUIR · ${esc(c.prox.quando)}</div>
      <div class="selo" style="position:static;margin:30px 0 26px;--c:${c.prox.cor}"><i style="background:${c.prox.cor}"></i>${esc(c.prox.quadro)}</div>
      <div class="serif" style="font-size:96px">${esc(c.prox.titulo)}</div>` : '';
    return `<div class="bloco" style="top:360px;transform:translateY(${v.dy}px)">${prox}
      <div style="margin-top:80px;opacity:${k};transform:scale(${pop(k)});transform-origin:left"><div class="cta"><i>${c.icone || '↗'}</i>${esc(c.cta)}</div></div>
      <div class="meta" style="margin-top:40px;opacity:${k}">@glossa · a língua por dentro</div></div>`;
  },
};
function quadro(t, glos) {
  let html = `<div class="selo"><i></i>${esc(D.selo)}</div><div class="marca">G<b>.</b></div>`;
  if (glos) html += `<div class="glos">${esc(glos)}</div>`;
  const ativas = D.cenas.filter(c => t >= c.ini && t < c.fim);
  ativas.forEach(c => { const v = vis(t, c); html += `<div class="cena" style="opacity:${v.a}">${R[c.tipo](c, t, v)}</div>`; });
  $('#camada').innerHTML = html;
  ativas.forEach(c => { const cv = $('#cv'); if (!cv) return; if (c.tipo === 'mapa') mapa(cv.getContext('2d'), 1080, 900, t, c); if (c.tipo === 'lugar') globo(cv.getContext('2d'), 1080, 820, t, c); });
  legenda(t);
}
</script></body></html>
