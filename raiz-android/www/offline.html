<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RAIZ</title>
<style>
  :root { --paper:#F2EBDD; --ink:#17140F; --muted:#6E665A; --accent:#FF5A36; }
  @media (prefers-color-scheme: dark) { :root { --paper:#16130F; --ink:#F1E9D8; --muted:#A79D8C; } }
  html, body { margin:0; height:100%; background:var(--paper); color:var(--ink); font:17px/1.45 Georgia, 'Times New Roman', serif; }
  main { min-height:100%; display:grid; place-items:center; padding:24px 16px; box-sizing:border-box; text-align:center; }
  .logo { font-weight:900; font-size:96px; line-height:.85; letter-spacing:-.05em; position:relative; display:inline-block; }
  .logo span { position:absolute; left:4px; top:4px; color:transparent; -webkit-text-stroke:2px var(--accent); z-index:-1; }
  h1 { font-size:24px; margin:18px 0 6px; }
  p { color:var(--muted); max-width:30ch; margin:0 auto 22px; }
  button { font:800 18px Georgia, serif; border:2px solid var(--ink); background:var(--ink); color:var(--paper); padding:14px 22px; border-radius:4px; box-shadow:4px 4px 0 var(--accent); }
</style>
</head>
<body>
<main>
  <div>
    <div class="logo">RAIZ<span aria-hidden="true">RAIZ</span></div>
    <h1>Sem internet agora</h1>
    <p>Na primeira vez o RAIZ precisa de internet para baixar o caderno. Depois disso ele funciona offline.</p>
    <button onclick="location.href='https://lingua-byte.github.io/Nexi/linguas/'">Tentar de novo</button>
  </div>
</main>
</body>
</html>
