<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10131a">
  <title>Meus programas</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font:16px system-ui,sans-serif;background:#10131a;color:#f2f4f8;display:flex;justify-content:center}
    main{width:min(100%,640px);padding:32px 16px}
    h1{margin:0 0 4px;font-size:1.7rem;letter-spacing:.04em}
    p.sub{margin:0 0 24px;opacity:.65}
    .grid{display:grid;gap:12px}
    a.card{display:flex;gap:14px;align-items:center;padding:16px;border-radius:16px;background:#1b2030;border:1px solid #2a3145;color:inherit;text-decoration:none;transition:transform .12s,border-color .12s}
    a.card:hover,a.card:focus-visible{border-color:#c6e36b;transform:translateY(-2px)}
    .icon{font-size:2rem;width:52px;height:52px;display:grid;place-items:center;border-radius:12px;background:#262d42;flex:none}
    .card b{display:block}
    .card span{font-size:.85rem;opacity:.65}
  </style>
</head>
<body>
  <main>
    <h1>Meus programas</h1>
    <p class="sub">Tudo o que eu crio, em um só lugar.</p>
    <div class="grid">
      <!-- Para adicionar um projeto, copie um bloco <a class="card"> abaixo. -->
      <a class="card" href="apps/nexi/">
        <div class="icon">🐰</div>
        <div><b>NEXI</b><span>Bichinho virtual com minijogos</span></div>
      </a>
    </div>
  </main>
</body>
</html>
