<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#87964b"><title>NEXI</title><style>:root{--world:#87964b;--world2:#b8c77a;--ink:#24301b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#87964b;color:var(--ink);font:16px system-ui,sans-serif}body{display:flex;justify-content:center}.game{width:min(100%,520px);min-height:100vh;position:relative;overflow:hidden;background:linear-gradient(180deg,#b8c77a 0%,#93a752 42%,#71863d 100%);padding:12px 12px 100px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;letter-spacing:.14em;font-size:1.55rem}.gen{background:#f8f5dccc;border:2px solid #ffffff88;border-radius:99px;padding:6px 10px;font-size:.75rem;font-weight:900}.need{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}.need span{background:#f8f5dc99;border:1px solid #ffffff88;border-radius:11px;padding:6px;text-align:center;font-size:.7rem}.need b{display:block;font-size:.8rem}.habitat{height:400px;position:relative;border-radius:30px;background:linear-gradient(#ffffff18,#ffffff08);border:2px solid #ffffff66;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 -80px 0 #526b2c55}.habitat:before{content:"";position:absolute;bottom:-45px;left:-10%;width:120%;height:120px;background:#4f682b99;border-radius:50% 50% 0 0}.sun{position:absolute;top:25px;left:28px;width:48px;height:48px;border-radius:50%;background:#f8df7caa}.cloud{position:absolute;top:55px;right:35px;font-size:46px;opacity:.42}.plant{position:absolute;font-size:58px;z-index:2}.p1{left:7%;bottom:35px}.p2{right:7%;bottom:42px}.pet{position:relative;width:220px;height:220px;display:grid;place-items:center;z-index:3;animation:breathe 3s ease-in-out infinite}.pet img{width:190px;height:190px;object-fit:contain;filter:drop-shadow(0 14px 7px #26351455)}.pet.happy{animation:bounce .6s ease}.pet.sad{filter:grayscale(.55);opacity:.78}.bubble{position:absolute;z-index:5;top:12px;right:9px;max-width:215px;background:#fffdf0;border:2px solid #ffffffaa;border-radius:17px 17px 4px 17px;padding:9px 11px;box-shadow:0 5px 15px #26351425;font-size:.8rem}.event{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:6;background:#26351ddd;color:#fff;border-radius:99px;padding:6px 12px;font-size:.7rem;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;justify-content:space-between;margin:8px 3px;color:#fffde0;font-size:.72rem;font-weight:700}.memory{background:#ffffff3b;border-radius:14px;padding:9px 11px;font-size:.74rem;color:#fffde8}.memory strong{color:white}.actions{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 9px calc(8px + env(safe-area-inset-bottom));background:#f6f1dff2;backdrop-filter:blur(12px);border-top:2px solid #ffffffaa;box-shadow:0 -8px 25px #26351455;z-index:20}.actions button{border:1px solid #c9c5a9;background:#fffdf1;color:#26311f;border-radius:15px;min-height:64px;font-weight:850;font-size:.68rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.actions button span{font-size:1.45rem}.actions button:active{transform:translateY(2px) scale(.98)}.music{position:absolute;top:54px;left:12px;z-index:30;border:0;border-radius:50%;width:38px;height:38px;background:#fffdf0dd;font-size:1rem}.credits{text-align:center;margin-top:9px;color:#fffde0aa;font-size:.6rem}.modal{position:fixed;inset:0;background:#18210dcc;display:grid;place-items:center;padding:20px;z-index:50}.card{width:min(100%,420px);background:#fffdf1;border-radius:24px;padding:24px;box-shadow:0 20px 50px #0005}.card h2{margin:0 0 8px}.card button{width:100%;border:0;background:#314326;color:white;border-radius:14px;padding:14px;font-weight:800}@keyframes breathe{50%{transform:translateY(-4px)}}@keyframes bounce{25%{transform:translateY(-15px) rotate(-2deg)}50%{transform:translateY(0) rotate(2deg)}75%{transform:translateY(-8px)}}</style></head><body><main class="game"><div class="top"><div class="brand">NEXI</div><div class="gen" id="gen"></div></div><button class="music" id="music">♫</button><audio id="bgm" loop preload="auto"><source src="https://opengameart.org/sites/default/files/kawaii_8bit.mp3" type="audio/mpeg"></audio><div class="need" id="need"></div><section class="habitat"><div class="sun"></div><div class="cloud">☁️</div><div class="bubble" id="bubble">Estou começando a conhecer você.</div><div class="plant p1">🌿</div><div class="plant p2">🌱</div><div class="pet" id="pet"><img id="petImg" alt="NEXI"></div><div class="event" id="event">NEXI nasceu.</div></section><div class="meta"><span id="age"></span><span id="mood"></span></div><div class="memory" id="memory"></div><div class="credits">Arte: Kenney Animal Pack — CC0. Música: “kawaii 8bit” — haruta, CC0.</div><nav class="actions" id="actions"></nav></main><div class="modal" id="intro"><div class="card"><h2>🌱 Nasceu um NEXI.</h2><p>Este mundo começa em verde-limão abafado. Cuide dele: suas escolhas formam personalidade, preferências e memória.</p><button onclick="closeIntro()">Começar a cuidar</button></div></div><script>const KEY='nexi-v3-state',GENKEY='nexi-generation';const pets=['rabbit','pig','panda','monkey','penguin','parrot'];const petUrls=pets.map(x=>`https://raw.githubusercontent.com/ETdoFresh/kenney.nl/master/kenney-animalpack/PNG/Round%20(outline)/${x}.png`);const palettes=[['#87964b','#b8c77a'],['#477b78','#75aaa0'],['#a66f58','#d09a78'],['#75658d','#a997c1'],['#b08d48','#d3b86c'],['#56758b','#86a8ba']];let generation=Number(localStorage.getItem(GENKEY)||1);let g={age:0,hunger:62,energy:70,joy:55,hygiene:68,bond:10,health:100,curiosity:50,social:50,independence:50,routine:50,last:null,streak:0,history:[],alive:true,discoveries:[]};const A=[['feed','🍎','Comer',{hunger:-22,energy:-2,joy:3,hygiene:-1},'NEXI comeu.'],['play','🎾','Brincar',{hunger:8,energy:-14,joy:18,hygiene:-3},'Vocês brincaram.'],['wash','🫧','Banho',{hunger:3,energy:-5,joy:4,hygiene:28},'NEXI tomou banho.'],['sleep','🌙','Dormir',{hunger:7,energy:30,joy:2,hygiene:-2},'NEXI dormiu.']];function c(x){return Math.max(0,Math.min(100,x))}function color(){let p=palettes[(generation-1)%palettes.length];document.documentElement.style.setProperty('--world',p[0]);document.documentElement.style.setProperty('--world2',p[1]);document.body.style.background=p[0]}function stat(n,v){return `<span>${n}<b>${Math.round(v)}</b></span>`}function render(){gen.textContent='Geração '+String(generation).padStart(3,'0');need.innerHTML=stat('Fome',100-g.hunger)+stat('Energia',g.energy)+stat('Alegria',g.joy)+stat('Saúde',g.health)+stat('Higiene',g.hygiene)+stat('Vínculo',g.bond);actions.innerHTML=A.map(a=>`<button ${!g.alive?'disabled':''} onclick="act('${a[0]}')"><span>${a[1]}</span>${a[2]}</button>`).join('');let m=g.health<30?'Preciso de ajuda.':g.hunger<25?'Estou com fome.':g.energy<20?'Quero dormir.':g.hygiene<25?'Quero um banho.':g.joy<25?'Quero brincar.':g.social>75?'Gosto quando você aparece.':g.routine>75?'Você costuma fazer isso comigo.':g.curiosity>75?'Quero descobrir coisas.':'O que fazemos agora?';bubble.textContent=m;age.textContent='Vida: '+g.age+' ações';mood.textContent=g.alive?(g.curiosity>75?'Curioso':g.social>75?'Sociável':g.independence>75?'Independente':'Descobrindo'):'Fim da vida';memory.innerHTML=g.discoveries.length?'<strong>Descobertas:</strong> '+g.discoveries.join(' · '):'<strong>Memória:</strong> ainda estou descobrindo seus padrões.';petImg.src=petUrls[(generation-1)%petUrls.length];pet.className='pet '+(g.joy>70?'happy ':'')+(g.health<30?'sad':'');event.textContent=g.history[0]||'NEXI nasceu.'}function note(x){g.history.unshift(x);g.history=g.history.slice(0,20)}function act(id){if(!g.alive)return;let a=A.find(x=>x[0]===id);for(let k in a[3])g[k]=c(g[k]+a[3][k]);g.age++;g.hunger=c(g.hunger-4);g.energy=c(g.energy-2);g.hygiene=c(g.hygiene-2);g.joy=c(g.joy-1);g.streak=g.last===id?g.streak+1:1;g.last=id;g.bond=c(g.bond+(id==='play'?3:id==='feed'?1:0));g.social=c(g.social+(id==='play'?2:-.2));g.independence=c(g.independence+(id==='sleep'?1:-.1));g.routine=c(g.routine+(g.streak>1?2:-.4));g.curiosity=c(g.curiosity+(id==='play'?1.5:0));g.health=c(g.health+((g.hunger>15&&g.energy>10&&g.hygiene>15&&g.joy>15)?1:-4));note(a[4]);if(g.streak===3)note('NEXI percebeu uma rotina.');if(g.streak===5&&!g.discoveries.includes(a[2])){g.discoveries.push(a[2]);g.curiosity=c(g.curiosity+8);note('NEXI descobriu uma preferência por '+a[2].toLowerCase()+'.')}if(g.health<=0){g.alive=false;note('NEXI chegou ao fim desta geração.')}save();render()}function save(){localStorage.setItem(KEY,JSON.stringify(g))}function closeIntro(){intro.style.display='none';save()}function resetGame(){if(confirm('Começar uma nova geração?')){generation++;localStorage.setItem(GENKEY,generation);g={age:0,hunger:62,energy:70,joy:55,hygiene:68,bond:10,health:100,curiosity:50,social:50,independence:50,routine:50,last:null,streak:0,history:[],alive:true,discoveries:[]};color();intro.style.display='grid';render()}}music.onclick=()=>{if(bgm.paused){bgm.play().then(()=>music.textContent='🔊').catch(()=>{})}else{bgm.pause();music.textContent='♫'}};window.resetGame=resetGame;color();load();if(!localStorage.getItem(KEY))intro.style.display='grid';</script></body></html>
