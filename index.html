<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#87964b"><title>NEXI</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:16px system-ui,sans-serif}body{display:flex;justify-content:center;background:#87964b;color:#24301b}.game{width:min(100%,520px);min-height:100vh;padding:12px 12px 100px;background:linear-gradient(#b8c77a,#93a752 42%,#71863d);position:relative}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;letter-spacing:.14em;font-size:1.55rem}.gen{background:#f8f5dcdd;border-radius:99px;padding:6px 10px;font-size:.75rem;font-weight:900}.need{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}.need span{background:#f8f5dc99;border:1px solid #fff8;border-radius:11px;padding:5px 7px;font-size:.65rem}.need b{display:block;height:8px;margin-top:5px;background:#68744555;border-radius:99px;overflow:hidden}.need b i{display:block;height:100%;background:#f7f0bc;border-radius:99px;transition:width .25s}.habitat{height:410px;position:relative;border-radius:30px;border:2px solid #fff8;overflow:hidden;background:linear-gradient(#d9e69a55,#ffffff08);box-shadow:inset 0 -90px 0 #526b2c55;touch-action:none}.habitat:before{content:"";position:absolute;bottom:-45px;left:-10%;width:120%;height:125px;background:#4f682b99;border-radius:50% 50% 0 0}.sun{position:absolute;top:25px;left:28px;width:48px;height:48px;border-radius:50%;background:#f8df7caa}.cloud{position:absolute;top:55px;right:35px;font-size:46px;opacity:.42}.object{position:absolute;z-index:4;user-select:none}.plant{font-size:58px;left:7%;bottom:34px}.ball{font-size:45px;right:10%;bottom:34px}.bowl{font-size:42px;left:45%;bottom:26px}.target{filter:drop-shadow(0 5px 4px #26351433)}.pet{position:absolute;left:50%;top:48%;width:210px;height:210px;transform:translate(-50%,-50%);display:grid;place-items:center;z-index:10;animation:breathe 3s ease-in-out infinite;touch-action:none;cursor:grab;user-select:none}.pet.dragging{animation:none;cursor:grabbing;filter:drop-shadow(0 18px 8px #26351466) scale(1.06)}.pet img{width:205px;height:205px;object-fit:contain;filter:drop-shadow(0 14px 7px #26351455);pointer-events:none}.fallback{font-size:125px}.bubble{position:absolute;z-index:12;top:12px;right:9px;max-width:215px;background:#fffdf0;border:2px solid #fffa;border-radius:17px 17px 4px 17px;padding:9px 11px;box-shadow:0 5px 15px #26351425;font-size:.8rem}.event{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:15;background:#26351ddd;color:#fff;border-radius:99px;padding:6px 12px;font-size:.7rem;white-space:nowrap}.meta{display:flex;justify-content:space-between;margin:8px 3px;color:#fffde0;font-size:.72rem;font-weight:700}.memory{background:#ffffff3b;border-radius:14px;padding:9px 11px;font-size:.74rem;color:#fffde8}.actions{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 9px calc(8px + env(safe-area-inset-bottom));background:#f6f1dff5;backdrop-filter:blur(12px);border-top:2px solid #fff;box-shadow:0 -8px 25px #26351455;z-index:20}.actions button{border:1px solid #c9c5a9;background:#fffdf1;color:#26311f;border-radius:15px;min-height:64px;font-weight:850;font-size:.68rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.actions button span{font-size:1.45rem}.music{position:absolute;top:54px;left:12px;z-index:30;border:0;border-radius:50%;width:38px;height:38px;background:#fffdf0dd;font-size:1rem}.credits{text-align:center;margin-top:9px;color:#fffde0aa;font-size:.6rem}@keyframes breathe{50%{transform:translate(-50%,-54%)}}@media(max-height:700px){.habitat{height:330px}}@media(max-width:360px){.habitat{height:300px}.actions button{min-height:58px;font-size:.62rem}}</style></head><body><main class="game"><div class="top"><div class="brand">NEXI</div><div class="gen" id="gen"></div></div><button class="music" id="music">♫</button><audio id="bgm" loop preload="auto"><source src="https://opengameart.org/sites/default/files/kawaii_8bit.mp3" type="audio/mpeg"></audio><div class="need" id="need"></div><section class="habitat" id="habitat"><div class="sun"></div><div class="cloud">☁️</div><div class="bubble" id="bubble">Arraste-me!</div><div class="object plant target" id="plant">🌿</div><div class="object ball target" id="ball">🎾</div><div class="object bowl target" id="bowl">🥣</div><div class="pet" id="pet"><img id="petImg" alt="NEXI"><div id="fallback" class="fallback" hidden>🐰</div></div><div class="event" id="event">Arraste NEXI pelo jardim!</div></section><div class="meta"><span id="age"></span><span id="mood"></span></div><div class="memory" id="memory"></div><div class="credits">Arte: Kenney Animal Pack — CC0. Música: “kawaii 8bit” — CC0.</div><nav class="actions" id="actions"></nav></main><script>const KEY='nexi-v5-state',GEN='nexi-generation';const pets=['rabbit','pig','panda','monkey','penguin','parrot'];const urls=pets.map(x=>`https://raw.githubusercontent.com/ETdoFresh/kenney.nl/master/kenney-animalpack/PNG/Round%20(outline)/${x}.png`);const colors=['#87964b','#477b78','#a66f58','#75658d','#b08d48','#56758b'];let generation=+(localStorage.getItem(GEN)||1);let g={age:0,hunger:62,energy:70,joy:55,hygiene:68,bond:10,health:100,curiosity:50,social:50,independence:50,routine:50,last:'',streak:0,history:[],alive:true,discoveries:[]};const A=[['feed','🍎','Comer','NEXI comeu.'],['play','🎾','Brincar','Vocês brincaram.'],['wash','🫧','Banho','NEXI tomou banho.'],['sleep','🌙','Dormir','NEXI dormiu.']];const $=id=>document.getElementById(id);function clamp(x){return Math.max(0,Math.min(100,x))}function save(){localStorage.setItem(KEY,JSON.stringify(g))}function load(){try{const x=localStorage.getItem(KEY);if(x)g=Object.assign(g,JSON.parse(x))}catch(e){}}function render(){gen.textContent='Geração '+String(generation).padStart(3,'0');need.innerHTML=[['Fome',100-g.hunger],['Energia',g.energy],['Alegria',g.joy],['Saúde',g.health],['Higiene',g.hygiene],['Vínculo',g.bond]].map(x=>`<span>${x[0]}<b><i style="width:${clamp(x[1])}%"></i></b></span>`).join('');actions.innerHTML=A.map(a=>`<button ${g.alive?'':'disabled'} onclick="act('${a[0]}')"><span>${a[1]}</span>${a[2]}</button>`).join('');let msg=g.health<30?'Preciso de ajuda.':g.hunger<25?'Estou com fome.':g.energy<20?'Quero dormir.':g.hygiene<25?'Quero um banho.':g.joy<25?'Quero brincar.':g.social>75?'Gosto quando você aparece.':g.curiosity>75?'Quero descobrir coisas.':'Arraste-me pelo jardim!';bubble.textContent=msg;age.textContent='Vida: '+g.age+' ações';mood.textContent=g.alive?'Descobrindo':'Fim da vida';memory.innerHTML=g.discoveries.length?'<b>Descobertas:</b> '+g.discoveries.join(' · '):'<b>Memória:</b> ainda descobrindo seus padrões.';event.textContent=g.history[0]||'Arraste NEXI pelo jardim!';const img=$('petImg');img.onerror=()=>{$('fallback').hidden=false;img.hidden=true};img.src=urls[(generation-1)%urls.length]}function act(id){if(!g.alive)return;g.age++;g.hunger=clamp(g.hunger+(id==='feed'?22:id==='play'?-8:id==='sleep'?-7:-3));g.energy=clamp(g.energy+(id==='sleep'?30:id==='play'?-14:id==='wash'?-5:-2));g.joy=clamp(g.joy+(id==='play'?18:id==='feed'?3:id==='wash'?4:2)-1);g.hygiene=clamp(g.hygiene+(id==='wash'?28:-2));g.bond=clamp(g.bond+(id==='play'?3:id==='feed'?1:0));g.social=clamp(g.social+(id==='play'?2:-.2));g.independence=clamp(g.independence+(id==='sleep'?1:-.1));g.streak=g.last===id?g.streak+1:1;g.last=id;g.routine=clamp(g.routine+(g.streak>1?2:-.4));g.curiosity=clamp(g.curiosity+(id==='play'?1.5:0));g.health=clamp(g.health+((g.hunger>15&&g.energy>10&&g.hygiene>15&&g.joy>15)?1:-4));g.history.unshift(A.find(x=>x[0]===id)[3]);g.history=g.history.slice(0,20);if(g.streak===3)g.history.unshift('NEXI percebeu uma rotina.');if(g.streak===5&&!g.discoveries.includes(id)){g.discoveries.push(id);g.history.unshift('NEXI descobriu uma preferência nova.')}if(g.health<=0){g.alive=false;g.history.unshift('Esta geração chegou ao fim.')}save();render()}function dragGame(){let active=false,dx=0,dy=0;pet.addEventListener('pointerdown',e=>{if(!g.alive)return;active=true;pet.classList.add('dragging');pet.setPointerCapture(e.pointerId);const r=pet.getBoundingClientRect();dx=e.clientX-(r.left+r.width/2);dy=e.clientY-(r.top+r.height/2);e.preventDefault()});pet.addEventListener('pointermove',e=>{if(!active)return;const hr=habitat.getBoundingClientRect();const half=pet.offsetWidth/2;let x=e.clientX-hr.left-dx,y=e.clientY-hr.top-dy;x=clamp(x,half,hr.width-half);y=clamp(y,half,hr.height-half);pet.style.left=x+'px';pet.style.top=y+'px';pet.style.transform='translate(-50%,-50%)'});pet.addEventListener('pointerup',finish);pet.addEventListener('pointercancel',finish);function finish(e){if(!active)return;active=false;pet.classList.remove('dragging');pet.releasePointerCapture?.(e.pointerId);const pr=pet.getBoundingClientRect();[['plant','curiosity','NEXI cheirou uma planta e ficou curioso.'],['ball','joy','NEXI encontrou a bola e ficou animado!'],['bowl','hunger','NEXI foi até o potinho.']].forEach(([id,key,msg])=>{const r=$(id).getBoundingClientRect();if(pr.left<r.right&&pr.right>r.left&&pr.top<r.bottom&&pr.bottom>r.top){if(key==='hunger')g.hunger=clamp(g.hunger+18);else g[key]=clamp(g[key]+12);g.bond=clamp(g.bond+2);g.age++;g.history.unshift(msg);g.history=g.history.slice(0,20);save();event.textContent=msg;render()}})} }load();document.body.style.background=colors[(generation-1)%colors.length];render();dragGame();music.onclick=()=>{if(bgm.paused){bgm.play().then(()=>music.textContent='🔊').catch(()=>{})}else{bgm.pause();music.textContent='♫'}};</script></body></html>
