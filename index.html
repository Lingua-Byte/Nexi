<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10131a"><title>NEXI</title><style>:root{--bg:#10131a;--p:#191e28;--l:#303847;--t:#edf2f7;--m:#9ba7b7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#20283a,#10131a 55%);color:var(--t);font:16px system-ui,sans-serif;min-height:100vh}main{max-width:760px;margin:auto;padding:18px}.screen{background:#0b0e13;border:7px solid #303640;border-radius:22px;padding:16px;box-shadow:0 12px 40px #0008}h1{margin:0;font-size:2.1rem;letter-spacing:.08em}.sub{color:var(--m);margin:0 0 14px}.pet{height:230px;display:grid;place-items:center;position:relative}.creature{font-size:100px}.bubble{position:absolute;right:0;top:0;background:#f4f6f8;color:#12151b;padding:9px 12px;border-radius:14px;max-width:250px;font-size:.9rem}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{background:var(--p);border:1px solid var(--l);padding:9px;border-radius:12px}.row{display:flex;justify-content:space-between}.bar{height:8px;background:#303640;border-radius:9px;overflow:hidden;margin-top:6px}.fill{height:100%;background:#8ea7ff}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}button{border:1px solid var(--l);background:#232a38;color:var(--t);border-radius:12px;padding:13px;font-weight:650;min-height:48px}button:active{transform:scale(.98)}.log{margin-top:12px;background:var(--p);border:1px solid var(--l);border-radius:12px;padding:11px;min-height:70px;color:var(--m)}.footer{display:flex;gap:8px;margin-top:10px}.footer button{flex:1;font-size:.85rem;padding:8px}.goal{color:var(--m);font-size:.8rem;margin-top:10px;line-height:1.4}@media(max-width:520px){main{padding:12px}.pet{height:205px}.creature{font-size:88px}.stats,.actions{grid-template-columns:1fr 1fr}}@media(max-width:360px){.stats,.actions{grid-template-columns:1fr}}</style></head><body><main><h1>NEXI</h1><div class="sub">uma criatura que aprende com a sua rotina</div><section class="screen"><div class="pet"><div id="bubble" class="bubble">Estou começando a conhecer você.</div><div id="creature" class="creature">•‿•</div></div><div id="stats" class="stats"></div><div id="actions" class="actions"></div><div id="log" class="log"></div><div class="footer"><button onclick="save(true)">Salvar</button><button onclick="load()">Carregar</button><button onclick="resetGame()">Recomeçar</button></div><div class="goal">Cada clique muda o estado de NEXI. Repetições formam preferências; o histórico muda o comportamento futuro.</div></section></main><script>const KEY='nexi-v2';let g={age:0,hunger:62,energy:70,joy:55,hygiene:68,bond:10,health:100,curiosity:50,social:50,independence:50,routine:50,vitality:50,last:null,streak:0,history:[],alive:true,discoveries:[]};const A=[['feed','🍎 Alimentar',{hunger:-22,energy:-2,joy:3,hygiene:-1},'NEXI comeu.'],['play','🎾 Brincar',{hunger:8,energy:-14,joy:18,hygiene:-3},'Vocês brincaram.'],['sleep','🌙 Dormir',{hunger:7,energy:30,joy:2,hygiene:-2},'NEXI dormiu.'],['wash','🫧 Banho',{hunger:3,energy:-5,joy:4,hygiene:28},'NEXI tomou banho.']];function c(x){return Math.max(0,Math.min(100,x))}function stat(n,v){return `<div class="stat"><div class="row"><span>${n}</span><b>${Math.round(v)}</b></div><div class="bar"><div class="fill" style="width:${c(v)}%"></div></div></div>`}function render(){stats.innerHTML=stat('Fome',100-g.hunger)+stat('Energia',g.energy)+stat('Alegria',g.joy)+stat('Higiene',g.hygiene)+stat('Vínculo',g.bond)+stat('Saúde',g.health)+stat('Curiosidade',g.curiosity)+stat('Rotina',g.routine);actions.innerHTML=A.map(a=>`<button ${!g.alive?'disabled':''} onclick="act('${a[0]}')">${a[1]}</button>`).join('');let m=g.health<30?'Preciso de ajuda.':g.hunger<25?'Estou com fome.':g.energy<20?'Quero dormir.':g.hygiene<25?'Quero um banho.':g.joy<25?'Quero brincar.':g.social>75?'Gosto quando você aparece.':g.routine>75?'Você costuma fazer isso comigo.':g.curiosity>75?'Quero descobrir coisas.':'O que fazemos agora?';bubble.textContent=m;creature.textContent=!g.alive?'×︵×':g.health<30?'◕︵◕':g.joy>70?'◕‿◕':'•‿•';log.innerHTML=g.history.slice(0,5).map(x=>`<div>• ${x}</div>`).join('')}function note(x){g.history.unshift(x);g.history=g.history.slice(0,20)}function act(id){if(!g.alive)return;let a=A.find(x=>x[0]===id);for(let k in a[2])g[k]=c(g[k]+a[2][k]);g.age++;g.hunger=c(g.hunger-4);g.energy=c(g.energy-2);g.hygiene=c(g.hygiene-2);g.joy=c(g.joy-1);g.streak=g.last===id?g.streak+1:1;g.last=id;g.bond=c(g.bond+(id==='play'?3:id==='feed'?1:0));g.social=c(g.social+(id==='play'?2:-.2));g.independence=c(g.independence+(id==='sleep'?1:-.1));g.routine=c(g.routine+(g.streak>1?2:-.4));g.curiosity=c(g.curiosity+(id==='play'?1.5:0));let ok=g.hunger>15&&g.energy>10&&g.hygiene>15&&g.joy>15;g.health=c(g.health+(ok?1:-4));note(a[3]);if(g.streak===3)note('NEXI percebeu que você repete essa escolha.');if(g.streak===5&&!g.discoveries.includes(id)){g.discoveries.push(id);g.curiosity=c(g.curiosity+8);note('NEXI descobriu uma preferência nova.')}if(g.health<=0){g.alive=false;note('NEXI morreu. O histórico ficou salvo para você entender a rotina.')}save(false);render()}function save(show){localStorage.setItem(KEY,JSON.stringify(g));if(show){note('Estado salvo.');render()}}function load(){let x=localStorage.getItem(KEY);if(x){g=JSON.parse(x);note('Estado recuperado.');render()}else{note('Nenhum estado salvo.');render()}}function resetGame(){if(confirm('Recomeçar NEXI?')){localStorage.removeItem(KEY);location.reload()}}render();</script></body></html>
