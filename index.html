<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEXI">
<meta name="description" content="Câmera com efeitos em tempo real.">
<title>NEXI</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0b10;color:#f4f4f8;font:15px system-ui,sans-serif;overflow:hidden}
.app{position:fixed;inset:0;display:flex;flex-direction:column}
.stage{flex:1;position:relative;display:grid;place-items:center;overflow:hidden;background:#000}
canvas{max-width:100%;max-height:100%;display:block}
video{display:none}
.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:linear-gradient(#000a,#0000);z-index:3}
.brand{font-weight:900;letter-spacing:.14em}
.name{background:#ffffff22;backdrop-filter:blur(8px);padding:6px 12px;border-radius:99px;font-size:.8rem;font-weight:700}
.rec{display:none;align-items:center;gap:6px;background:#e5243b;padding:6px 10px;border-radius:99px;font-size:.78rem;font-weight:800}
.rec.on{display:flex}.rec:before{content:"";width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1s infinite}
.msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;z-index:2}
.msg button{margin-top:14px}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
.flash.go{animation:flash .35s ease-out}
.panel{background:#0b0b10;padding:10px 0 calc(12px + env(safe-area-inset-bottom))}
.fx{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 12px;scroll-snap-type:x mandatory;scrollbar-width:none}
.fx::-webkit-scrollbar{display:none}
.fx button{flex:0 0 auto;scroll-snap-align:center;border:2px solid #ffffff1f;background:#17171f;color:#ddd;border-radius:14px;padding:8px 12px;font-weight:700;font-size:.78rem;min-width:74px}
.fx button span{display:block;font-size:1.35rem;margin-bottom:2px}
.fx button.on{border-color:#c6ff3d;color:#fff;background:#22261a}
.slider{display:flex;align-items:center;gap:10px;padding:0 18px 10px;font-size:.75rem;color:#aaa}
.slider input{flex:1;accent-color:#c6ff3d}
.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 22px}
.round{width:52px;height:52px;border-radius:50%;border:0;background:#1d1d26;color:#fff;font-size:1.3rem;display:grid;place-items:center}
.round:active,.shutter:active{transform:scale(.92)}
.left{display:flex;gap:10px}.right{display:flex;gap:10px;justify-content:flex-end}
.shutter{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:#fff3;padding:0;transition:transform .1s}
.shutter i{display:block;margin:auto;width:56px;height:56px;border-radius:50%;background:#fff;transition:all .2s}
.shutter.video i{background:#e5243b}
.shutter.video.recording i{width:28px;height:28px;border-radius:7px}
.mode{display:flex;justify-content:center;gap:18px;padding-bottom:10px;font-size:.78rem;font-weight:800;letter-spacing:.08em}
.mode button{background:none;border:0;color:#777;font:inherit;padding:4px}
.mode button.on{color:#c6ff3d}
.thumb{width:52px;height:52px;border-radius:12px;border:2px solid #fff4;background:#1d1d26 center/cover;display:block}
.gallery{position:fixed;inset:0;background:#0b0b10f5;z-index:10;display:none;flex-direction:column}
.gallery.open{display:flex}
.ghead{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;font-weight:800}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px}
.grid a{position:relative;aspect-ratio:3/4;background:#1d1d26;border-radius:6px;overflow:hidden}
.grid img,.grid video{width:100%;height:100%;object-fit:cover;display:block}
.grid a b{position:absolute;bottom:4px;right:6px;font-size:.9rem}
.empty{grid-column:1/-1;text-align:center;color:#888;padding:40px}
.install{display:none;border:0;border-radius:99px;padding:6px 12px;font-weight:800;font-size:.78rem;background:#c6ff3d;color:#111}
.install.show{display:block}
.sheet{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));background:#17171f;border:1px solid #ffffff22;border-radius:18px;padding:16px;z-index:20;display:none;font-size:.9rem;line-height:1.45}
.sheet.open{display:block}
.sheet b{color:#c6ff3d}
button.pill{border:0;border-radius:99px;padding:10px 16px;font-weight:800;background:#c6ff3d;color:#111}
@keyframes blink{50%{opacity:.2}}
@keyframes flash{from{opacity:.85}to{opacity:0}}
</style>
</head>
<body>
<div class="app">
  <section class="stage" id="stage">
    <div class="top"><div class="brand">NEXI</div><div class="rec" id="rec">00:00</div><div style="display:flex;gap:8px;align-items:center"><button class="install" id="installBtn">⬇ Instalar</button><div class="name" id="fxName">Normal</div></div></div>
    <canvas id="cv"></canvas>
    <video id="video" playsinline muted></video>
    <div class="msg" id="msg"><div><div style="font-size:3rem">📷</div><p>Toque para ligar a câmera.</p><button class="pill" id="startBtn">Ligar câmera</button></div></div>
    <div class="flash" id="flash"></div>
  </section>
  <section class="panel">
    <div class="fx" id="fx"></div>
    <div class="slider"><span>Intensidade</span><input id="amount" type="range" min="0" max="1" step="0.01" value="0.6"></div>
    <div class="mode"><button id="mPhoto" class="on">FOTO</button><button id="mVideo">VÍDEO</button></div>
    <div class="controls">
      <div class="left"><a class="thumb" id="thumb" href="#" aria-label="Galeria"></a></div>
      <button class="shutter" id="shutter" aria-label="Capturar"><i></i></button>
      <div class="right"><button class="round" id="flip" aria-label="Trocar câmera">🔄</button></div>
    </div>
  </section>
</div>
<div class="gallery" id="gallery">
  <div class="ghead"><span>Galeria (sessão)</span><button class="pill" id="closeGal">Fechar</button></div>
  <div class="grid" id="grid"></div>
</div>
<div class="sheet" id="iosSheet"><b>Instalar o NEXI no iPhone</b><br>1. Toque em <b>Compartilhar</b> (□↑) no Safari<br>2. Escolha <b>Adicionar à Tela de Início</b><br>3. Toque em <b>Adicionar</b><div style="text-align:right;margin-top:10px"><button class="pill" id="iosClose">Entendi</button></div></div>
<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),video=$('video');
const gl=cv.getContext('webgl',{preserveDrawingBuffer:true});

// ---- Efeitos (fragment shaders) ----
// uniforms: t (tempo), a (intensidade 0..1), res (resolução), mir (espelhar)
const HEAD=`precision mediump float;varying vec2 uv;uniform sampler2D tex;uniform float t,a;uniform vec2 res;
vec3 px(vec2 p){return texture2D(tex,clamp(p,0.,1.)).rgb;}
float lum(vec3 c){return dot(c,vec3(.299,.587,.114));}
float rnd(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
`;
const FX=[
 ['Normal','🙂',`void main(){gl_FragColor=vec4(px(uv),1.);}`],
 ['P&B','⚫',`void main(){vec3 c=px(uv);float l=lum(c);l=mix(l,smoothstep(.1,.9,l),a);gl_FragColor=vec4(vec3(l),1.);}`],
 ['Sépia','🟤',`void main(){vec3 c=px(uv);vec3 s=vec3(dot(c,vec3(.393,.769,.189)),dot(c,vec3(.349,.686,.168)),dot(c,vec3(.272,.534,.131)));float v=1.-distance(uv,vec2(.5))*.9*a;gl_FragColor=vec4(mix(c,s,.4+.6*a)*v,1.);}`],
 ['Vintage','🎞️',`void main(){vec3 c=px(uv);c=pow(c,vec3(1.1,1.,.85));c=mix(c,vec3(lum(c)),.25);c+=vec3(.08,.04,-.02);c+=(rnd(uv*res+t)-.5)*.12*a;float v=smoothstep(.85,.25,distance(uv,vec2(.5)));gl_FragColor=vec4(c*mix(1.,v,a),1.);}`],
 ['Neon','💡',`void main(){vec2 e=1.5/res;float gx=lum(px(uv+vec2(e.x,0)))-lum(px(uv-vec2(e.x,0)));float gy=lum(px(uv+vec2(0,e.y)))-lum(px(uv-vec2(0,e.y)));float g=length(vec2(gx,gy))*(3.+a*8.);vec3 col=.5+.5*cos(6.28*(uv.x+uv.y+t*.2)+vec3(0,2,4));gl_FragColor=vec4(col*g+px(uv)*.15*(1.-a),1.);}`],
 ['Quadrinhos','💥',`void main(){vec3 c=px(uv);float n=3.+floor((1.-a)*5.);c=floor(c*n+.5)/n;vec2 e=1./res;float g=abs(lum(px(uv+e))-lum(px(uv-e)))*8.;vec2 d=fract(uv*res/6.)-.5;float dot_=step(length(d),.35+lum(c)*.3);c*=mix(1.,.75+.25*dot_,a);gl_FragColor=vec4(c*(1.-step(.35,g)),1.);}`],
 ['Pixel','👾',`void main(){float s=4.+a*36.;vec2 p=(floor(uv*res/s)+.5)*s/res;vec3 c=px(p);c=floor(c*6.)/6.;gl_FragColor=vec4(c,1.);}`],
 ['Glitch','📺',`void main(){vec2 p=uv;float line=floor(uv.y*40.);float j=step(.92-a*.1,rnd(vec2(line,floor(t*12.))));p.x+=(rnd(vec2(line,t))-.5)*.15*j*a;float o=.004+.02*a;vec3 c=vec3(px(p+vec2(o,0)).r,px(p).g,px(p-vec2(o,0)).b);c*=.9+.1*sin(uv.y*res.y*1.5);c+=(rnd(uv*res+t)-.5)*.08;gl_FragColor=vec4(c,1.);}`],
 ['Térmica','🔥',`void main(){float l=lum(px(uv));vec3 c=mix(vec3(0,0,.4),vec3(.6,0,.8),smoothstep(0.,.3,l));c=mix(c,vec3(1,.2,0),smoothstep(.3,.6,l));c=mix(c,vec3(1,1,.3),smoothstep(.6,.9,l));gl_FragColor=vec4(mix(px(uv),c,.4+.6*a),1.);}`],
 ['Negativo','🔁',`void main(){vec3 c=px(uv);gl_FragColor=vec4(mix(c,1.-c,a*.7+.3),1.);}`],
 ['Espelho','🪞',`void main(){vec2 p=uv;p.x=p.x>.5?1.-p.x:p.x;if(a>.5)p.y=p.y>.5?1.-p.y:p.y;gl_FragColor=vec4(px(p),1.);}`],
 ['Caleidoscópio','🔮',`void main(){vec2 p=uv-.5;p.x*=res.x/res.y;float r=length(p),an=atan(p.y,p.x)+t*.15;float n=3.+floor(a*9.);float s=6.2832/n;an=abs(mod(an,s)-s*.5);p=vec2(cos(an),sin(an))*r;p.x/=res.x/res.y;gl_FragColor=vec4(px(p+.5),1.);}`],
 ['Ondas','🌊',`void main(){vec2 p=uv;p.x+=sin(uv.y*25.+t*3.)*.02*a;p.y+=cos(uv.x*20.+t*2.)*.015*a;gl_FragColor=vec4(px(p),1.);}`],
 ['Olho de peixe','🐟',`void main(){vec2 p=uv-.5;float r=length(p);p*=1.+a*1.2*(r*r-.25);vec3 c=px(p+.5);gl_FragColor=vec4(c*smoothstep(.75,.6,r),1.);}`],
 ['Duotone','🎨',`void main(){float l=lum(px(uv));l=smoothstep(.1,.9,l);vec3 c1=vec3(.15,.05,.45),c2=mix(vec3(1.,.45,.6),vec3(.78,1.,.24),a);gl_FragColor=vec4(mix(c1,c2,l),1.);}`],
 ['ASCII','🔤',`float ch(float l,vec2 p){p=floor(p*5.);float i=p.x+p.y*5.;float b=l>.8?11512810.:l>.6?13195790.:l>.45?15255086.:l>.3?4357252.:l>.15?4096.:0.;return mod(floor(b/exp2(i)),2.);}void main(){float s=6.+a*10.;vec2 c=floor(uv*res/s)*s/res;vec3 col=px(c+.5*s/res);vec2 f=fract(uv*res/s);float m=ch(lum(col),f);gl_FragColor=vec4(m*mix(vec3(.3,1.,.4),col*1.4,.5),1.);}`],
];

const VS=`attribute vec2 p;varying vec2 uv;uniform float mir;void main(){uv=p*.5+.5;uv.y=1.-uv.y;if(mir>.5)uv.x=1.-uv.x;gl_Position=vec4(p,0,1);}`;
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.warn(gl.getShaderInfoLog(s));return s}
const progs=FX.map(([,,fs])=>{const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,VS));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,HEAD+fs));gl.linkProgram(p);return p});
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
[gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T].forEach(k=>gl.texParameteri(gl.TEXTURE_2D,k,gl.CLAMP_TO_EDGE));
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);

let cur=+(localStorage.getItem('nexi-fx')||0)%FX.length,amount=$('amount'),facing='user',stream=null,mode='photo',recorder=null,chunks=[],recStart=0,shots=[];
amount.value=localStorage.getItem('nexi-amt')||.6;

// ---- Lista de efeitos ----
$('fx').innerHTML=FX.map(([n,e],i)=>`<button data-i="${i}"><span>${e}</span>${n}</button>`).join('');
function pick(i){cur=i;localStorage.setItem('nexi-fx',i);$('fxName').textContent=FX[i][0];document.querySelectorAll('.fx button').forEach((b,j)=>b.classList.toggle('on',j===i));document.querySelector(`.fx button[data-i="${i}"]`).scrollIntoView({inline:'center',behavior:'smooth',block:'nearest'})}
$('fx').onclick=e=>{const b=e.target.closest('button');if(b){pick(+b.dataset.i);navigator.vibrate?.(8)}};
amount.oninput=()=>localStorage.setItem('nexi-amt',amount.value);
// deslizar no visor troca o efeito
let sx=null;$('stage').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
$('stage').addEventListener('touchend',e=>{if(sx==null)return;const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>60)pick((cur+(d<0?1:-1)+FX.length)%FX.length);sx=null});
pick(cur);

// ---- Câmera ----
async function start(){
  stream?.getTracks().forEach(t=>t.stop());
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:mode==='video'});
  }catch(err){
    try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing}})}catch(e){$('msg').style.display='grid';$('msg').querySelector('p').textContent='Não foi possível acessar a câmera: '+(e.message||e.name);return}
  }
  video.srcObject=stream;await video.play();$('msg').style.display='none';
}
$('startBtn').onclick=start;
$('flip').onclick=()=>{facing=facing==='user'?'environment':'user';start()};

function draw(now){
  requestAnimationFrame(draw);
  if(video.readyState<2)return;
  const w=video.videoWidth,h=video.videoHeight;
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;gl.viewport(0,0,w,h)}
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,video);
  const p=progs[cur];gl.useProgram(p);
  const loc=gl.getAttribLocation(p,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  gl.uniform1f(gl.getUniformLocation(p,'t'),now/1000);
  gl.uniform1f(gl.getUniformLocation(p,'a'),+amount.value);
  gl.uniform2f(gl.getUniformLocation(p,'res'),w,h);
  gl.uniform1f(gl.getUniformLocation(p,'mir'),facing==='user'?1:0);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
requestAnimationFrame(draw);

// ---- Captura ----
function addShot(url,type){shots.unshift({url,type});$('thumb').style.backgroundImage=type==='img'?`url(${url})`:'none';$('thumb').textContent='';}
function stamp(){return new Date().toISOString().slice(0,19).replace(/[T:]/g,'-')}
function download(url,name){const a=document.createElement('a');a.href=url;a.download=name;a.click()}
function photo(){
  $('flash').classList.remove('go');void $('flash').offsetWidth;$('flash').classList.add('go');navigator.vibrate?.(20);
  cv.toBlob(b=>{const url=URL.createObjectURL(b);addShot(url,'img');download(url,`nexi-${stamp()}.jpg`)},'image/jpeg',.92);
}
function toggleRec(){
  if(recorder){recorder.stop();return}
  const s=cv.captureStream(30);stream?.getAudioTracks().forEach(t=>s.addTrack(t));
  const mime=['video/mp4','video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported?.(m))||'';
  recorder=new MediaRecorder(s,mime?{mimeType:mime}:{});chunks=[];
  recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  recorder.onstop=()=>{const type=recorder.mimeType||'video/webm';const url=URL.createObjectURL(new Blob(chunks,{type}));addShot(url,'vid');$('thumb').textContent='🎬';download(url,`nexi-${stamp()}.${type.includes('mp4')?'mp4':'webm'}`);recorder=null;$('shutter').classList.remove('recording');$('rec').classList.remove('on')};
  recorder.start();recStart=Date.now();$('shutter').classList.add('recording');$('rec').classList.add('on');
}
setInterval(()=>{if(!recorder)return;const s=Math.floor((Date.now()-recStart)/1000);$('rec').textContent=String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},250);
$('shutter').onclick=()=>{if(!stream)return start();mode==='photo'?photo():toggleRec()};
function setMode(m){if(recorder)return;mode=m;$('mPhoto').classList.toggle('on',m==='photo');$('mVideo').classList.toggle('on',m==='video');$('shutter').classList.toggle('video',m==='video');if(stream&&m==='video'&&!stream.getAudioTracks().length)start()}
$('mPhoto').onclick=()=>setMode('photo');$('mVideo').onclick=()=>setMode('video');

// ---- Galeria ----
$('thumb').onclick=e=>{e.preventDefault();$('grid').innerHTML=shots.length?shots.map(s=>`<a href="${s.url}" target="_blank">${s.type==='img'?`<img src="${s.url}">`:`<video src="${s.url}" muted playsinline></video><b>🎬</b>`}</a>`).join(''):'<div class="empty">Nenhuma captura ainda.</div>';$('gallery').classList.add('open')};
$('closeGal').onclick=()=>$('gallery').classList.remove('open');

// ---- Instalação (PWA) ----
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
let deferred=null;
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('installBtn').classList.add('show')});
addEventListener('appinstalled',()=>{deferred=null;$('installBtn').classList.remove('show')});
if(ios&&!standalone)$('installBtn').classList.add('show');
$('installBtn').onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;$('installBtn').classList.remove('show')}else $('iosSheet').classList.add('open')};
$('iosClose').onclick=()=>$('iosSheet').classList.remove('open');

if(!navigator.mediaDevices?.getUserMedia){$('msg').querySelector('p').textContent='Seu navegador não suporta câmera (use HTTPS).'}
else start();
</script>
</body>
</html>
