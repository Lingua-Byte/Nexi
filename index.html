<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#82964a"><title>NEXI</title><style>:root{--world:#82964a;--world2:#a9b66b;--ink:#26311f;--shadow:#17200d55}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--world);color:var(--ink);font:16px system-ui,sans-serif}body{display:flex;justify-content:center}.game{width:min(100%,520px);min-height:100vh;position:relative;overflow:hidden;background:linear-gradient(180deg,var(--world2),var(--world) 55%,#687b3e);padding:14px 12px 94px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.12em;font-size:1.5rem}.gen{background:#ffffff55;border:1px solid #ffffff77;border-radius:99px;padding:6px 10px;font-size:.78rem;font-weight:800}.need{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}.need span{background:#ffffff66;border:1px solid #ffffff77;border-radius:10px;padding:6px 5px;font-size:.72rem;text-align:center}.need b{display:block;font-size:.82rem}.habitat{height:390px;position:relative;border-radius:28px;background:linear-gradient(180deg,#ffffff22,#00000010);border:1px solid #ffffff55;display:flex;align-items:center;justify-content:center;overflow:hidden}.habitat:before{content:"";position:absolute;bottom:-35px;left:-10%;width:120%;height:110px;background:#53683288;border-radius:50% 50% 0 0}.plant{position:absolute;font-size:54px;opacity:.7}.p1{left:8%;bottom:30px}.p2{right:7%;bottom:38px}.pet{position:relative;width:210px;height:210px;display:grid;place-items:center;z-index:2;animation:breathe 3s ease-in-out infinite}.pet img{max-width:185px;max-height:185px;object-fit:contain;filter:drop-shadow(0 14px 7px #17200d44)}.pet.happy{animation:bounce .6s ease}.pet.sad{filter:grayscale(.55);opacity:.8}.bubble{position:absolute;z-index:4;top:15px;right:10px;max-width:210px;background:#fffdf1;border:2px solid #ffffffaa;border-radius:16px 16px 4px 16px;padding:9px 11px;box-shadow:0 5px 14px #17200d22;font-size:.82rem}.event{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:5;background:#26351cdd;color:white;border-radius:99px;padding:6px 12px;font-size:.72rem;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}.actions{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:#f4f0dcf5;backdrop-filter:blur(12px);border-top:1px solid #ffffff99;box-shadow:0 -8px 25px var(--shadow);z-index:20}.actions button{border:1px solid #c8c4aa;background:#fffdf1;color:#26311f;border-radius:15px;min-height:62px;font-weight:800;font-size:.7rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.actions button span{font-size:1.45rem}.actions button:active{transform:translateY(2px) scale(.98)}.meta{display:flex;justify-content:space-between;margin:10px 3px;color:#fff9;font-size:.72rem}.memory{background:#ffffff33;border-radius:14px;padding:9px 11px;margin-top:8px;font-size:.76rem}.memory strong{color:#fff}.credits{text-align:center;margin-top:10px;color:#fff9;font-size:.65rem}.credits a{color:inherit}.modal{position:fixed;inset:0;background:#18210dcc;display:grid;place-items:center;padding:20px;z-index:50}.card{width:min(100%,420px);background:#fffdf1;border-radius:24px;padding:24px;box-shadow:0 20px 50px #0005}.card h2{margin:0 0 8px}.card button{width:100%;border:0;background:#314326;color:white;border-radius:14px;padding:14px;font-weight:800}@keyframes breathe{50%{transform:translateY(-4px)}}@keyframes bounce{25%{transform:translateY(-15px) rotate(-2deg)}50%{transform:translateY(0) rotate(2deg)}75%{transform:translateY(-8px)}}@media(max-height:700px){.habitat{height:315px}}</style></head><body><main class="game"><div class="top"><div class="brand">NEXI</div><div class="gen" id="gen"></div></div><div class="need" id="need"></div><section class="habitat"><div class="bubble" id="bubble">Estou começando a conhecer você.</div><div class="plant p1">🌿</div><div class="plant p2">🌱</div><div class="pet" id="pet"><img id="petImg" alt="NEXI"></div><div class="event" id="event">NEXI nasceu.</div></section><div class="meta"><span id="age"></span><span id="mood"></span></div><div class="memory" id="memory"></div><div class="credits">Arte: Kenney Animal Pack — CC0. <a href="https://kenney.nl/assets/animal-pack" target="_blank" rel="noopener">fonte</a></div><nav class="actions" id="actions"></nav></main><div class="modal" id="intro"><div class="card"><h2>Nasceu um NEXI.</h2><p>Cada geração recebe uma cor e uma criatura diferentes. As escolhas constroem a personalidade, as preferências e a memória dela.</p><button onclick="closeIntro()">Começar a cuidar</button></div></div><script>const KEY='nexi-v3-state',GENKEY='nexi-generation';const palettes=[['#82964a','#a9b66b'],['#477b78','#72aaa1'],['#a66f58','#cf9a78'],['#75658d','#a997c1'],['#b08d48','#d2b66c'],['#56758b','#83a6ba']];const pets=['rabbit','pig','panda','monkey','penguin','parrot'];const petUrls=pets.map(x=>`https://raw.githubusercontent.com/ETdoFresh/kenney.nl/master/kenney-animalpack/PNG/Round%20(outline)/${x}.png`);let generation=Number(localStorage.getItem(GENKEY)||1);let g={age:0,hunger:62,energy:70,joy:55,hygiene:68,bond:10,health:100,curiosity:50,social:50,independence:50,routine:50,last:null,streak:0,history:[],alive:true,discoveries:[]};const A=[['feed','🍎','Comer',{hunger:-22,energy:-2,joy:3,hygiene:-1},'NEXI comeu.'],['play','🎾','Brincar',{hunger:8,energy:-14,joy:18,hygiene:-3},'Vocês brincaram.'],['wash','🫧','Banho',{hunger:3,energy:-5,joy:4,hygiene:28},'NEXI tomou banho.'],['sleep','🌙','Dormir',{hunger:7,energy:30,joy:2,hygiene:-2},'NEXI dormiu.']];function c(x){return Math.max(0,Math.min(100,x))}function color(){let p=palettes[(generation-1)%palettes.length];document.documentElement.style.setProperty('--world',p[0]);document.documentElement.style.setProperty('--world2',p[1])}function stat(n,v){return `<span>${n}<b>${Math.round(v)}</b></span>`}function render(){gen.textContent='Geração '+String(generation).padStart(3,'0');need.innerHTML=stat('Fome',100-g.hunger)+stat('Energia',g.energy)+stat('Alegria',g.joy)+stat('Saúde',g.health)+stat('Higiene',g.hygiene)+stat('Vínculo',g.bond);actions.innerHTML=A.map(a=>`<button ${!g.alive?'disabled':''} onclick="act('${a[0]}')"><span>${a[1]}</span>${a[2]}</button>`).join('');let m=g.health<30?'Preciso de ajuda.':g.hunger<25?'Estou com fome.':g.energy<20?'Quero dormir.':g.hygiene<25?'Quero um banho.':g.joy<25?'Quero brincar.':g.social>75?'Gosto quando você aparece.':g.routine>75?'Você costuma fazer isso comigo.':g.curiosity>75?'Quero descobrir coisas.':'O que fazemos agora?';bubble.textContent=m;age.textContent='Vida: '+g.age+' ações';mood.textContent=g.alive?(g.curiosity>75?'Curioso':g.social>75?'Sociável':g.independence>75?'Independente':'Descobrindo'):'Fim da vida';memory.innerHTML=g.discoveries.length?'<strong>Descobertas:</strong> '+g.discoveries.join(' · '):'<strong>Memória:</strong> ainda estou descobrindo seus padrões.';petImg.src=petUrls[(generation-1)%petUrls.length];petImg.alt='NEXI geração '+generation;pet.className='pet '+(g.joy>70?'happy':'')+(g.health<30?' sad':'');event.textContent=g.history[0]||'NEXI nasceu.'}function note(x){g.history.unshift(x);g.history=g.history.slice(0,20)}function act(id){if(!g.alive)return;let a=A.find(x=>x[0]===id);for(let k in a[3])g[k]=c(g[k]+a[3][k]);g.age++;g.hunger=c(g.hunger-4);g.energy=c(g.energy-2);g.hygiene=c(g.hygiene-2);g.joy=c(g.joy-1);g.streak=g.last===id?g.streak+1:1;g.last=id;g.bond=c(g.bond+(id==='play'?3:id==='feed'?1:0));g.social=c(g.social+(id==='play'?2:-.2));g.independence=c(g.independence+(id==='sleep'?1:-.1));g.routine=c(g.routine+(g.streak>1?2:-.4));g.curiosity=c(g.curiosity+(id==='play'?1.5:0));g.health=c(g.health+((g.hunger>15&&g.energy>10&&g.hygiene>15&&g.joy>15)?1:-4));note(a[4]);if(g.streak===3)note('NEXI percebeu uma rotina.');if(g.streak===5&&!g.discoveries.includes(a[2])){g.discoveries.push(a[2]);g.curiosity=c(g.curiosity+8);note('NEXI descobriu uma preferência por '+a[2].toLowerCase()+'.')}if(g.health<=0){g.alive=false;note('NEXI chegou ao fim desta geração.')}save();render()}function save(){localStorage.setItem(KEY,JSON.stringify(g))}function load(){let x=localStorage.getItem(KEY);if(x)g=JSON.parse(x);render()}function closeIntro(){intro.style.display='none';save()}function resetGame(){if(confirm('Começar uma nova geração?')){generation++;localStorage.setItem(GENKEY,generation);g={age:0,hunger:62,energy:70,joy:55,hygiene:68,bond:10,health:100,curiosity:50,social:50,independence:50,routine:50,last:null,streak:0,history:[],alive:true,discoveries:[]};color();intro.style.display='grid';render()}}window.resetGame=resetGame;color();load();if(!localStorage.getItem(KEY))intro.style.display='grid';</script></body></html>
