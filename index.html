<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NEXI</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:16px system-ui,sans-serif}body{display:flex;justify-content:center;background:#87964b;color:#26351f}.game{width:min(100%,520px);min-height:100vh;padding:12px 12px 105px;background:linear-gradient(#b8c77a,#93a752 42%,#71863d);position:relative}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;letter-spacing:.14em;font-size:1.55rem}.gen{background:#f8f5dcdd;border-radius:99px;padding:6px 10px;font-size:.75rem;font-weight:900}.needs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}.need{background:#f8f5dc99;border:1px solid #fff8;border-radius:11px;padding:5px 7px;font-size:.65rem}.bar{height:9px;background:#66744455;border-radius:99px;overflow:hidden;margin-top:4px}.fill{height:100%;background:#f7f0bc;border-radius:99px;transition:width .3s}.habitat{height:410px;position:relative;border-radius:30px;border:2px solid #fff8;overflow:hidden;background:linear-gradient(#d9e69a55,#ffffff08);box-shadow:inset 0 -90px 0 #526b2c55;touch-action:none}.habitat:before{content:"";position:absolute;bottom:-45px;left:-10%;width:120%;height:125px;background:#4f682b99;border-radius:50% 50% 0 0}.sun{position:absolute;top:25px;left:28px;width:48px;height:48px;border-radius:50%;background:#f8df7caa}.cloud{position:absolute;top:55px;right:35px;font-size:46px;opacity:.42}.object{position:absolute;z-index:4;user-select:none}.plant{font-size:58px;left:7%;bottom:34px}.ball{font-size:45px;right:10%;bottom:34px}.bowl{font-size:42px;left:45%;bottom:26px}.pet{position:absolute;left:50%;top:48%;width:210px;height:210px;transform:translate(-50%,-50%);display:grid;place-items:center;z-index:10;animation:breathe 2.7s ease-in-out infinite;touch-action:none;cursor:grab;user-select:none}.pet.dragging{animation:none;cursor:grabbing;filter:drop-shadow(0 18px 8px #26351466) scale(1.06)}.pet img{width:205px;height:205px;object-fit:contain;filter:drop-shadow(0 14px 7px #26351455);pointer-events:none}.fallback{font-size:125px}.bubble{position:absolute;z-index:12;top:12px;right:9px;max-width:215px;background:#fffdf0;border:2px solid #fffa;border-radius:17px 17px 4px 17px;padding:9px 11px;box-shadow:0 5px 15px #26351425;font-size:.8rem}.event{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:15;background:#26351ddd;color:#fff;border-radius:99px;padding:6px 12px;font-size:.7rem;white-space:nowrap}.memory{background:#ffffff3b;border-radius:14px;padding:9px 11px;font-size:.74rem;color:#fffde8;margin-top:8px}.actions{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 9px calc(8px + env(safe-area-inset-bottom));background:#f6f1dff5;backdrop-filter:blur(12px);border-top:2px solid #fff;z-index:20}.actions button{border:1px solid #c9c5a9;background:#fffdf1;color:#26311f;border-radius:15px;min-height:64px;font-weight:850;font-size:.68rem}.actions button span{display:block;font-size:1.45rem}.gameover{position:fixed;inset:0;background:#1e291dcc;z-index:50;display:none;align-items:center;justify-content:center;padding:18px}.gamebox{width:min(94%,480px);background:#f8f5df;border-radius:24px;padding:18px;text-align:center}.arena{height:260px;background:#d8e39b;border-radius:18px;position:relative;overflow:hidden;touch-action:none;margin:12px 0}.runner{position:absolute;left:35px;bottom:25px;font-size:48px;z-index:3}.ob{position:absolute;bottom:25px;right:-50px;font-size:42px}.jump{animation:jump .48s ease}@keyframes jump{50%{transform:translateY(-85px)}}@keyframes breathe{50%{transform:translate(-50%,-54%) scale(1.03)}}.gamebox button{border:0;border-radius:12px;padding:11px 16px;font-weight:800}@media(max-height:700px){.habitat{height:330px}}@media(max-width:360px){.habitat{height:300px}.actions button{min-height:58px}}</style></head><body><main class="game"><div class="top"><div class="brand">NEXI</div><div class="gen" id="gen"></div></div><div class="needs" id="needs"></div><section class="habitat" id="habitat"><div class="sun"></div><div class="cloud">☁️</div><div class="bubble" id="bubble">Arraste-me!</div><div class="object plant">🌿</div><div class="object ball">🎾</div><div class="object bowl">🥣</div><div class="pet" id="pet"><img id="petImg" alt="NEXI"><div id="fallback" class="fallback" hidden>🐰</div></div><div class="event" id="event">Arraste NEXI pelo jardim!</div></section><div class="memory" id="memory"></div><nav class="actions" id="actions"></nav><div class="gameover" id="gameover"><div class="gamebox"><h2 id="gameTitle">Brincadeira!</h2><div id="gameText"></div><div class="arena" id="arena"><div class="runner" id="runner">🐰</div></div><button id="closeBtn" onclick="closeGame()">Voltar para NEXI</button></div></div></main><script>const KEY='nexi-v8-state',GEN='nexi-generation';const pets=['rabbit','pig','panda','monkey','penguin','parrot'];const urls=pets.map(x=>`https://raw.githubusercontent.com/ETdoFresh/kenney.nl/master/kenney-animalpack/PNG/Round%20(outline)/${x}.png`);let generation=+(localStorage.getItem(GEN)||1);let g={age:0,hunger:62,energy:70,joy:55,hygiene:68,bond:10,health:100,history:[],alive:true};const A=[['feed','🍎','Comer'],['play','🎾','Brincar'],['wash','🫧','Banho'],['sleep','🌙','Dormir']];const $=id=>document.getElementById(id),clamp=x=>Math.max(0,Math.min(100,x));function load(){try{g=Object.assign(g,JSON.parse(localStorage.getItem(KEY))||{})}catch(e){}}function save(){localStorage.setItem(KEY,JSON.stringify(g))}function render(){gen.textContent='Geração '+String(generation).padStart(3,'0');needs.innerHTML=[['Fome',100-g.hunger],['Energia',g.energy],['Alegria',g.joy],['Saúde',g.health],['Higiene',g.hygiene],['Vínculo',g.bond]].map(([n,v])=>`<div class="need">${n}<div class="bar"><div class="fill" style="width:${clamp(v)}%"></div></div></div>`).join('');actions.innerHTML=A.map(a=>`<button onclick="act('${a[0]}')"><span>${a[1]}</span>${a[2]}</button>`).join('');bubble.textContent=g.hunger<25?'Estou com fome!':g.energy<20?'Quero dormir!':g.joy<25?'Vamos brincar!':'Arraste-me pelo jardim!';memory.innerHTML='<b>Memória:</b> '+(g.history[0]||'NEXI ainda está conhecendo você.');const img=$('petImg');img.onerror=()=>{img.hidden=true;fallback.hidden=false};img.src=urls[(generation-1)%urls.length]}function act(id){if(id==='play'){startMiniGame();return}g.age++;if(id==='feed')g.hunger=clamp(g.hunger+22);if(id==='wash')g.hygiene=clamp(g.hygiene+28);if(id==='sleep')g.energy=clamp(g.energy+30);g.joy=clamp(g.joy+2);g.bond=clamp(g.bond+1);g.history.unshift(A.find(a=>a[0]===id)[2]+' feito!');g.history=g.history.slice(0,12);save();render()}function startMiniGame(){const type=['jump','catch','tap'][Math.floor(Math.random()*3)];gameover.style.display='flex';if(type==='jump')jumpGame();if(type==='catch')catchGame();if(type==='tap')tapGame()}function base(title,text){gameTitle.textContent=title;gameText.textContent=text;arena.innerHTML='<div class="runner" id="runner">🐰</div>';closeBtn.textContent='Voltar para NEXI'}function jumpGame(){base('NEXI RUN','Toque na tela para pular. Evite os cactos!');let running=true,score=0,spawn;const jump=()=>{if(!running)return;runner.classList.remove('jump');void runner.offsetWidth;runner.classList.add('jump')};arena.onclick=jump;function add(){if(!running)return;const o=document.createElement('div');o.className='ob';o.textContent='🌵';arena.appendChild(o);let x=arena.clientWidth+20;o.style.left=x+'px';const timer=setInterval(()=>{x-=6;o.style.left=x+'px';const rr=runner.getBoundingClientRect(),or=o.getBoundingClientRect();if(or.left<rr.right&&or.right>rr.left&&or.top<rr.bottom&&or.bottom>rr.top&&!runner.classList.contains('jump')){running=false;clearInterval(timer);clearTimeout(spawn);gameText.textContent='Fim! Você fez '+score+' ponto(s).';closeBtn.textContent='Voltar';return}if(x<-60){clearInterval(timer);o.remove();score++;spawn=setTimeout(add,450)}},30)}add()}function catchGame(){base('NEXI CAÇA','Toque no NEXI antes que ele mude de lugar!');let n=0;function place(){if(n>=8){g.joy=clamp(g.joy+14);g.bond=clamp(g.bond+4);g.history.unshift('NEXI adorou o pega-pega!');save();render();gameText.textContent='Você venceu!';return}runner.style.left=(15+Math.random()*70)+'%';runner.style.bottom=(15+Math.random()*65)+'%';runner.onclick=()=>{n++;gameText.textContent='Acertos: '+n+'/8';place()}}place()}function tapGame(){base('NEXI POP','Toque o máximo que puder em 10 segundos!');let n=0,over=false;runner.textContent='💚';runner.style.left='50%';runner.style.top='50%';runner.style.transform='translate(-50%,-50%)';runner.onclick=()=>{if(over)return;n++;gameText.textContent='Toques: '+n;runner.style.left=(20+Math.random()*60)+'%';runner.style.top=(20+Math.random()*60)+'%'};setTimeout(()=>{over=true;g.joy=clamp(g.joy+Math.min(20,n*2));g.bond=clamp(g.bond+Math.min(5,n));g.history.unshift('NEXI brincou com você!');save();render();gameText.textContent='Tempo! '+n+' toques.'},10000)}function closeGame(){gameover.style.display='none';arena.onclick=null}let drag=false,dx=0,dy=0;pet.addEventListener('pointerdown',e=>{drag=true;pet.classList.add('dragging');pet.setPointerCapture(e.pointerId);const r=pet.getBoundingClientRect();dx=e.clientX-(r.left+r.width/2);dy=e.clientY-(r.top+r.height/2);e.preventDefault()});pet.addEventListener('pointermove',e=>{if(!drag)return;const r=habitat.getBoundingClientRect(),half=pet.offsetWidth/2;let x=e.clientX-r.left-dx,y=e.clientY-r.top-dy;x=Math.max(half,Math.min(r.width-half,x));y=Math.max(half,Math.min(r.height-half,y));pet.style.left=x+'px';pet.style.top=y+'px';pet.style.transform='translate(-50%,-50%)'});pet.addEventListener('pointerup',e=>{drag=false;pet.classList.remove('dragging');try{pet.releasePointerCapture(e.pointerId)}catch(_){} });pet.addEventListener('pointercancel',()=>{drag=false;pet.classList.remove('dragging')});load();render();</script></body></html>
