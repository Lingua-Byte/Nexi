<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Nexi Drive</title>
<style>
  :root {
    --bg: #f4f6fb; --card: #ffffff; --text: #0f172a; --muted: #64748b;
    --line: #e2e8f0; --accent: #6366f1; --accent-2: #22c55e; --danger: #ef4444;
    --drop: #eef2ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1020; --card: #141a2e; --text: #e5e7eb; --muted: #94a3b8;
      --line: #263049; --accent: #818cf8; --accent-2: #4ade80; --danger: #f87171;
      --drop: #1b2340;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100vh; padding: max(16px, env(safe-area-inset-top)) 16px 32px; }
  main { max-width: 720px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; display: flex; align-items: center; gap: 10px; }
  h1 .logo { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; font-size: 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
  .muted { color: var(--muted); }
  button, .btn { font: inherit; border: 0; border-radius: 12px; padding: 12px 18px; cursor: pointer;
    background: var(--accent); color: #fff; font-weight: 600; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 8px 12px; }
  button:disabled { opacity: .5; cursor: default; }
  input { font: inherit; width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: 22px; letter-spacing: 4px; text-transform: uppercase;
    text-align: center; font-weight: 700; }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }

  /* tela do código */
  #login h2 { margin: 0 0 6px; font-size: 20px; }
  #login p { margin: 0 0 18px; line-height: 1.5; }
  .row { display: flex; gap: 10px; margin-top: 12px; }
  .row > * { flex: 1; }
  .error { color: var(--danger); min-height: 1.3em; margin-top: 10px; font-size: 14px; }

  /* drive */
  .code-pill { font-weight: 700; letter-spacing: 2px; background: var(--drop); color: var(--accent);
    padding: 6px 12px; border-radius: 999px; font-size: 14px; }
  #drop { border: 2px dashed var(--line); border-radius: 18px; padding: 36px 16px; text-align: center;
    background: var(--card); transition: .15s; cursor: pointer; user-select: none; }
  #drop .big { font-size: 42px; line-height: 1; }
  #drop strong { display: block; font-size: 18px; margin: 10px 0 4px; }
  body.dragging #drop { border-color: var(--accent); background: var(--drop); transform: scale(1.01); }
  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 14px 2px 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--accent-2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent-2) 25%, transparent); }

  ul { list-style: none; margin: 0; padding: 0; }
  li.file { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px;
    background: var(--card); border: 1px solid var(--line); margin-bottom: 8px; }
  .icon { width: 42px; height: 42px; flex: none; border-radius: 10px; background: var(--drop);
    display: grid; place-items: center; font-size: 20px; overflow: hidden; }
  .icon img { width: 100%; height: 100%; object-fit: cover; }
  .info { flex: 1; min-width: 0; }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .actions { display: flex; gap: 6px; }
  .actions a, .actions button { width: 40px; height: 40px; padding: 0; border-radius: 10px; display: grid;
    place-items: center; text-decoration: none; font-size: 18px; background: var(--drop); color: var(--text); }
  .actions .del:hover { background: var(--danger); color: #fff; }
  .bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .1s; }
  .empty { text-align: center; padding: 28px 10px; }
  .hidden { display: none !important; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text);
    color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; transition: .2s;
    pointer-events: none; max-width: calc(100% - 32px); }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<main>
  <header>
    <h1><span class="logo">⇅</span> Nexi Drive</h1>
    <div id="who" class="hidden" style="display:flex;gap:8px;align-items:center">
      <span class="code-pill" id="codeLabel"></span>
      <button class="ghost" id="logout" title="Trocar código">Sair</button>
    </div>
  </header>

  <!-- Tela 1: digitar o código -->
  <section id="login" class="card">
    <h2>Digite seu código</h2>
    <p class="muted">Use o <b>mesmo código</b> no celular e no computador. Tudo que você colocar aqui aparece
      no outro aparelho na hora.</p>
    <form id="codeForm">
      <input id="codeInput" autocomplete="off" autocapitalize="characters" spellcheck="false"
             maxlength="64" placeholder="EX: CASA2024">
      <div class="row">
        <button type="button" class="ghost" id="random">Gerar código</button>
        <button type="submit">Entrar</button>
      </div>
      <div class="error" id="codeError"></div>
    </form>
  </section>

  <!-- Tela 2: o drive -->
  <section id="drive" class="hidden">
    <div id="drop" role="button" tabindex="0">
      <div class="big">📂</div>
      <strong>Arraste os arquivos para cá</strong>
      <span class="muted">ou toque para escolher</span>
    </div>
    <input type="file" id="picker" multiple hidden>

    <div class="status muted"><span class="dot" id="dot"></span><span id="statusText">Conectando…</span></div>

    <ul id="uploads"></ul>
    <ul id="files"></ul>
    <div id="empty" class="empty muted hidden">Nenhum arquivo ainda. Envie algo de um dos aparelhos.</div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
let code = null;
let events = null;

// ---------- utilidades ----------
function fmtSize(b) {
  const u = ['B', 'KB', 'MB', 'GB'];
  let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return `${b.toFixed(i && b < 10 ? 1 : 0)} ${u[i]}`;
}
function fmtTime(t) {
  const d = new Date(t), now = new Date();
  const same = d.toDateString() === now.toDateString();
  return same ? d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
              : d.toLocaleDateString('pt-BR');
}
function iconFor(name) {
  const ext = name.split('.').pop().toLowerCase();
  if (['jpg','jpeg','png','gif','webp','heic','bmp','svg'].includes(ext)) return '🖼️';
  if (['mp4','mov','mkv','avi','webm','3gp'].includes(ext)) return '🎬';
  if (['mp3','wav','ogg','m4a','flac','aac','opus'].includes(ext)) return '🎵';
  if (['pdf'].includes(ext)) return '📕';
  if (['zip','rar','7z','tar','gz'].includes(ext)) return '🗜️';
  if (['doc','docx','txt','odt','rtf','md'].includes(ext)) return '📝';
  if (['xls','xlsx','csv','ods'].includes(ext)) return '📊';
  if (['apk','exe','msi','dmg'].includes(ext)) return '📦';
  return '📄';
}
const isImage = (n) => /\.(jpe?g|png|gif|webp|bmp)$/i.test(n);
function api(path, params = {}) {
  const q = new URLSearchParams({ code, ...params });
  return `/api/${path}?${q}`;
}
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2500);
}
function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }
function load(k) { try { return localStorage.getItem(k); } catch { return null; } }

// ---------- código ----------
$('#random').onclick = () => {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const arr = crypto.getRandomValues(new Uint32Array(8));
  $('#codeInput').value = Array.from(arr, (n) => chars[n % chars.length]).join('');
};
$('#codeForm').onsubmit = (e) => {
  e.preventDefault();
  const v = $('#codeInput').value.trim().toUpperCase();
  if (!/^[A-Z0-9_-]{4,64}$/.test(v)) {
    $('#codeError').textContent = 'Use pelo menos 4 letras ou números (sem espaços).';
    return;
  }
  enter(v);
};
$('#logout').onclick = () => {
  store('nexi-drive-code', null);
  if (events) events.close();
  code = null;
  $('#drive').classList.add('hidden'); $('#who').classList.add('hidden');
  $('#login').classList.remove('hidden');
  $('#codeInput').value = '';
};

function enter(c) {
  code = c;
  store('nexi-drive-code', c);
  $('#codeError').textContent = '';
  $('#codeLabel').textContent = c;
  $('#login').classList.add('hidden');
  $('#drive').classList.remove('hidden'); $('#who').classList.remove('hidden');
  connect();
}

// ---------- tempo real ----------
function connect() {
  if (events) events.close();
  events = new EventSource(api('events'));
  events.onopen = () => setStatus(true);
  events.onmessage = (e) => render(JSON.parse(e.data));
  events.onerror = () => setStatus(false); // o navegador reconecta sozinho
}
function setStatus(on) {
  $('#dot').classList.toggle('on', on);
  $('#statusText').textContent = on ? 'Conectado — atualiza sozinho nos dois aparelhos' : 'Reconectando…';
}

let lastNames = new Set();
const sentHere = new Set(); // não avisa "Chegou" para o que este aparelho enviou
function render(files) {
  const ul = $('#files');
  ul.innerHTML = '';
  $('#empty').classList.toggle('hidden', files.length > 0);
  const fresh = files.filter((f) => !lastNames.has(f.name) && !sentHere.has(f.name.replace(/ \(\d+\)(?=\.[^.]*$|$)/, '')));
  if (lastNames.size && fresh.length) toast(`Chegou: ${fresh[0].name}${fresh.length > 1 ? ` (+${fresh.length - 1})` : ''}`);
  lastNames = new Set(files.map((f) => f.name));

  for (const f of files) {
    const li = document.createElement('li');
    li.className = 'file';
    const icon = document.createElement('div');
    icon.className = 'icon';
    if (isImage(f.name) && f.size < 15 * 1024 * 1024) {
      const img = new Image();
      img.loading = 'lazy';
      img.src = api('download', { name: f.name, inline: 1 });
      img.onerror = () => { icon.textContent = iconFor(f.name); };
      icon.append(img);
    } else icon.textContent = iconFor(f.name);

    const info = document.createElement('div');
    info.className = 'info';
    const nm = document.createElement('div'); nm.className = 'name'; nm.textContent = f.name; nm.title = f.name;
    const meta = document.createElement('div'); meta.className = 'meta';
    meta.textContent = `${fmtSize(f.size)} · ${fmtTime(f.time)}`;
    info.append(nm, meta);

    const actions = document.createElement('div');
    actions.className = 'actions';
    const dl = document.createElement('a');
    dl.href = api('download', { name: f.name }); dl.download = f.name; dl.title = 'Baixar'; dl.textContent = '⬇️';
    const del = document.createElement('button');
    del.className = 'del'; del.title = 'Apagar'; del.textContent = '🗑️';
    del.onclick = async () => {
      if (!confirm(`Apagar "${f.name}" dos dois aparelhos?`)) return;
      const r = await fetch(api('file', { name: f.name }), { method: 'DELETE' });
      if (!r.ok) toast('Não foi possível apagar');
    };
    actions.append(dl, del);
    li.append(icon, info, actions);
    ul.append(li);
  }
}

// ---------- envio ----------
function upload(file) {
  sentHere.add(file.name);
  setTimeout(() => sentHere.delete(file.name), 60_000);
  const li = document.createElement('li');
  li.className = 'file';
  li.innerHTML = `<div class="icon">⏫</div><div class="info"><div class="name"></div>
    <div class="meta">Enviando…</div><div class="bar"><div></div></div></div>`;
  li.querySelector('.name').textContent = file.name;
  $('#uploads').prepend(li);
  const bar = li.querySelector('.bar > div');
  const meta = li.querySelector('.meta');

  return new Promise((resolve) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', api('upload', { name: file.name }));
    xhr.upload.onprogress = (e) => {
      if (!e.lengthComputable) return;
      const p = e.loaded / e.total;
      bar.style.width = `${p * 100}%`;
      meta.textContent = `${fmtSize(e.loaded)} de ${fmtSize(e.total)} · ${Math.round(p * 100)}%`;
    };
    xhr.onload = () => {
      if (xhr.status === 200) li.remove();
      else {
        let msg = 'Falha no envio';
        try { msg = JSON.parse(xhr.responseText).error || msg; } catch {}
        meta.textContent = msg; meta.style.color = 'var(--danger)';
        setTimeout(() => li.remove(), 5000);
      }
      resolve();
    };
    xhr.onerror = () => {
      meta.textContent = 'Sem conexão com o computador'; meta.style.color = 'var(--danger)';
      setTimeout(() => li.remove(), 5000);
      resolve();
    };
    xhr.send(file);
  });
}
async function uploadAll(list) {
  const files = Array.from(list).filter((f) => f.size > 0 || f.type);
  // envia 2 por vez
  const queue = files.slice();
  const worker = async () => { while (queue.length) await upload(queue.shift()); };
  await Promise.all([worker(), worker()]);
}

const drop = $('#drop');
const picker = $('#picker');
drop.onclick = () => picker.click();
drop.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); picker.click(); } };
picker.onchange = () => { uploadAll(picker.files); picker.value = ''; };

// arrastar em qualquer lugar da página
let dragDepth = 0;
window.addEventListener('dragenter', (e) => {
  if (!code || !e.dataTransfer.types.includes('Files')) return;
  e.preventDefault(); dragDepth++; document.body.classList.add('dragging');
});
window.addEventListener('dragover', (e) => { if (code) e.preventDefault(); });
window.addEventListener('dragleave', () => {
  if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); }
});
window.addEventListener('drop', (e) => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
  if (code && e.dataTransfer.files.length) uploadAll(e.dataTransfer.files);
});
// colar (Ctrl+V) uma imagem ou arquivo
window.addEventListener('paste', (e) => {
  if (code && e.clipboardData && e.clipboardData.files.length) uploadAll(e.clipboardData.files);
});

// entra direto se já havia um código salvo neste aparelho
const saved = load('nexi-drive-code');
if (saved) enter(saved);
</script>
</body>
</html>
