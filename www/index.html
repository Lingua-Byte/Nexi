<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0b10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEXI">
<meta name="description" content="Câmera com filtros e máscaras em tempo real.">
<title>NEXI</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#0b0b10;color:#f4f4f8;font:15px system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
.app{position:fixed;inset:0;display:flex;flex-direction:column}
.stage{flex:1;position:relative;display:grid;place-items:center;overflow:hidden;background:#000;min-height:0}
#out{max-width:100%;max-height:100%;display:block}
video,#gl{display:none}
.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:linear-gradient(#000a,#0000);z-index:3}
.brand{font-weight:900;letter-spacing:.14em}
.name{background:#ffffff22;backdrop-filter:blur(8px);padding:6px 12px;border-radius:99px;font-size:.8rem;font-weight:700;white-space:nowrap}
.rec{display:none;align-items:center;gap:6px;background:#e5243b;padding:6px 10px;border-radius:99px;font-size:.78rem;font-weight:800}
.rec.on{display:flex}.rec:before{content:"";width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1s infinite}
.msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;z-index:2}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
.flash.go{animation:flash .35s ease-out}
.toast{position:absolute;left:50%;bottom:14px;transform:translate(-50%,20px);opacity:0;background:#17171fee;border:1px solid #ffffff22;border-radius:99px;padding:8px 8px 8px 16px;display:flex;gap:10px;align-items:center;font-size:.85rem;font-weight:700;z-index:6;transition:all .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;border-radius:99px;padding:7px 12px;font-weight:800;background:#c6ff3d;color:#111}
.toast button:empty{display:none}
.panel{background:#0b0b10;padding:8px 0 calc(12px + env(safe-area-inset-bottom))}
.tabs{display:flex;justify-content:center;gap:6px;padding:0 0 8px}
.tabs button{border:0;background:#17171f;color:#999;border-radius:99px;padding:6px 14px;font-weight:800;font-size:.78rem}
.tabs button.on{background:#c6ff3d;color:#111}
.fx{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 10px;scroll-snap-type:x proximity;scrollbar-width:none}
.fx::-webkit-scrollbar{display:none}
.fx[hidden]{display:none}
.fx button{flex:0 0 auto;scroll-snap-align:center;border:2px solid #ffffff1f;background:#17171f;color:#ddd;border-radius:14px;padding:8px 10px;font-weight:700;font-size:.74rem;min-width:72px}
.fx button span{display:block;font-size:1.35rem;margin-bottom:2px}
.fx button.on{border-color:#c6ff3d;color:#fff;background:#22261a}
.slider{display:flex;align-items:center;gap:10px;padding:0 18px 8px;font-size:.75rem;color:#aaa}
.slider input{flex:1;accent-color:#c6ff3d}
.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 22px}
.round{width:52px;height:52px;border-radius:50%;border:0;background:#1d1d26;color:#fff;font-size:1.3rem;display:grid;place-items:center}
.round:active,.shutter:active{transform:scale(.92)}
.left{display:flex;gap:10px}.right{display:flex;gap:10px;justify-content:flex-end}
.shutter{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:#fff3;padding:0;transition:transform .1s}
.shutter i{display:block;margin:auto;width:56px;height:56px;border-radius:50%;background:#fff;transition:all .2s}
.shutter.video i{background:#e5243b}
.shutter.video.recording i{width:28px;height:28px;border-radius:7px}
.mode{display:flex;justify-content:center;gap:18px;padding-bottom:8px;font-size:.78rem;font-weight:800;letter-spacing:.08em}
.mode button{background:none;border:0;color:#777;font:inherit;padding:4px}
.mode button.on{color:#c6ff3d}
.thumb{width:52px;height:52px;border-radius:12px;border:2px solid #fff4;background:#1d1d26 center/cover;display:grid;place-items:center;font-size:1.3rem;text-decoration:none}
.overlay{position:fixed;inset:0;background:#0b0b10f7;z-index:10;display:none;flex-direction:column}
.overlay.open{display:flex}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;font-weight:800}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:max-content;gap:4px;padding:4px}
.grid button{position:relative;aspect-ratio:3/4;background:#1d1d26;border:0;padding:0;border-radius:6px;overflow:hidden}
.grid img,.grid video{width:100%;height:100%;object-fit:cover;display:block}
.grid b{position:absolute;bottom:4px;right:6px;font-size:.9rem}
.viewer{flex:1;display:grid;place-items:center;min-height:0;padding:8px}
.viewer img,.viewer video{max-width:100%;max-height:100%;border-radius:10px}
.empty{grid-column:1/-1;text-align:center;color:#888;padding:40px}
button.pill{border:0;border-radius:99px;padding:10px 16px;font-weight:800;background:#c6ff3d;color:#111}
button.pill.dark{background:#1d1d26;color:#fff}
.install{display:none;border:0;border-radius:99px;padding:6px 12px;font-weight:800;font-size:.78rem;background:#c6ff3d;color:#111}
.install.show{display:block}
.sheet{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));background:#17171f;border:1px solid #ffffff22;border-radius:18px;padding:16px;z-index:20;display:none;font-size:.9rem;line-height:1.45}
.sheet.open{display:block}
.sheet b{color:#c6ff3d}
@keyframes blink{50%{opacity:.2}}
@keyframes flash{from{opacity:.85}to{opacity:0}}
</style>
</head>
<body>
<div class="app">
  <section class="stage" id="stage">
    <div class="top"><div class="brand">NEXI</div><div class="rec" id="rec">00:00</div><div style="display:flex;gap:8px;align-items:center"><button class="install" id="installBtn">⬇ Instalar</button><div class="name" id="fxName">Normal</div></div></div>
    <canvas id="out"></canvas>
    <canvas id="gl"></canvas>
    <video id="video" playsinline muted></video>
    <div class="msg" id="msg"><div><div style="font-size:3rem">📷</div><p>Toque para ligar a câmera.</p><button class="pill" id="startBtn">Ligar câmera</button></div></div>
    <div class="flash" id="flash"></div>
    <div class="toast" id="toast"><span id="toastText"></span><button id="toastBtn"></button></div>
  </section>
  <section class="panel">
    <div class="tabs"><button id="tFilters" class="on">FILTROS</button><button id="tMasks">MÁSCARAS</button></div>
    <div class="fx" id="fx"></div>
    <div class="fx" id="masks" hidden></div>
    <div class="slider" id="sliderRow"><span>Intensidade</span><input id="amount" type="range" min="0" max="1" step="0.01" value="0.6"></div>
    <div class="mode"><button id="mPhoto" class="on">FOTO</button><button id="mVideo">VÍDEO</button></div>
    <div class="controls">
      <div class="left"><a class="thumb" id="thumb" href="#" aria-label="Galeria"></a></div>
      <button class="shutter" id="shutter" aria-label="Capturar"><i></i></button>
      <div class="right"><button class="round" id="flip" aria-label="Trocar câmera">🔄</button></div>
    </div>
  </section>
</div>
<div class="overlay" id="gallery">
  <div class="ghead"><span>Capturas</span><button class="pill" id="closeGal">Fechar</button></div>
  <div class="grid" id="grid"></div>
</div>
<div class="overlay" id="viewerBox">
  <div class="ghead"><button class="pill dark" id="closeView">‹ Voltar</button><button class="pill" id="shareView">Compartilhar</button></div>
  <div class="viewer" id="viewer"></div>
</div>
<div class="sheet" id="iosSheet"><b>Instalar o NEXI no iPhone</b><br>1. Toque em <b>Compartilhar</b> (□↑) no Safari<br>2. Escolha <b>Adicionar à Tela de Início</b><br>3. Toque em <b>Adicionar</b><div style="text-align:right;margin-top:10px"><button class="pill" id="iosClose">Entendi</button></div></div>
<script>
const $=id=>document.getElementById(id);
const out=$('out'),ctx=out.getContext('2d'),glc=$('gl'),video=$('video');
const gl=glc.getContext('webgl',{preserveDrawingBuffer:true});
const Cap=window.Capacitor,native=!!(Cap&&Cap.isNativePlatform&&Cap.isNativePlatform());
const Gallery=native?(Cap.Plugins.NexiGallery||Cap.registerPlugin('NexiGallery')):null;

// ================= FILTROS (fragment shaders) =================
// uniforms: t tempo, a intensidade, res resolução, eL/eR/er olhos (máscara "olhos grandes")
const HEAD=`precision mediump float;varying vec2 uv;uniform sampler2D tex;uniform float t,a,er;uniform vec2 res,eL,eR;
vec2 wp(vec2 p){if(er<=0.)return p;vec2 k=vec2(res.x/res.y,1.);for(int i=0;i<2;i++){vec2 e=i==0?eL:eR;float r=length((p-e)*k)/er;if(r<1.)p=e+(p-e)*mix(.5,1.,smoothstep(0.,1.,r));}return p;}
vec3 px(vec2 p){return texture2D(tex,clamp(wp(p),0.,1.)).rgb;}
float lum(vec3 c){return dot(c,vec3(.299,.587,.114));}
vec3 sat(vec3 c,float s){return mix(vec3(lum(c)),c,s);}
vec3 con(vec3 c,float k){return (c-.5)*k+.5;}
float vig(float k){return 1.-k*smoothstep(.3,.85,distance(uv,vec2(.5)));}
float rnd(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
`;
const FX=[
 ['Normal','🙂',`void main(){gl_FragColor=vec4(px(uv),1.);}`],
 ['Verão','☀️',`void main(){vec3 c=px(uv);vec3 f=sat(con(c,1.15),1.35)*vec3(1.06,1.01,.9);gl_FragColor=vec4(mix(c,f,a),1.);}`],
 ['Dourado','🌅',`void main(){vec3 c=px(uv);vec3 f=con(c*vec3(1.14,.99,.76)+vec3(.05,.025,0.),1.05)*vig(.25);gl_FragColor=vec4(mix(c,f,a),1.);}`],
 ['Brisa','🌬️',`void main(){vec3 c=px(uv);vec3 f=con(sat(c,.75),.88)*vec3(.93,1.,1.08)+.05;gl_FragColor=vec4(mix(c,f,a),1.);}`],
 ['Pastel','🍬',`void main(){vec3 c=px(uv);vec3 f=sat(c,.65)*.78+vec3(.21,.17,.2);gl_FragColor=vec4(mix(c,f,a),1.);}`],
 ['Cinema','🎬',`void main(){vec3 c=px(uv);float l=lum(c);vec3 f=con(c+mix(vec3(-.06,.04,.09),vec3(.1,.02,-.08),l)*1.6,1.12);f=mix(c,f,a);float bar=step(.5-.07*a,abs(uv.y-.5));gl_FragColor=vec4(f*(1.-bar),1.);}`],
 ['Lomo','📸',`void main(){vec3 c=px(uv);vec3 f=sat(con(c,1.3),1.4)*vec3(1.,1.05,.88)*vig(.75);gl_FragColor=vec4(mix(c,f,a),1.);}`],
 ['Beleza','✨',`void main(){vec3 c=px(uv);vec3 s=vec3(0.);float w=0.;vec2 e=2.5/res*(res.y/720.);for(int i=-2;i<=2;i++)for(int j=-2;j<=2;j++){vec3 q=px(uv+vec2(float(i),float(j))*e);float k=exp(-dot(q-c,q-c)*45.);s+=q*k;w+=k;}s/=w;vec3 f=con(mix(c,s,.85),1.04)*1.03+.02;gl_FragColor=vec4(mix(c,f,.3+.7*a),1.);}`],
 ['P&B','⚫',`void main(){vec3 c=px(uv);float l=lum(c);l=mix(l,smoothstep(.1,.9,l),a);gl_FragColor=vec4(vec3(l),1.);}`],
 ['Sépia','🟤',`void main(){vec3 c=px(uv);vec3 s=vec3(dot(c,vec3(.393,.769,.189)),dot(c,vec3(.349,.686,.168)),dot(c,vec3(.272,.534,.131)));gl_FragColor=vec4(mix(c,s,.4+.6*a)*vig(.5*a),1.);}`],
 ['Vintage','🎞️',`void main(){vec3 c=px(uv);c=pow(c,vec3(1.1,1.,.85));c=mix(c,vec3(lum(c)),.25);c+=vec3(.08,.04,-.02);c+=(rnd(uv*res+t)-.5)*.12*a;gl_FragColor=vec4(c*vig(.7*a),1.);}`],
 ['Duotone','🎨',`void main(){float l=smoothstep(.1,.9,lum(px(uv)));vec3 c1=vec3(.15,.05,.45),c2=mix(vec3(1.,.45,.6),vec3(.78,1.,.24),a);gl_FragColor=vec4(mix(c1,c2,l),1.);}`],
 ['Neon','💡',`void main(){vec2 e=1.5/res;float gx=lum(px(uv+vec2(e.x,0)))-lum(px(uv-vec2(e.x,0)));float gy=lum(px(uv+vec2(0,e.y)))-lum(px(uv-vec2(0,e.y)));float g=length(vec2(gx,gy))*(3.+a*8.);vec3 col=.5+.5*cos(6.28*(uv.x+uv.y+t*.2)+vec3(0,2,4));gl_FragColor=vec4(col*g+px(uv)*.15*(1.-a),1.);}`],
 ['Quadrinhos','💥',`void main(){vec3 c=px(uv);float n=3.+floor((1.-a)*5.);c=floor(c*n+.5)/n;vec2 e=1./res;float g=abs(lum(px(uv+e))-lum(px(uv-e)))*8.;vec2 d=fract(uv*res/6.)-.5;float dt=step(length(d),.35+lum(c)*.3);c*=mix(1.,.75+.25*dt,a);gl_FragColor=vec4(c*(1.-step(.35,g)),1.);}`],
 ['Pixel','👾',`void main(){float s=4.+a*36.;vec2 p=(floor(uv*res/s)+.5)*s/res;gl_FragColor=vec4(floor(px(p)*6.)/6.,1.);}`],
 ['Glitch','📺',`void main(){vec2 p=uv;float line=floor(uv.y*40.);float j=step(.92-a*.1,rnd(vec2(line,floor(t*12.))));p.x+=(rnd(vec2(line,t))-.5)*.15*j*a;float o=.004+.02*a;vec3 c=vec3(px(p+vec2(o,0)).r,px(p).g,px(p-vec2(o,0)).b);c*=.9+.1*sin(uv.y*res.y*1.5);c+=(rnd(uv*res+t)-.5)*.08;gl_FragColor=vec4(c,1.);}`],
 ['Térmica','🔥',`void main(){float l=lum(px(uv));vec3 c=mix(vec3(0,0,.4),vec3(.6,0,.8),smoothstep(0.,.3,l));c=mix(c,vec3(1,.2,0),smoothstep(.3,.6,l));c=mix(c,vec3(1,1,.3),smoothstep(.6,.9,l));gl_FragColor=vec4(mix(px(uv),c,.4+.6*a),1.);}`],
 ['Negativo','🔁',`void main(){vec3 c=px(uv);gl_FragColor=vec4(mix(c,1.-c,a*.7+.3),1.);}`],
 ['Espelho','🪞',`void main(){vec2 p=uv;p.x=p.x>.5?1.-p.x:p.x;if(a>.5)p.y=p.y>.5?1.-p.y:p.y;gl_FragColor=vec4(px(p),1.);}`],
 ['Caleidoscópio','🔮',`void main(){vec2 p=uv-.5;p.x*=res.x/res.y;float r=length(p),an=atan(p.y,p.x)+t*.15;float n=3.+floor(a*9.);float s=6.2832/n;an=abs(mod(an,s)-s*.5);p=vec2(cos(an),sin(an))*r;p.x/=res.x/res.y;gl_FragColor=vec4(px(p+.5),1.);}`],
 ['Ondas','🌊',`void main(){vec2 p=uv;p.x+=sin(uv.y*25.+t*3.)*.02*a;p.y+=cos(uv.x*20.+t*2.)*.015*a;gl_FragColor=vec4(px(p),1.);}`],
 ['Olho de peixe','🐟',`void main(){vec2 p=uv-.5;float r=length(p);p*=1.+a*1.2*(r*r-.25);gl_FragColor=vec4(px(p+.5)*smoothstep(.75,.6,r),1.);}`],
 ['ASCII','🔤',`float ch(float l,vec2 p){p=floor(p*5.);float i=p.x+p.y*5.;float b=l>.8?11512810.:l>.6?13195790.:l>.45?15255086.:l>.3?4357252.:l>.15?4096.:0.;return mod(floor(b/exp2(i)),2.);}void main(){float s=6.+a*10.;vec2 c=floor(uv*res/s)*s/res;vec3 col=px(c+.5*s/res);float m=ch(lum(col),fract(uv*res/s));gl_FragColor=vec4(m*mix(vec3(.3,1.,.4),col*1.4,.5),1.);}`],
];
const VS=`attribute vec2 p;varying vec2 uv;uniform float mir;void main(){uv=p*.5+.5;uv.y=1.-uv.y;if(mir>.5)uv.x=1.-uv.x;gl_Position=vec4(p,0,1);}`;
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));return s}
const progs=FX.map(([,,fs])=>{const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,VS));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,HEAD+fs));gl.linkProgram(p);
  const u=n=>gl.getUniformLocation(p,n);return {p,loc:gl.getAttribLocation(p,'p'),t:u('t'),a:u('a'),res:u('res'),mir:u('mir'),eL:u('eL'),eR:u('eR'),er:u('er')}});
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
gl.bindTexture(gl.TEXTURE_2D,gl.createTexture());
[gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T].forEach(k=>gl.texParameteri(gl.TEXTURE_2D,k,gl.CLAMP_TO_EDGE));
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);

// ================= MÁSCARAS (detecção de rosto) =================
// Desenhadas em "unidades de rosto": origem entre os olhos, x ao longo dos olhos, y para baixo, 1 = largura do rosto.
const MASKS=[['Nenhuma','🚫'],['Óculos','🕶️'],['Cachorro','🐶'],['Gato','🐱'],['Coroa','👑'],['Corações','💕'],['Olhos grandes','👀'],['Blush','😊'],['Bigode','🥸'],['Arco-íris','🌈']];
let faceLM=null,smooth=[],lastTs=-1,fl=null,flLoading=null;
async function loadFaces(){
  if(fl||flLoading)return flLoading;
  toast('Carregando máscaras…');
  flLoading=(async()=>{
    const {FaceLandmarker,FilesetResolver}=await import('./vendor/mediapipe/vision_bundle.mjs');
    const files=await FilesetResolver.forVisionTasks(new URL('vendor/mediapipe/wasm',location.href).href);
    const opts=d=>({baseOptions:{modelAssetPath:new URL('vendor/mediapipe/face_landmarker.task',location.href).href,delegate:d},runningMode:'VIDEO',numFaces:3});
    try{fl=await FaceLandmarker.createFromOptions(files,opts('GPU'))}catch(e){fl=await FaceLandmarker.createFromOptions(files,opts('CPU'))}
    toast('Máscaras prontas! Mostre o rosto 🙂');
  })().catch(e=>{console.error(e);flLoading=null;toast('Não foi possível carregar as máscaras')});
  return flLoading;
}
function detect(){
  if(!fl||video.readyState<2)return;
  let ts=performance.now();if(ts<=lastTs)ts=lastTs+1;lastTs=ts;
  try{
    const r=fl.detectForVideo(video,ts),faces=r.faceLandmarks||[];
    smooth=faces.map((f,i)=>{const prev=smooth[i];return f.map((p,j)=>prev&&prev[j]?{x:prev[j].x*.45+p.x*.55,y:prev[j].y*.45+p.y*.55}:{x:p.x,y:p.y})});
  }catch(e){console.error(e)}
}
function frame(lm,W,H,mir){
  const P=i=>({x:(mir?1-lm[i].x:lm[i].x)*W,y:lm[i].y*H});
  let a=P(33),b=P(263);if(a.x>b.x)[a,b]=[b,a];
  const o={x:(a.x+b.x)/2,y:(a.y+b.y)/2},s=Math.hypot(P(234).x-P(454).x,P(234).y-P(454).y)||1;
  const len=Math.hypot(b.x-a.x,b.y-a.y)||1,ux={x:(b.x-a.x)/len,y:(b.y-a.y)/len},uy={x:-ux.y,y:ux.x};
  const L=i=>{const p=P(i),dx=p.x-o.x,dy=p.y-o.y;return {x:(dx*ux.x+dy*ux.y)/s,y:(dx*uy.x+dy*uy.y)/s}};
  return {o,s,ux,uy,L,P};
}
function heart(c,x,y,r){c.beginPath();c.moveTo(x,y+r*.35);c.bezierCurveTo(x-r*1.1,y-r*.45,x-r*.45,y-r*1.15,x,y-r*.45);c.bezierCurveTo(x+r*.45,y-r*1.15,x+r*1.1,y-r*.45,x,y+r*.35);c.fill()}
function ellipse(c,x,y,rx,ry,rot=0){c.beginPath();c.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot,0,7);c.fill()}
function drawMask(id,lm,W,H,mir,t){
  const F=frame(lm,W,H,mir),c=ctx,L=F.L;
  c.save();c.setTransform(F.ux.x*F.s,F.ux.y*F.s,F.uy.x*F.s,F.uy.y*F.s,F.o.x,F.o.y);
  const eyeA=L(33),eyeB=L(263),nose=L(1),noseB=L(2),lipT=L(0),mT=L(13),mB=L(14),top=L(10),chin=L(152),cheekA=L(50),cheekB=L(280);
  const mouth=Math.hypot(mB.x-mT.x,mB.y-mT.y);
  const lw=w=>c.lineWidth=w;
  if(id==='Óculos'){
    const g=c.createLinearGradient(0,-.12,0,.12);g.addColorStop(0,'#1b1b2a');g.addColorStop(1,'#3d2a5c');
    c.fillStyle=g;c.strokeStyle='#111';lw(.025);
    [-1,1].forEach(sd=>{const x=sd*.2;c.beginPath();c.roundRect(x-.17,-.11,.34,.23,.08);c.fill();c.stroke();
      c.fillStyle='#ffffff55';ellipse(c,x-.07,-.04,.05,.022,-.4);c.fillStyle=g});
    c.beginPath();c.moveTo(-.04,-.04);c.quadraticCurveTo(0,-.08,.04,-.04);c.stroke();
    c.beginPath();c.moveTo(-.36,-.05);c.lineTo(-.5,-.08);c.moveTo(.36,-.05);c.lineTo(.5,-.08);c.stroke();
  }
  if(id==='Cachorro'){
    c.fillStyle='#8b5a2b';[-1,1].forEach(sd=>{c.save();c.translate(sd*.47,top.y+.02);c.rotate(sd*.45);ellipse(c,0,.12,.13,.27);c.fillStyle='#6b4220';ellipse(c,0,.16,.08,.18);c.restore()});
    if(mouth>.05){c.fillStyle='#ff6b8a';c.beginPath();c.moveTo(mB.x-.07,mB.y-.01);c.lineTo(mB.x-.07,mB.y+.1+mouth);c.arc(mB.x,mB.y+.1+mouth,.07,Math.PI,0,true);c.lineTo(mB.x+.07,mB.y-.01);c.fill();c.strokeStyle='#d94a6a';lw(.012);c.beginPath();c.moveTo(mB.x,mB.y+.01);c.lineTo(mB.x,mB.y+.08+mouth);c.stroke()}
    c.fillStyle='#1a1a1a';ellipse(c,nose.x,nose.y,.085,.06);c.fillStyle='#ffffff66';ellipse(c,nose.x-.03,nose.y-.02,.025,.013);
  }
  if(id==='Gato'){
    [-1,1].forEach(sd=>{c.fillStyle='#f2a65a';c.beginPath();c.moveTo(sd*.16,top.y-.06);c.lineTo(sd*.42,top.y-.4);c.lineTo(sd*.5,top.y+.02);c.fill();
      c.fillStyle='#ffb3c6';c.beginPath();c.moveTo(sd*.24,top.y-.06);c.lineTo(sd*.41,top.y-.29);c.lineTo(sd*.46,top.y-.02);c.fill()});
    c.strokeStyle='#ffffffdd';lw(.01);[-1,1].forEach(sd=>[-.03,.01,.05].forEach(dy=>{c.beginPath();c.moveTo(sd*.1,nose.y+dy);c.lineTo(sd*.38,nose.y+dy*2.2-.02);c.stroke()}));
    c.fillStyle='#ff8fab';c.beginPath();c.moveTo(nose.x-.045,nose.y-.02);c.lineTo(nose.x+.045,nose.y-.02);c.lineTo(nose.x,nose.y+.03);c.fill();
  }
  if(id==='Coroa'){
    const y=top.y-.15,g=c.createLinearGradient(0,y-.3,0,y);g.addColorStop(0,'#fff3a0');g.addColorStop(1,'#e0a100');
    c.fillStyle=g;c.strokeStyle='#a86f00';lw(.012);c.beginPath();c.moveTo(-.3,y);
    [[-.3,y-.2],[-.17,y-.09],[-.08,y-.27],[0,y-.11],[.08,y-.27],[.17,y-.09],[.3,y-.2],[.3,y]].forEach(p=>c.lineTo(p[0],p[1]));c.closePath();c.fill();c.stroke();
    [['#e5243b',-.18],['#2fd0ff',0],['#7c4dff',.18]].forEach(([col,x])=>{c.fillStyle=col;ellipse(c,x,y-.05,.03,.03)});
    c.fillStyle='#fff';for(let i=0;i<5;i++){const k=(t*.8+i*.2)%1;const x=Math.sin(i*2.4)*.45,yy=y-.1-k*.25;c.globalAlpha=1-k;c.font='.08px serif';c.fillText('✦',x,yy)}c.globalAlpha=1;
  }
  if(id==='Corações'){
    for(let i=0;i<7;i++){const an=t*1.2+i*Math.PI*2/7,x=Math.cos(an)*.58,y=top.y-.12+Math.sin(an)*.12,z=Math.sin(an);
      c.fillStyle=['#ff4d8d','#ff7aa8','#e5243b'][i%3];c.globalAlpha=.65+.35*z;heart(c,x,y,.075+.03*z)}
    c.globalAlpha=1;
  }
  if(id==='Blush'){
    [cheekA,cheekB].forEach(p=>{const g=c.createRadialGradient(p.x,p.y+.02,0,p.x,p.y+.02,.13);g.addColorStop(0,'#ff6b8acc');g.addColorStop(1,'#ff6b8a00');c.fillStyle=g;ellipse(c,p.x,p.y+.02,.13,.1)});
    c.fillStyle='#a0522d88';[[-.05,.02],[.03,-.02],[.06,.04],[-.02,-.03],[.0,.05]].forEach(([dx,dy])=>{ellipse(c,cheekA.x+dx+.05,cheekA.y+dy-.02,.008,.008);ellipse(c,cheekB.x-dx-.05,cheekB.y+dy-.02,.008,.008)});
    c.fillStyle='#fff';c.globalAlpha=.5+.5*Math.sin(t*4);c.font='.07px serif';c.fillText('✦',cheekB.x+.1,cheekB.y-.12);c.globalAlpha=1;
  }
  if(id==='Bigode'){
    const y=(noseB.y+lipT.y)/2;c.fillStyle='#2b1a10';
    [-1,1].forEach(sd=>{c.beginPath();c.moveTo(0,y-.02);c.bezierCurveTo(sd*.08,y-.06,sd*.17,y-.04,sd*.2,y+.01);c.bezierCurveTo(sd*.25,y+.04,sd*.3,y-.01,sd*.28,y-.05);c.bezierCurveTo(sd*.33,y+.05,sd*.2,y+.08,sd*.12,y+.03);c.bezierCurveTo(sd*.07,y+.01,sd*.03,y+.02,0,y+.02);c.fill()});
  }
  if(id==='Arco-íris'){
    if(mouth>.06){const cols=['#ff3b30','#ff9500','#ffcc00','#34c759','#007aff','#af52de'];
      cols.forEach((col,i)=>{c.strokeStyle=col;lw(.05);c.beginPath();const ox=(i-2.5)*.05;c.moveTo(mB.x+ox*.4,mB.y);
        c.bezierCurveTo(mB.x+ox,mB.y+.4,mB.x+ox*2+Math.sin(t*3)*.08,mB.y+.8,mB.x+ox*3+Math.sin(t*3+1)*.15,mB.y+1.6);c.stroke()});
    }else{c.fillStyle='#ffffffcc';c.font='bold .07px system-ui';c.textAlign='center';c.fillText('Abra a boca!',0,chin.y+.15)}
  }
  c.restore();
}

// ================= ESTADO / UI =================
let cur=+(localStorage.getItem('nexi-fx')||0)%FX.length,mask=+(localStorage.getItem('nexi-mask')||0)%MASKS.length;
let amount=$('amount'),facing='user',stream=null,mode='photo',recorder=null,chunks=[],recStart=0,shots=[],tab='filters';
amount.value=localStorage.getItem('nexi-amt')||.6;
$('fx').innerHTML=FX.map(([n,e],i)=>`<button data-i="${i}"><span>${e}</span>${n}</button>`).join('');
$('masks').innerHTML=MASKS.map(([n,e],i)=>`<button data-i="${i}"><span>${e}</span>${n}</button>`).join('');
function label(){$('fxName').textContent=FX[cur][0]+(mask?' · '+MASKS[mask][1]:'')}
function mark(list,i){list.querySelectorAll('button').forEach((b,j)=>b.classList.toggle('on',j===i));list.children[i]?.scrollIntoView({inline:'center',behavior:'smooth',block:'nearest'})}
function pick(i){cur=i;localStorage.setItem('nexi-fx',i);mark($('fx'),i);label()}
function pickMask(i){mask=i;localStorage.setItem('nexi-mask',i);mark($('masks'),i);label();smooth=[];if(i)loadFaces()}
$('fx').onclick=e=>{const b=e.target.closest('button');if(b){pick(+b.dataset.i);navigator.vibrate?.(8)}};
$('masks').onclick=e=>{const b=e.target.closest('button');if(b){pickMask(+b.dataset.i);navigator.vibrate?.(8)}};
function setTab(t){tab=t;$('tFilters').classList.toggle('on',t==='filters');$('tMasks').classList.toggle('on',t==='masks');$('fx').hidden=t!=='filters';$('masks').hidden=t!=='masks';$('sliderRow').style.visibility=t==='filters'?'visible':'hidden';mark(t==='filters'?$('fx'):$('masks'),t==='filters'?cur:mask)}
$('tFilters').onclick=()=>setTab('filters');$('tMasks').onclick=()=>setTab('masks');
amount.oninput=()=>localStorage.setItem('nexi-amt',amount.value);
let sx=null;$('stage').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
$('stage').addEventListener('touchend',e=>{if(sx==null)return;const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>60){const dir=d<0?1:-1;tab==='filters'?pick((cur+dir+FX.length)%FX.length):pickMask((mask+dir+MASKS.length)%MASKS.length)}sx=null});
let toastTimer;function toast(text,btn='',fn=null){$('toastText').textContent=text;$('toastBtn').textContent=btn;$('toastBtn').onclick=fn;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),btn?4500:2200)}
pick(cur);pickMask(mask);setTab('filters');

// ================= CÂMERA =================
async function start(){
  stream?.getTracks().forEach(t=>t.stop());
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:mode==='video'})}
  catch(err){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing}})}catch(e){$('msg').style.display='grid';$('msg').querySelector('p').textContent='Não foi possível acessar a câmera: '+(e.message||e.name);return}}
  video.srcObject=stream;await video.play();$('msg').style.display='none';smooth=[];
}
$('startBtn').onclick=start;
$('flip').onclick=()=>{facing=facing==='user'?'environment':'user';start()};

function draw(now){
  requestAnimationFrame(draw);
  if(video.readyState<2)return;
  const w=video.videoWidth,h=video.videoHeight,mir=facing==='user';
  if(glc.width!==w||glc.height!==h){glc.width=out.width=w;glc.height=out.height=h;gl.viewport(0,0,w,h)}
  if(mask)detect();
  const faces=mask?smooth:[];
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,video);
  const P=progs[cur];gl.useProgram(P.p);
  gl.enableVertexAttribArray(P.loc);gl.vertexAttribPointer(P.loc,2,gl.FLOAT,false,0,0);
  gl.uniform1f(P.t,now/1000);gl.uniform1f(P.a,+amount.value);gl.uniform2f(P.res,w,h);gl.uniform1f(P.mir,mir?1:0);
  if(MASKS[mask][0]==='Olhos grandes'&&faces[0]){const f=faces[0],e1=[(f[33].x+f[133].x)/2,(f[33].y+f[133].y)/2],e2=[(f[362].x+f[263].x)/2,(f[362].y+f[263].y)/2];
    gl.uniform2f(P.eL,e1[0],e1[1]);gl.uniform2f(P.eR,e2[0],e2[1]);gl.uniform1f(P.er,Math.hypot((e1[0]-e2[0])*w,(e1[1]-e2[1])*h)/h*.78)}
  else gl.uniform1f(P.er,0);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(glc,0,0);
  const id=MASKS[mask][0];if(id!=='Olhos grandes')faces.forEach(f=>drawMask(id,f,w,h,mir,now/1000));
}
requestAnimationFrame(draw);

// ================= CAPTURA / GALERIA =================
function stamp(){return new Date().toISOString().slice(0,19).replace(/[T:]/g,'-')}
function b64(blob){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(blob)})}
async function save(shot){
  if(native){try{await Gallery.save({data:await b64(shot.blob),mime:shot.blob.type,name:shot.name});return 'Salvo na galeria ✓'}catch(e){console.error(e);return 'Erro ao salvar: '+(e.message||e)}}
  const a=document.createElement('a');a.href=shot.url;a.download=shot.name;a.click();return 'Baixado ✓';
}
async function share(shot){
  try{
    if(native)return await Gallery.share({data:await b64(shot.blob),mime:shot.blob.type,name:shot.name});
    const file=new File([shot.blob],shot.name,{type:shot.blob.type});
    if(navigator.canShare?.({files:[file]}))return await navigator.share({files:[file],title:'NEXI'});
    toast('Compartilhamento não suportado neste navegador');
  }catch(e){if(e.name!=='AbortError')console.error(e)}
}
async function addShot(blob,type,ext){
  const shot={blob,type,url:URL.createObjectURL(blob),name:`nexi-${stamp()}.${ext}`};shots.unshift(shot);
  const th=$('thumb');th.style.backgroundImage=type==='img'?`url(${shot.url})`:'none';th.textContent=type==='img'?'':'🎬';
  toast(await save(shot),'Compartilhar',()=>share(shot));
}
function photo(){
  $('flash').classList.remove('go');void $('flash').offsetWidth;$('flash').classList.add('go');navigator.vibrate?.(20);
  out.toBlob(b=>addShot(b,'img','jpg'),'image/jpeg',.92);
}
function toggleRec(){
  if(recorder){recorder.stop();return}
  const s=out.captureStream(30);stream?.getAudioTracks().forEach(t=>s.addTrack(t));
  const mime=['video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||'';
  recorder=new MediaRecorder(s,mime?{mimeType:mime}:{});chunks=[];
  recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  recorder.onstop=()=>{const type=(recorder.mimeType||'video/webm').split(';')[0];addShot(new Blob(chunks,{type}),'vid',type.includes('mp4')?'mp4':'webm');recorder=null;$('shutter').classList.remove('recording');$('rec').classList.remove('on')};
  recorder.start(1000);recStart=Date.now();$('shutter').classList.add('recording');$('rec').classList.add('on');
}
setInterval(()=>{if(!recorder)return;const s=Math.floor((Date.now()-recStart)/1000);$('rec').textContent=String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},250);
$('shutter').onclick=()=>{if(!stream)return start();mode==='photo'?photo():toggleRec()};
function setMode(m){if(recorder)return;mode=m;$('mPhoto').classList.toggle('on',m==='photo');$('mVideo').classList.toggle('on',m==='video');$('shutter').classList.toggle('video',m==='video');if(stream&&m==='video'&&!stream.getAudioTracks().length)start()}
$('mPhoto').onclick=()=>setMode('photo');$('mVideo').onclick=()=>setMode('video');
$('thumb').onclick=e=>{e.preventDefault();$('grid').innerHTML=shots.length?shots.map((s,i)=>`<button data-i="${i}">${s.type==='img'?`<img src="${s.url}">`:`<video src="${s.url}" muted playsinline></video><b>🎬</b>`}</button>`).join(''):'<div class="empty">Nenhuma captura ainda.</div>';$('gallery').classList.add('open')};
$('grid').onclick=e=>{const b=e.target.closest('button');if(!b)return;const s=shots[+b.dataset.i];$('viewer').innerHTML=s.type==='img'?`<img src="${s.url}">`:`<video src="${s.url}" controls autoplay playsinline></video>`;$('shareView').onclick=()=>share(s);$('viewerBox').classList.add('open')};
$('closeGal').onclick=()=>$('gallery').classList.remove('open');
$('closeView').onclick=()=>{$('viewer').innerHTML='';$('viewerBox').classList.remove('open')};

// ================= INSTALAÇÃO (PWA, só na web) =================
if(!native&&'serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
let deferred=null;
const standalone=native||matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('installBtn').classList.add('show')});
addEventListener('appinstalled',()=>{deferred=null;$('installBtn').classList.remove('show')});
if(ios&&!standalone)$('installBtn').classList.add('show');
$('installBtn').onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;$('installBtn').classList.remove('show')}else $('iosSheet').classList.add('open')};
$('iosClose').onclick=()=>$('iosSheet').classList.remove('open');

if(!navigator.mediaDevices?.getUserMedia)$('msg').querySelector('p').textContent='Seu navegador não suporta câmera (use HTTPS).';
else start();
</script>
